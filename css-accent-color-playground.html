<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Change the accent-color CSS property and compare native form controls live."><title>CSS Accent Color Playground</title><style>
:root{color-scheme:light dark;--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#64748b;--accent:#5b5ce2;--line:#dce2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}h1{line-height:1.15;margin:.35rem 0}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 28px #1720330a}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:white;font-weight:700;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#e8eaff;color:#292b80}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9294ff;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.output{padding:14px;border-radius:12px;background:#111827;color:#e5e7eb;overflow-wrap:anywhere;min-height:54px}small,.hint{color:var(--muted)}.status{min-height:1.5em;color:var(--accent);font-weight:650}.demo{border:1px dashed var(--line);padding:16px;border-radius:12px;margin-top:14px}@media(prefers-color-scheme:dark){:root{--bg:#101827;--panel:#172235;--ink:#eef2ff;--muted:#aab6ca;--line:#344258}button.secondary{background:#30365e;color:#eef2ff}}@media(max-width:520px){.wrap{margin:24px auto}.panel{padding:16px}}
</style></head><body><main class="wrap"><span class="eyebrow">Frontend Development Journey</span><h1>CSS Accent Color Playground</h1><p>Change the accent-color CSS property and compare native form controls live.</p><section class="panel"><label for="color">Choose an accent color</label><input id="color" type="color" value="#5b5ce2" style="height:52px"><label for="sample">Accent color preview</label><div class="demo" id="sample"><label><input type="checkbox" checked> Subscribe to updates</label><label><input type="radio" name="plan" checked> Starter plan</label><label><input type="radio" name="plan"> Pro plan</label><label for="range">Progress <input id="range" type="range" value="65"></label><label for="progress">Progress indicator</label><progress id="progress" max="100" value="65"></progress></div><p class="status" id="value" aria-live="polite"></p><button class="secondary" id="reset">Reset color</button></section></main><script>const picker=document.querySelector('#color'),sample=document.querySelector('#sample'),value=document.querySelector('#value');function apply(){sample.style.accentColor=picker.value;value.textContent='accent-color: '+picker.value}picker.addEventListener('input',apply);document.querySelector('#reset').onclick=()=>{picker.value='#5b5ce2';apply()};apply();</script></body></html>
