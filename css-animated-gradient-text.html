<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Animated Gradient Text</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1020;color:#e2e8f0;font-family:system-ui,sans-serif}
main{max-width:760px;text-align:center}.eyebrow{letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;color:#94a3b8}
h1{font-size:clamp(2.7rem,9vw,6rem);line-height:1.05;margin:22px 0;background:linear-gradient(90deg,#60a5fa,#c084fc,#f472b6,#60a5fa);background-size:300% 100%;color:transparent;background-clip:text;-webkit-background-clip:text;animation:flow 7s ease-in-out infinite}
p{max-width:560px;margin:0 auto 26px;color:#cbd5e1;line-height:1.7}.pill{display:inline-block;border:1px solid #64748b;border-radius:999px;padding:10px 16px;color:#e2e8f0}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media(prefers-reduced-motion:reduce){h1{animation:none;background-position:50% 50%}}
</style></head><body><main><div class="eyebrow">CSS animation study</div><h1>Make your ideas shine.</h1><p>A lightweight animated gradient heading using CSS background gradients, background clipping, and a motion-friendly reduced-motion fallback.</p><span class="pill">HTML + CSS · No JavaScript</span></main></body></html>
