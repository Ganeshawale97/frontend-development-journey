<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Skeleton Loader</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;background:#f3f5f9;font:16px system-ui;color:#202b3d}.wrap{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 10px 28px #1c29400d}.sk{background:linear-gradient(100deg,#e4e8ef 25%,#f6f7fa 40%,#e4e8ef 60%);background-size:200% 100%;animation:shine 1.3s ease-in-out infinite;border-radius:8px}.photo{height:135px;margin-bottom:16px}.line{height:13px;margin:12px 0}.short{width:55%}.button{height:34px;width:100px;margin-top:16px}@keyframes shine{to{background-position:-200% 0}}.real{display:none}.loaded .skeleton{display:none}.loaded .real{display:block}button{padding:11px 16px;background:#4659df;color:white;border:0;border-radius:9px;cursor:pointer;margin:14px 0}@media(prefers-reduced-motion:reduce){.sk{animation:none}}</style><body><main class="wrap"><h1>CSS Skeleton Loader</h1><p>Explore shimmer placeholders used while content loads.</p><button id="toggle">Show loaded content</button><div class="grid" id="demo"><article class="card skeleton"><div class="sk photo"></div><div class="sk line"></div><div class="sk line short"></div><div class="sk button"></div></article><article class="card skeleton"><div class="sk photo"></div><div class="sk line"></div><div class="sk line short"></div><div class="sk button"></div></article><article class="card skeleton"><div class="sk photo"></div><div class="sk line"></div><div class="sk line short"></div><div class="sk button"></div></article><article class="card real"><div style="font-size:2rem">🪴</div><h2>Plant care basics</h2><p>Simple tips for healthier houseplants.</p></article><article class="card real"><div style="font-size:2rem">💻</div><h2>Frontend practice</h2><p>Build small projects and keep learning.</p></article><article class="card real"><div style="font-size:2rem">📚</div><h2>Study smarter</h2><p>Use short focused sessions and take breaks.</p></article></div></main><script>const demo=document.querySelector('#demo'),btn=document.querySelector('#toggle');btn.onclick=()=>{demo.classList.toggle('loaded');btn.textContent=demo.classList.contains('loaded')?'Show skeletons':'Show loaded content'};</script></body></html>
