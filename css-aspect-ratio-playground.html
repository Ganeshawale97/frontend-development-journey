<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore responsive CSS aspect ratios with a live preview and generated CSS."><title>CSS Aspect Ratio Playground | Frontend Development Journey</title><style>:root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#dbe2ee;--accent:#315eea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.wrap{width:min(850px,calc(100% - 32px));margin:40px auto}h1{font-size:clamp(1.8rem,5vw,2.6rem)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}p{color:var(--muted)}label{display:block;font-weight:650;margin:14px 0}input,select{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}button{padding:11px 16px;border:0;border-radius:9px;background:var(--accent);color:white;font:inherit;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7ca2ff;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stage{min-height:180px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#e8edf8,#e8edf8 10px,#f5f7fb 10px,#f5f7fb 20px);border-radius:12px;padding:18px;margin:18px 0}#frame{max-width:100%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#a855f7);color:white;border-radius:12px}pre{white-space:pre-wrap;background:#101827;color:#dce8ff;padding:16px;border-radius:10px;overflow-wrap:anywhere}.status{padding:12px;background:#eef3ff;color:#203052;border-radius:9px}@media(prefers-color-scheme:dark){:root{--bg:#101827;--panel:#172235;--ink:#edf2ff;--muted:#a6b2c8;--line:#344158}.stage{background:repeating-linear-gradient(45deg,#263349,#263349 10px,#1a2638 10px,#1a2638 20px)}.status{background:#24365a;color:#e5edff}}</style></head><body><main class="wrap"><p>FRONTEND DEVELOPMENT JOURNEY · CSS LAB</p><h1>CSS Aspect Ratio Playground</h1><p>Choose a common media ratio or enter custom dimensions. Resize the preview and copy the CSS.</p><section class="panel"><label>Preset<select id="preset"><option value="16/9">16:9 video</option><option value="4/3">4:3 classic</option><option value="1/1">1:1 square</option><option value="3/2">3:2 photo</option><option value="9/16">9:16 portrait</option><option value="custom">Custom</option></select></label><div class="grid"><label>Width ratio<input id="w" type="number" min="1" value="16"></label><label>Height ratio<input id="h" type="number" min="1" value="9"></label></div><label>Preview width <output id="widthVal">100%</output><input id="width" type="range" min="25" max="100" value="100"></label><div class="stage"><div id="frame">Responsive frame</div></div><pre id="code"></pre><button id="copy">Copy CSS</button><p id="status" class="status" aria-live="polite">Adjust the ratio to update the preview.</p></section></main><script>const preset=document.querySelector('#preset'),w=document.querySelector('#w'),h=document.querySelector('#h');preset.onchange=()=>{if(preset.value!=='custom'){[w.value,h.value]=preset.value.split('/')}update()};function update(){const a=Number(w.value),b=Number(h.value),width=Number(document.querySelector('#width').value),frame=document.querySelector('#frame');document.querySelector('#widthVal').textContent=width+'%';if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||b<1){document.querySelector('#status').textContent='Use positive whole numbers for both ratio values.';return}frame.style.width=width+'%';frame.style.aspectRatio=a+' / '+b;document.querySelector('#code').textContent='aspect-ratio: '+a+' / '+b+';\\nwidth: '+width+'%;';document.querySelector('#status').textContent='Ratio '+a+':'+b+' · '+(a/b).toFixed(3)+' wide-to-high.'} [w,h,document.querySelector('#width')].forEach(el=>el.oninput=update);document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.querySelector('#code').textContent);document.querySelector('#status').textContent='CSS copied.'}catch{document.querySelector('#status').textContent='Clipboard unavailable; select and copy the CSS.'}};update();</script></body></html>
