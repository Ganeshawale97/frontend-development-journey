<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bento Grid Layout</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(130px,auto);gap:14px}.tile{padding:22px;border-radius:18px;background:#dbeafe}.tile h2{margin-top:0}.tile p{line-height:1.5}.large{grid-column:span 2;grid-row:span 2;background:#c7d2fe}.wide{grid-column:span 2;background:#dcfce7}.dark{background:#1e293b;color:#f8fafc}.pink{background:#fce7f3}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto}.tile{padding:16px}.large{grid-row:span 1}.large,.wide{grid-column:span 2}}
</style></head><body><main class="wrap"><h1>Bento Grid</h1><p>A responsive card layout using CSS Grid.</p><section class="grid"><article class="tile large"><h2>Build something useful</h2><p>Combine small, focused components into a clear interface. CSS Grid makes it easy to arrange different card sizes.</p></article><article class="tile dark"><h2>01</h2><p>Learn</p></article><article class="tile pink"><h2>02</h2><p>Practice</p></article><article class="tile wide"><h2>Responsive by design</h2><p>The layout changes at smaller screen widths.</p></article><article class="tile"><h2>03</h2><p>Build</p></article></section></main></body></html>
