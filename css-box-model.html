<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid black;
            margin: 30px;
        }

        .content {
            background-color: lightgray;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>CSS Box Model</h1>
        <p>Practice with content, padding, border and margin.</p>
    </header>

    <hr>

    <main>
        <div class="box">
            <div class="content">
                <h2>My Box</h2>
                <p>This example demonstrates the basic CSS box model.</p>
            </div>
        </div>

        <h2>Box Model Parts</h2>
        <ol>
            <li>Content</li>
            <li>Padding</li>
            <li>Border</li>
            <li>Margin</li>
        </ol>
    </main>

    <hr>

    <footer>
        <p>Created by Ganesh Awale | Frontend Development Journey</p>
    </footer>
</body>
</html>
