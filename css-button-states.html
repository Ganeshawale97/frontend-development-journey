<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Button States</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}.panel{max-width:620px;background:white;padding:28px;border-radius:16px;box-shadow:0 10px 30px #0f172a10}.row{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{border:0;border-radius:9px;padding:12px 16px;font:inherit;cursor:pointer;transition:background .2s,transform .2s}.primary{background:#2563eb;color:white}.primary:hover{background:#1d4ed8;transform:translateY(-2px)}.secondary{background:#e2e8f0;color:#0f172a}.secondary:hover{background:#cbd5e1}.outline{background:white;border:2px solid #7c3aed;color:#6d28d9}.outline:hover{background:#f5f3ff}button:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:not-allowed}.note{line-height:1.6}</style></head><body><main class="panel"><h1>CSS Button States</h1><p class="note">Hover, focus, active, and disabled states help people understand how a control behaves.</p><div class="row"><button class="primary">Primary</button><button class="secondary">Secondary</button><button class="outline">Outline</button><button disabled>Disabled</button></div><p class="note"><strong>Try it:</strong> hover over buttons, use Tab to focus them, and click to see the active state.</p><small>Practice: pseudo-classes, transitions, and visible keyboard focus.</small></main></body></html>
