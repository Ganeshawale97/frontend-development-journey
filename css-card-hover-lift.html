<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card Hover Lift</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f1f5f9;font-family:system-ui,sans-serif;color:#0f172a}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:900px}.card{background:white;padding:24px;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 5px 14px #0f172a0a;transition:transform .25s ease,box-shadow .25s ease}.card:hover,.card:focus-within{transform:translateY(-8px);box-shadow:0 18px 35px #0f172a1a}.icon{font-size:2rem}.card a{color:#4f46e5;font-weight:700;text-underline-offset:4px}@media(max-width:650px){.cards{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style></head><body><main class="cards"><article class="card"><div class="icon">✦</div><h2>Design</h2><p>Build clear, friendly interfaces with thoughtful spacing.</p><a href="#design">Explore design</a></article><article class="card"><div class="icon">⌘</div><h2>Develop</h2><p>Turn ideas into accessible, responsive web pages.</p><a href="#develop">Explore development</a></article><article class="card"><div class="icon">↗</div><h2>Improve</h2><p>Test small details and make each interaction feel polished.</p><a href="#improve">Explore improvements</a></article></main></body></html>
