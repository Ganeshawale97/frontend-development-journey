<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dark Mode Layout</title>
<style>
:root{color-scheme:light;--bg:#f8fafc;--panel:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--accent:#4f46e5}
:root:has(#mode:checked){color-scheme:dark;--bg:#0f172a;--panel:#1e293b;--text:#f8fafc;--muted:#cbd5e1;--line:#334155;--accent:#a5b4fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif;transition:background .2s,color .2s}.wrap{max-width:850px;margin:auto;padding:24px}.top,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.muted{color:var(--muted)}label{cursor:pointer;color:var(--accent);font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Theme-aware Dashboard</h1><p class="muted">A CSS custom properties demonstration.</p></div><label><input id="mode" type="checkbox"> Dark mode</label></header><section class="grid"><article class="panel"><h2>Weekly focus</h2><p class="muted">Learn one concept, practise it, then build a small project.</p></article><article class="panel"><h2>Quick reminder</h2><p class="muted">Use shared CSS variables to keep themes consistent.</p></article></section></main></body></html>
