<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Experiment with flex direction, alignment and gap using a live layout."><title>Flexbox Playground | Frontend Development Journey</title><style>:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:36px auto;padding:0 18px}header,main{background:white;border:1px solid #dbe2ea;border-radius:16px;padding:clamp(18px,4vw,32px);margin-bottom:16px}h1{font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 8px}p{color:#64748b}label{display:block;font-weight:650;margin:14px 0}input,select,textarea{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#5657d9;color:white;border:0;border-radius:8px;padding:10px 14px;margin:5px 5px 5px 0;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}pre{background:#111827;color:#e5e7eb;padding:15px;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}.preview{border:1px dashed #a5b4fc;border-radius:10px;padding:18px;margin:18px 0;min-height:120px;overflow:auto}.preview span{background:#c7d2fe;padding:15px;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cards article{border:1px solid #dbe2ea;padding:14px;border-radius:9px;overflow-wrap:anywhere}.cards small{display:block;color:#64748b;margin-top:6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.wrap{margin:16px auto}.cols{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><h1>Flexbox Playground</h1><p>Experiment with flex direction, alignment and gap using a live layout.</p></header><main><label>Direction<select id="d"><option>row</option><option>column</option><option>row-reverse</option><option>column-reverse</option></select></label><label>Justify<select id="j"><option>flex-start</option><option>center</option><option>space-between</option><option>space-around</option><option>space-evenly</option></select></label><label>Align<select id="a"><option>stretch</option><option>center</option><option>flex-start</option><option>flex-end</option></select></label><label>Gap<input id="g" type="range" min="0" max="40" value="12"></label><div id="preview" class="preview"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><pre id="out"></pre></main></div><script>function draw(){preview.style.cssText="display:flex;min-height:160px;flex-wrap:wrap;flex-direction:"+d.value+";justify-content:"+j.value+";align-items:"+a.value+";gap:"+g.value+"px";out.textContent="display:flex;\nflex-direction:"+d.value+";\njustify-content:"+j.value+";\nalign-items:"+a.value+";\ngap:"+g.value+"px;"}[d,j,a,g].forEach(x=>x.oninput=draw);draw();</script></body></html>
