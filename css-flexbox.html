<!DOCTYPE html>
<html>
<head>
    <title>CSS Flexbox Practice</title>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border: 2px solid black;
            padding: 20px;
        }

        .box {
            padding: 30px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <h1>CSS Flexbox</h1>
    <p>Flexbox helps arrange elements in rows or columns.</p>

    <div class="container">
        <div class="box">HTML</div>
        <div class="box">CSS</div>
        <div class="box">JavaScript</div>
    </div>

    <h2>Properties Practiced</h2>
    <ul>
        <li>display: flex</li>
        <li>justify-content</li>
        <li>align-items</li>
        <li>gap</li>
    </ul>
</body>
</html>
