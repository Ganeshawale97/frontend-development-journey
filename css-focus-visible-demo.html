<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Keyboard Focus Styles</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;font:16px/1.6 system-ui,sans-serif;background:#eff6ff;color:#172554}.wrap{max-width:700px;margin:auto;background:white;padding:26px;border-radius:16px}a,button,input{font:inherit;border-radius:8px;padding:11px 14px}a{display:inline-block;color:#1d4ed8}button{border:0;background:#1d4ed8;color:white;cursor:pointer}input{border:1px solid #94a3b8;max-width:100%}:focus-visible{outline:3px solid #f97316;outline-offset:4px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0}.note{color:#475569}
</style></head><body><main class="wrap"><h1>Keyboard Focus Styles</h1><p class="note">Use the Tab key to move between controls and see the focus indicator. Clear focus styles help keyboard users navigate.</p><div class="row"><a href="#example">Example link</a><button type="button">Example button</button><label>Search <input type="text" placeholder="Type here"></label></div><p id="example">The orange outline is created with the CSS <code>:focus-visible</code> selector.</p></main></body></html>
