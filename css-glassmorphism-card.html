<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Glassmorphism Card</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;color:white;background:linear-gradient(135deg,#0f172a,#4338ca 55%,#0891b2);overflow:hidden}
body:before,body:after{content:"";position:fixed;width:240px;height:240px;border-radius:50%;filter:blur(2px);z-index:-1}
body:before{background:#f472b6;top:8%;left:8%}body:after{background:#38bdf8;right:8%;bottom:8%}
.card{width:min(100%,380px);padding:30px;border:1px solid #ffffff55;border-radius:24px;background:#ffffff20;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px #0003}
.label{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:#e0e7ff}.card h1{font-size:2rem;margin:12px 0}.card p{line-height:1.6;color:#f1f5f9}
.tags{display:flex;gap:8px;flex-wrap:wrap}.tags span{padding:7px 10px;border:1px solid #ffffff55;border-radius:999px;font-size:.85rem}
a{display:inline-block;margin-top:18px;color:white;font-weight:bold;text-underline-offset:4px}
@supports not (backdrop-filter:blur(16px)){.card{background:#312e81ee}}
</style></head>
<body><article class="card"><div class="label">Frontend journey</div><h1>Design with depth.</h1><p>A glassmorphism card made with CSS gradients, transparency, rounded corners, and backdrop blur.</p><div class="tags"><span>HTML</span><span>CSS</span><span>Responsive</span></div><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/backdrop-filter" target="_blank" rel="noreferrer">Learn about backdrop-filter ↗</a></article></body></html>
