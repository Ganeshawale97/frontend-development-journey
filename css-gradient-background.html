<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Gradient Practice</title>
<style>
body{font-family:Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#dceeff,#f8e1f4)}main{margin:24px;padding:32px;max-width:560px;background:#ffffffd9;border-radius:16px;box-shadow:0 8px 24px #0002}button{padding:10px 14px;cursor:pointer}
</style></head><body><main><h1>CSS Gradient Background</h1><p>This page uses a linear gradient. Try changing the angle and color stops in the CSS.</p><button id="change">Change Gradient</button></main>
<script>
const gradients=["linear-gradient(135deg,#dceeff,#f8e1f4)","linear-gradient(135deg,#d9f7e8,#dce4ff)","linear-gradient(135deg,#fff0c9,#ffd9d9)"];let index=0;
document.getElementById("change").addEventListener("click",()=>{index=(index+1)%gradients.length;document.body.style.background=gradients[index];});
</script></body></html>
