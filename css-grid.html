<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Practice</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .card {
            border: 2px solid black;
            padding: 30px;
            text-align: center;
        }

        .wide {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <h1>CSS Grid Layout</h1>
    <p>Practice creating rows and columns using CSS Grid.</p>

    <div class="grid-container">
        <div class="card wide">HTML</div>
        <div class="card">CSS</div>
        <div class="card">JavaScript</div>
        <div class="card">React</div>
        <div class="card">Git</div>
    </div>

    <h2>Properties Practiced</h2>
    <ul>
        <li>display: grid</li>
        <li>grid-template-columns</li>
        <li>gap</li>
        <li>grid-column</li>
    </ul>

</body>
</html>
