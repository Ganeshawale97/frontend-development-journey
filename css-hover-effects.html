<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Hover Effects</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f3f6fc}article{padding:24px;background:white;border-radius:12px;transition:transform .2s,box-shadow .2s}article:hover{transform:translateY(-5px);box-shadow:0 12px 24px #0002}</style></head><body><h1>CSS Hover Effects</h1><article><h2>Hover over this card</h2><p>The card moves slightly and gains a shadow. Experiment with the transition duration and transform values.</p></article></body></html>
