<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Loading Animations</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{max-width:760px;width:100%;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:24px}.demo{background:#1e293b;border-radius:14px;padding:24px;min-height:160px;display:grid;place-items:center;gap:12px}.spinner{width:42px;height:42px;border:5px solid #475569;border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite}.dots{display:flex;gap:7px}.dots span{width:12px;height:12px;border-radius:50%;background:#a78bfa;animation:bounce .6s ease-in-out infinite alternate}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}.bar{width:130px;height:8px;background:#334155;border-radius:10px;overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;background:#34d399;border-radius:10px;animation:slide 1s ease-in-out infinite alternate}code{color:#7dd3fc}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bounce{to{transform:translateY(-12px);opacity:.55}}@keyframes slide{from{transform:translateX(-20%)}to{transform:translateX(140%)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:2s!important;animation-iteration-count:1!important}}</style></head>
<body><main class="wrap"><h1>CSS Loading Animations</h1><p>Three loading indicators made with CSS only — no JavaScript required.</p><div class="grid"><section class="demo"><div class="spinner" role="img" aria-label="Spinning loader"></div><strong>Spinner</strong><code>transform: rotate()</code></section><section class="demo"><div class="dots" role="img" aria-label="Bouncing dots"><span></span><span></span><span></span></div><strong>Bouncing dots</strong><code>animation-delay</code></section><section class="demo"><div class="bar" role="img" aria-label="Progress animation"></div><strong>Sliding bar</strong><code>pseudo-elements</code></section></div><p>Try changing the keyframe duration or animation timing to see the difference.</p></main></body></html>
