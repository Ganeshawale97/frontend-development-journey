<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navigation Bar</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0}.navbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#172554;color:white}.brand{font-size:1.25rem;font-weight:bold}.links{display:flex;gap:18px}.links a{color:white;text-decoration:none}.links a:hover{text-decoration:underline}.menu{display:none}
@media(max-width:600px){.navbar{align-items:flex-start;flex-wrap:wrap}.menu{display:block;background:transparent;color:white;border:1px solid white;padding:6px 10px}.links{display:none;flex-direction:column;width:100%;padding-top:16px}.links.open{display:flex}}
main{padding:24px}
</style>
</head>
<body>
<nav class="navbar" aria-label="Main navigation">
<span class="brand">MyWebsite</span>
<button class="menu" id="menu" aria-expanded="false" aria-controls="links">Menu</button>
<div class="links" id="links"><a href="#home">Home</a><a href="#about">About</a><a href="#projects">Projects</a><a href="#contact">Contact</a></div>
</nav>
<main id="home"><h1>Responsive Navbar</h1><p>Resize the browser window. On smaller screens, use the Menu button to show or hide the links.</p><section id="about"><h2>About</h2><p>This practice page uses Flexbox and a CSS media query.</p></section><section id="projects"><h2>Projects</h2><p>Add your project links here.</p></section><section id="contact"><h2>Contact</h2><p>Add contact information here.</p></section></main>
<script>
const menu=document.getElementById("menu");const links=document.getElementById("links");
menu.addEventListener("click",function(){const isOpen=links.classList.toggle("open");menu.setAttribute("aria-expanded",String(isOpen));});
</script>
</body>
</html>
