<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Profile Badge</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#ecfeff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;color:#164e63}.profile{background:white;width:min(100%,390px);padding:28px;border-radius:20px;text-align:center;box-shadow:0 14px 40px #155e751c}.avatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:linear-gradient(135deg,#06b6d4,#6366f1);color:white;font-size:2rem;font-weight:bold}.badge{display:inline-block;padding:6px 11px;border-radius:999px;background:#cffafe;color:#155e75;font-size:.85rem;font-weight:bold}.skills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}.skills span{background:#f1f5f9;padding:7px 10px;border-radius:8px;color:#334155;font-size:.9rem}h1{margin:8px 0}p{line-height:1.5;color:#475569}</style></head><body><main class="profile"><div class="avatar" aria-hidden="true">JD</div><span class="badge">● Available for projects</span><h1>Jordan Dev</h1><p>Frontend learner who enjoys building useful, accessible web experiences.</p><div class="skills"><span>HTML</span><span>CSS</span><span>JavaScript</span><span>Responsive Design</span></div><p><small>Practice: flex-wrap, gradients, border-radius, and reusable visual styles.</small></p></main></body></html>
