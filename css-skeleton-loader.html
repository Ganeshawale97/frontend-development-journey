<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Skeleton Loader</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f1f5f9;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;color:#0f172a}.card{background:white;padding:20px;border-radius:16px;max-width:520px;width:100%;box-shadow:0 10px 30px #0f172a0d}.skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f8fafc 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}.avatar{width:64px;height:64px;border-radius:50%}.line{height:14px;margin-top:12px}.short{width:45%}.medium{width:70%}.wide{width:100%}.row{display:flex;gap:14px;align-items:center}.row .text{flex:1}@keyframes shimmer{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}</style></head><body><main class="card"><h1>Skeleton Loading UI</h1><p>Placeholder shapes can help show where content will appear while a page loads.</p><div class="row" aria-label="Example loading profile"><div class="skeleton avatar"></div><div class="text"><div class="skeleton line short"></div><div class="skeleton line medium"></div></div></div><div class="skeleton line wide"></div><div class="skeleton line wide"></div><div class="skeleton line medium"></div><p><small>Practice: gradients, keyframes, responsive layouts, and reduced-motion preferences.</small></p></main></body></html>
