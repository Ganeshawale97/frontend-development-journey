<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS SVG Pattern Studio</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d30;--line:#2a3852;--text:#eef4ff;--muted:#9eacc3;--accent:#8eafff;--mint:#68dfbf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#1a2b49,var(--bg) 50%);color:var(--text);font:16px/1.55 system-ui,sans-serif}.wrap{max-width:1000px;width:92%;margin:38px auto}.eyebrow{color:var(--mint);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.2rem);margin:.3rem 0}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel{background:#121b2c;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}.field{margin-bottom:14px}.field label{display:block;font-weight:650;margin-bottom:6px}.field input,.field select{width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:#091321;color:white;font:inherit}.field input[type=color]{height:42px;padding:4px}.field input[type=range]{padding:0}.preview{height:360px;border-radius:13px;border:1px solid var(--line);background-color:#f2f5fa;overflow:hidden}.code{width:100%;min-height:170px;background:#091220;border:1px solid var(--line);border-radius:10px;padding:12px;color:#cfe0ff;font:12px/1.6 ui-monospace,monospace}.btn{background:#29416d;color:white;border:1px solid #486396;border-radius:9px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer}.status{color:var(--muted);min-height:22px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:760px){.layout{grid-template-columns:1fr}.preview{height:280px}.wrap{margin:24px auto}}
</style></head><body><main class="wrap"><div class="eyebrow">CSS · Generators</div><h1>SVG Pattern Studio</h1><p class="muted">Create a lightweight repeating SVG background, preview it live, and copy the CSS data URL. No image files or libraries required.</p>
<div class="layout"><section class="panel"><h2>Pattern settings</h2><div class="field"><label for="kind">Pattern type</label><select id="kind"><option value="dots">Dots</option><option value="grid">Grid</option><option value="diagonal">Diagonal lines</option><option value="checker">Checkerboard</option></select></div><div class="field"><label for="background">Background color</label><input id="background" type="color" value="#f2f5fa"></div><div class="field"><label for="foreground">Pattern color</label><input id="foreground" type="color" value="#7892c8"></div><div class="field"><label for="size">Tile size: <output id="sizeValue">32</output> px</label><input id="size" type="range" min="8" max="100" value="32"></div><div class="field"><label for="opacity">Pattern opacity: <output id="opacityValue">35</output>%</label><input id="opacity" type="range" min="5" max="100" value="35"></div></section>
<section class="panel"><h2>Live preview</h2><div id="preview" class="preview" role="img" aria-label="Generated repeating SVG background preview"></div><h2>Generated CSS</h2><textarea id="css" class="code" readonly aria-label="Generated CSS background"></textarea><button class="btn" id="copy">Copy CSS</button><p id="status" class="status" role="status"></p></section></div></main>
<script>
const kind=document.getElementById("kind"),bg=document.getElementById("background"),fg=document.getElementById("foreground"),size=document.getElementById("size"),opacity=document.getElementById("opacity"),preview=document.getElementById("preview"),css=document.getElementById("css");
function update(){const s=Number(size.value),o=(Number(opacity.value)/100).toFixed(2),a=fg.value;let shape="";if(kind.value==="dots")shape='<circle cx="'+(s/2)+'" cy="'+(s/2)+'" r="'+Math.max(1,s/10)+'" fill="'+a+'" fill-opacity="'+o+'"/>';if(kind.value==="grid")shape='<path d="M '+s+' 0 H 0 V '+s+'" fill="none" stroke="'+a+'" stroke-opacity="'+o+'" stroke-width="1.2"/>';if(kind.value==="diagonal")shape='<path d="M -'+s/2+' '+s/2+' L '+s/2+' -'+s/2+' M 0 '+s+' L '+s+' 0 M '+s/2+' '+s*1.5+' L '+s*1.5+' '+s/2+'" fill="none" stroke="'+a+'" stroke-opacity="'+o+'" stroke-width="2"/>';if(kind.value==="checker")shape='<rect width="'+(s/2)+'" height="'+(s/2)+'" fill="'+a+'" fill-opacity="'+o+'"/><rect x="'+(s/2)+'" y="'+(s/2)+'" width="'+(s/2)+'" height="'+(s/2)+'" fill="'+a+'" fill-opacity="'+o+'"/>';const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'">'+shape+'</svg>';const uri="data:image/svg+xml,"+encodeURIComponent(svg);preview.style.backgroundColor=bg.value;preview.style.backgroundImage='url("'+uri+'")';preview.style.backgroundSize=s+"px "+s+"px";css.value="background-color: "+bg.value+";\\nbackground-image: url(\\""+uri+"\\");\\nbackground-size: "+s+"px "+s+"px;";document.getElementById("sizeValue").textContent=s;document.getElementById("opacityValue").textContent=opacity.value}
[kind,bg,fg,size,opacity].forEach(el=>el.addEventListener("input",update));document.getElementById("copy").addEventListener("click",()=>navigator.clipboard.writeText(css.value).then(()=>document.getElementById("status").textContent="CSS copied.").catch(()=>document.getElementById("status").textContent="Clipboard permission is unavailable."));update();
</script></body></html>
