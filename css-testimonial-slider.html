<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testimonial Slider</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101a2d;color:#f7f8fc;font:16px system-ui;padding:20px}.wrap{width:min(100%,720px);text-align:center}.eyebrow{letter-spacing:3px;text-transform:uppercase;color:#a9b6d1;font-size:.8rem}.slider{background:#1c2942;border:1px solid #344361;border-radius:24px;padding:clamp(24px,6vw,50px);margin:22px 0;box-shadow:0 24px 70px #0003}.quote{font-size:clamp(1.2rem,3vw,1.7rem);line-height:1.6}.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#6a70dc;font-size:1.4rem;margin:24px auto 10px}.role{color:#a9b6d1}.controls{display:flex;justify-content:center;gap:12px}button{border:1px solid #485779;background:#263753;color:white;padding:12px 18px;border-radius:10px;font:inherit;cursor:pointer}button:hover{background:#465b84}.dots{display:flex;justify-content:center;gap:8px;margin-top:18px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;background:#52627f}.dots button[aria-current=true]{background:#c4c8ff;border-color:#c4c8ff}#count{color:#a9b6d1}</style><body><main class="wrap"><p class="eyebrow">Kind words</p><h1>What people say</h1><section class="slider" aria-live="polite"><div class="quote" id="quote"></div><div class="avatar" id="avatar"></div><h2 id="name"></h2><div class="role" id="role"></div></section><div class="controls"><button id="prev" aria-label="Previous testimonial">← Previous</button><button id="next" aria-label="Next testimonial">Next →</button></div><div class="dots" id="dots"></div><p id="count"></p></main><script>const data=[{quote:'The team made a complex project feel clear, collaborative, and achievable.',name:'Aarav Mehta',role:'Product designer',avatar:'AM'},{quote:'Thoughtful details and consistent communication made all the difference.',name:'Mira Shah',role:'Startup founder',avatar:'MS'},{quote:'A reliable partner who turns feedback into meaningful improvements.',name:'Kabir Joshi',role:'Engineering lead',avatar:'KJ'}];let index=0;const $=x=>document.getElementById(x);function render() {let d=data[index];$('quote').textContent='“'+d.quote+'”';$('name').textContent=d.name;$('role').textContent=d.role;$('avatar').textContent=d.avatar;$('count').textContent=(index+1)+' of '+data.length;$('dots').innerHTML='';data.forEach((_,i)=>{let b=document.createElement('button');b.setAttribute('aria-label','Show testimonial '+(i+1));b.setAttribute('aria-current',i===index?'true':'false');b.onclick=()=>{index=i;render()};$('dots').append(b)})} $('prev').onclick=()=>{index=(index-1+data.length)%data.length;render()};$('next').onclick=()=>{index=(index+1)%data.length;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});render();</script></body></html>
