<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Tooltip Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#172033;font-family:system-ui,sans-serif}.wrap{text-align:center;max-width:600px}.tip{position:relative;display:inline-block;margin:20px;padding:13px 18px;border:0;border-radius:10px;background:#4338ca;color:white;font:inherit;cursor:help}.tip:after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,4px);width:max-content;max-width:220px;padding:8px 10px;border-radius:7px;background:#0f172a;color:white;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}.tip:hover:after,.tip:focus-visible:after{opacity:1;transform:translate(-50%,0)}.tip:focus-visible{outline:3px solid #a5b4fc;outline-offset:3px}
</style></head><body><main class="wrap"><h1>CSS Tooltips</h1><p>Hover over a button or focus it using the keyboard to reveal its tooltip.</p><button class="tip" data-tip="This hint is styled entirely with CSS.">Hover or focus me</button><button class="tip" data-tip="Tooltips should add brief, helpful context.">Another tooltip</button><p>Tip text comes from the <code>data-tip</code> attribute.</p></main></body></html>
