<!DOCTYPE html>
<html>
<head>
    <title>CSS Typography Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 36px;
            text-align: center;
        }

        .intro {
            font-size: 20px;
            line-height: 1.6;
        }

        .bold {
            font-weight: bold;
        }

        .center {
            text-align: center;
        }

        .uppercase {
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <h1>CSS Typography</h1>

    <p class="intro">
        Typography controls how text looks and reads on a webpage.
    </p>

    <p class="bold">This text is bold.</p>
    <p class="center">This paragraph is centered.</p>
    <p class="uppercase">This text uses uppercase styling.</p>

    <h2>Properties Practiced</h2>
    <ul>
        <li>font-family</li>
        <li>font-size</li>
        <li>font-weight</li>
        <li>text-align</li>
        <li>line-height</li>
        <li>text-transform</li>
        <li>letter-spacing</li>
    </ul>
</body>
</html>
