<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms Practice</title>
</head>

<body>

    <header>
        <h1>HTML Forms Practice</h1>
        <p>Learning how to collect user information using HTML forms.</p>
    </header>

    <hr>

    <main>
        <form>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age">
            <br><br>

            <p>Choose your learning level:</p>
            <input type="radio" id="beginner" name="level" value="beginner">
            <label for="beginner">Beginner</label>

            <input type="radio" id="intermediate" name="level" value="intermediate">
            <label for="intermediate">Intermediate</label>

            <br><br>

            <p>Select topics you want to learn:</p>
            <input type="checkbox" id="css" name="topic" value="css">
            <label for="css">CSS</label>

            <input type="checkbox" id="javascript" name="topic" value="javascript">
            <label for="javascript">JavaScript</label>

            <input type="checkbox" id="react" name="topic" value="react">
            <label for="react">React</label>

            <br><br>

            <label for="message">Message:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="40"></textarea>

            <br><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

        </form>
    </main>

    <hr>

    <footer>
        <p>Created by Ganesh Awale | HTML Practice</p>
    </footer>

</body>
</html>
