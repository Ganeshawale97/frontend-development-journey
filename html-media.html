<!DOCTYPE html>
<html>
<head>
    <title>HTML Media Practice</title>
</head>

<body>

    <header>
        <h1>HTML Media Elements</h1>
        <p>Practice page for images, audio and video.</p>
    </header>

    <hr>

    <main>

        <section>
            <h2>Image</h2>
            <img src="https://via.placeholder.com/300x180" alt="Sample placeholder image" width="300">
        </section>

        <hr>

        <section>
            <h2>Audio</h2>
            <p>Audio player example:</p>
            <audio controls>
                <source src="audio/sample.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>

        <hr>

        <section>
            <h2>Video</h2>
            <p>Video player example:</p>
            <video width="500" controls>
                <source src="video/sample.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>
        </section>

        <hr>

        <section>
            <h2>YouTube Video</h2>
            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="YouTube video"
                allowfullscreen>
            </iframe>
        </section>

    </main>

    <hr>

    <footer>
        <p>Created by Ganesh Awale | HTML Practice</p>
    </footer>

</body>
</html>
