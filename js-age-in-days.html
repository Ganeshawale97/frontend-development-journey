<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Age in Days Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#fff7ed;color:#431407;font-family:system-ui,sans-serif}.app{width:min(100%,480px);padding:26px;background:white;border-radius:16px;box-shadow:0 12px 35px #43140710}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #fdba74;border-radius:8px;font:inherit}button{margin-top:14px;padding:11px 16px;background:#c2410c;color:white;border:0;border-radius:8px;cursor:pointer}.result{margin-top:18px;padding:16px;background:#ffedd5;border-radius:10px;line-height:1.7}
</style></head><body><main class="app"><h1>Age in Days</h1><p>Choose your date of birth to estimate how many days have passed.</p><form id="form"><label for="dob">Date of birth</label><input id="dob" type="date" required><button>Calculate age</button></form><div id="result" class="result" aria-live="polite">Your result will appear here.</div>
<script>
const dob=document.querySelector("#dob");const today=new Date();dob.max=[today.getFullYear(),String(today.getMonth()+1).padStart(2,"0"),String(today.getDate()).padStart(2,"0")].join("-");document.querySelector("#form").addEventListener("submit",event=>{event.preventDefault();if(!dob.value)return;const parts=dob.value.split("-").map(Number),birth=Date.UTC(parts[0],parts[1]-1,parts[2]),now=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()),days=Math.floor((now-birth)/86400000),out=document.querySelector("#result");if(days<0){out.textContent="Birth date cannot be in the future.";return;}out.textContent="Days since birth: "+days.toLocaleString()+" days. That is approximately "+(days/365.2425).toFixed(2)+" years.";});
</script></main></body></html>
