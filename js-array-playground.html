<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Array Playground</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center;background:#fdf2f8;color:#500724;font:16px system-ui}.app{width:min(700px,100%);padding:28px;background:white;border:1px solid #fbcfe8;border-radius:20px}h1{margin-top:0}input{width:100%;padding:12px;border:1px solid #f9a8d4;border-radius:9px;font:inherit}button{padding:10px 13px;border:0;border-radius:9px;background:#be185d;color:white;font:inherit;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.output{padding:16px;background:#fdf2f8;border-radius:10px;min-height:56px;overflow-wrap:anywhere}code{font-family:ui-monospace,monospace}.hint{color:#9d174d}</style></head><body><main class="app"><h1>JavaScript Array Playground</h1><p>Enter comma-separated values and try common array methods.</p><input id="values" value="12, 5, 8, 21, 3" aria-label="Comma-separated values"><div class="actions"><button data-op="sort">Sort numbers</button><button data-op="reverse">Reverse</button><button data-op="sum">Sum</button><button data-op="max">Maximum</button><button data-op="filter">Keep values ≥ 10</button><button data-op="unique">Remove duplicates</button></div><h2>Output</h2><div id="output" class="output" aria-live="polite"><code>Choose an operation above.</code></div><p class="hint">Tip: these operations create a new result and leave your input unchanged.</p><script>const input=document.querySelector('#values'),output=document.querySelector('#output');function numbers(){return input.value.split(',').map(s=>s.trim()).filter(Boolean).map(Number)}document.querySelectorAll('[data-op]').forEach(btn=>btn.onclick=()=>{const raw=input.value.split(',').map(s=>s.trim()).filter(Boolean),arr=numbers();if(!raw.length||arr.some(n=>!Number.isFinite(n))){output.textContent='Please enter valid numbers separated by commas.';return}let result;switch(btn.dataset.op){case'sort':result=[...arr].sort((a,b)=>a-b);break;case'reverse':result=[...arr].reverse();break;case'sum':result=arr.reduce((s,n)=>s+n,0);break;case'max':result=Math.max(...arr);break;case'filter':result=arr.filter(n=>n>=10);break;case'unique':result=[...new Set(arr)];break}output.replaceChildren();const code=document.createElement('code');code.textContent=Array.isArray(result)?JSON.stringify(result):String(result);output.append(code)});</script></main></body></html>
