<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BMI Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f0fdfa;color:#134e4a;font-family:system-ui,sans-serif}.app{width:min(100%,460px);background:white;padding:26px;border-radius:16px;box-shadow:0 12px 35px #134e4a12}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #99f6e4;border-radius:8px;font:inherit}button{margin-top:18px;padding:12px 16px;background:#0f766e;color:white;border:0;border-radius:8px;cursor:pointer}.result{margin-top:18px;padding:15px;border-radius:10px;background:#ccfbf1;min-height:70px}
</style></head><body><main class="app"><h1>BMI Calculator</h1><p>Enter height in centimetres and weight in kilograms.</p><form id="form"><label for="height">Height (cm)</label><input id="height" type="number" min="50" max="250" step="0.1" required><label for="weight">Weight (kg)</label><input id="weight" type="number" min="10" max="500" step="0.1" required><button type="submit">Calculate BMI</button></form><div class="result" id="result" aria-live="polite">Your result will appear here.</div><small>This educational calculator is not a medical diagnosis. Adult BMI categories may not apply to everyone.</small>
<script>
document.querySelector("#form").addEventListener("submit",event=>{event.preventDefault();const h=Number(document.querySelector("#height").value)/100,w=Number(document.querySelector("#weight").value),result=document.querySelector("#result");if(!h||!w){result.textContent="Please enter valid height and weight.";return;}const bmi=w/(h*h);let category=bmi<18.5?"Below the standard adult range":bmi<25?"Within the standard adult range":bmi<30?"Above the standard adult range":"High adult BMI range";result.textContent="BMI: "+bmi.toFixed(1)+" — "+category+".";});
</script></main></body></html>
