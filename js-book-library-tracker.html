<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Book Library</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#28251f;font:16px system-ui}.wrap{max-width:950px;margin:36px auto;padding:0 18px}h1{font-size:clamp(2rem,5vw,3.4rem);margin:0}.sub{color:#716a60}.panel{background:white;padding:18px;border-radius:16px;box-shadow:0 8px 28px #473a1c12;margin:22px 0}.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px}.form input,.form select,.filter{padding:11px;border:1px solid #d9d3c9;border-radius:9px;min-width:0}button{background:#3c674e;color:white;border:0;border-radius:9px;padding:11px 14px;cursor:pointer}.stats{display:flex;gap:18px;flex-wrap:wrap;color:#5c655d}.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.book{padding:16px;background:white;border:1px solid #e8e2d8;border-radius:12px}.book h3{margin:0 0 5px}.book p{margin:5px 0;color:#706b63}.tag{display:inline-block;background:#e5f0e7;color:#2e6742;padding:4px 8px;border-radius:20px;font-size:12px}.book button{margin:10px 5px 0 0;padding:7px 9px;font-size:13px}.remove{background:#a33c36}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}}@media(max-width:420px){.form{grid-template-columns:1fr}.form input:first-child{grid-column:auto}}
</style></head><body><main class="wrap"><h1>My Book Library 📚</h1><p class="sub">Keep track of what you want to read and what you've finished.</p><section class="panel"><form class="form" id="form"><input id="title" placeholder="Book title" required maxlength="100"><input id="author" placeholder="Author" maxlength="80"><select id="status"><option value="Want to read">Want to read</option><option value="Reading">Reading</option><option value="Finished">Finished</option></select><button>Add book</button></form></section><div class="stats" id="stats"></div><section class="panel"><input class="filter" id="search" placeholder="Search title or author…" aria-label="Search books"><select class="filter" id="filter"><option value="All">All books</option><option>Want to read</option><option>Reading</option><option>Finished</option></select></section><section class="books" id="books"></section></main><script>
let data=JSON.parse(localStorage.getItem('bookLibrary')||'[]');const $=s=>document.querySelector(s);function persist(){localStorage.setItem('bookLibrary',JSON.stringify(data));render()}function render(){const q=$('#search').value.toLowerCase(),f=$('#filter').value;$('#stats').textContent='Total: '+data.length+' · Reading: '+data.filter(b=>b.status==='Reading').length+' · Finished: '+data.filter(b=>b.status==='Finished').length;const root=$('#books');root.innerHTML='';data.filter(b=>(f==='All'||b.status===f)&&(b.title+' '+b.author).toLowerCase().includes(q)).forEach(b=>{const el=document.createElement('article');el.className='book';const h=document.createElement('h3');h.textContent=b.title;const p=document.createElement('p');p.textContent=b.author||'Author not added';const tag=document.createElement('span');tag.className='tag';tag.textContent=b.status;const next=document.createElement('button');next.textContent='Next status';next.onclick=()=>{b.status=({'Want to read':'Reading','Reading':'Finished','Finished':'Want to read'})[b.status];persist()};const del=document.createElement('button');del.textContent='Remove';del.className='remove';del.onclick=()=>{data=data.filter(x=>x.id!==b.id);persist()};el.append(h,p,tag,next,del);root.append(el)});if(!root.children.length)root.textContent='No books match yet. Add one above.'}$('#form').onsubmit=e=>{e.preventDefault();data.push({id:Date.now(),title:$('#title').value.trim(),author:$('#author').value.trim(),status:$('#status').value});e.target.reset();persist()};$('#search').oninput=render;$('#filter').onchange=render;render();
</script></body></html>
