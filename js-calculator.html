<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 16px; }
        input, select, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 6px 0; }
        #result { font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Simple Calculator</h1>
    <label for="first">First number</label>
    <input id="first" type="number" step="any">
    <label for="operator">Operation</label>
    <select id="operator">
        <option value="add">Addition (+)</option>
        <option value="subtract">Subtraction (-)</option>
        <option value="multiply">Multiplication (×)</option>
        <option value="divide">Division (÷)</option>
    </select>
    <label for="second">Second number</label>
    <input id="second" type="number" step="any">
    <button id="calculate" type="button">Calculate</button>
    <p id="result" aria-live="polite">Result will appear here.</p>
    <script>
        document.getElementById("calculate").addEventListener("click", function () {
            const firstText = document.getElementById("first").value;
            const secondText = document.getElementById("second").value;
            const result = document.getElementById("result");
            if (firstText === "" || secondText === "") {
                result.textContent = "Please enter both numbers.";
                return;
            }
            const a = Number(firstText);
            const b = Number(secondText);
            const operator = document.getElementById("operator").value;
            let answer;
            if (operator === "add") answer = a + b;
            else if (operator === "subtract") answer = a - b;
            else if (operator === "multiply") answer = a * b;
            else {
                if (b === 0) { result.textContent = "Cannot divide by zero."; return; }
                answer = a / b;
            }
            result.textContent = "Result: " + answer;
        });
    </script>
</body>
</html>
