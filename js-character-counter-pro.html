<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Counter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#ecfeff;color:#164e63;font:16px system-ui}.card{width:min(650px,100%);padding:28px;background:white;border:1px solid #a5f3fc;border-radius:20px;box-shadow:0 15px 40px #155e7510}h1{margin-top:0}textarea{width:100%;min-height:220px;padding:14px;border:1px solid #a5f3fc;border-radius:12px;resize:vertical;font:inherit;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.stat{padding:12px;background:#ecfeff;border-radius:10px}.stat strong{display:block;font-size:1.35rem}.stat span{font-size:.82rem;color:#0e7490}button{margin-top:14px;border:0;border-radius:9px;background:#0891b2;color:white;padding:11px 14px;font:inherit;cursor:pointer}@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="card"><h1>Live Text Counter</h1><p>Check characters, words, sentences and estimated reading time.</p><textarea id="text" placeholder="Type or paste your text…" aria-label="Text to count"></textarea><div class="stats"><div class="stat"><strong id="chars">0</strong><span>Characters</span></div><div class="stat"><strong id="noSpaces">0</strong><span>Without spaces</span></div><div class="stat"><strong id="words">0</strong><span>Words</span></div><div class="stat"><strong id="sentences">0</strong><span>Sentences</span></div></div><button id="clear">Clear text</button><p id="reading">Reading time: 0 min</p></main><script>const input=document.querySelector('#text');function update(){const v=input.value.trim(),words=v?v.split(/\s+/).length:0,sentences=v?(v.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[]).filter(s=>s.trim()).length:0;document.querySelector('#chars').textContent=input.value.length;document.querySelector('#noSpaces').textContent=input.value.replace(/\s/g,'').length;document.querySelector('#words').textContent=words;document.querySelector('#sentences').textContent=sentences;document.querySelector('#reading').textContent='Reading time: '+(words===0?'0 min':Math.max(1,Math.ceil(words/200))+' min')}input.addEventListener('input',update);document.querySelector('#clear').onclick=()=>{input.value='';update();input.focus()};update();</script></body></html>
