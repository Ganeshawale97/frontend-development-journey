<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Name Picker</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5ff;font:16px system-ui;color:#1e2b4a;padding:20px}.app{width:min(100%,600px);background:white;padding:26px;border-radius:20px;box-shadow:0 16px 40px #1b326115}textarea{width:100%;min-height:180px;padding:14px;border:1px solid #d4dcef;border-radius:12px;font:inherit;resize:vertical}button{padding:12px 16px;border:0;border-radius:10px;background:#4259ce;color:white;font:inherit;cursor:pointer}.result{background:#eef1ff;padding:20px;border-radius:14px;margin:18px 0;text-align:center}.name{font-size:clamp(1.8rem,7vw,3rem);font-weight:800;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.muted{color:#65718d}</style><body><main class="app"><h1>🎲 Random Name Picker</h1><p class="muted">Paste one name per line, then pick a random winner.</p><textarea id="names" placeholder="Aarav&#10;Isha&#10;Kabir&#10;Meera">Aarav
Isha
Kabir
Meera
Sana</textarea><div class="result"><p>Selected name</p><div class="name" id="result">Ready?</div><p id="count" class="muted">5 names available</p></div><div class="actions"><button id="pick">Pick a name</button><button id="remove">Pick and remove</button><button id="clear" style="background:#596579">Clear</button></div><p id="message" class="muted" role="status"></p></main><script>const $=x=>document.getElementById(x);function list(){return $('names').value.split('\n').map(s=>s.trim()).filter(Boolean)}function update(){let n=list().length;$('count').textContent=n+' name'+(n===1?'':'s')+' available'}function choose(remove){let a=list();if(!a.length){$('result').textContent='No names';$('message').textContent='Add at least one name first.';update();return}let i=Math.floor(Math.random()*a.length),name=a[i];$('result').textContent=name;$('message').textContent='Picked from '+a.length+' entr'+(a.length===1?'y':'ies')+'.';if(remove){a.splice(i,1);$('names').value=a.join('\n')}update()}$('names').oninput=update;$('pick').onclick=()=>choose(false);$('remove').onclick=()=>choose(true);$('clear').onclick=()=>{$('names').value='';$('result').textContent='Ready?';$('message').textContent='List cleared.';update()};update();</script></body></html>
