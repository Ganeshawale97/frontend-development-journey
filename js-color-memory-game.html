<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Memory Game</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#111827;color:#f9fafb;font:16px system-ui}.app{width:min(500px,100%);text-align:center;padding:26px;background:#1f2937;border:1px solid #374151;border-radius:20px}h1{margin-top:0}.stats{display:flex;justify-content:space-between;color:#cbd5e1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px 0}.tile{height:125px;border:3px solid transparent;border-radius:15px;cursor:pointer;opacity:.85;transition:transform .12s,opacity .12s}.tile:hover{transform:scale(1.02);opacity:1}.tile:focus-visible{outline:3px solid white;outline-offset:3px}.t0{background:#f87171}.t1{background:#60a5fa}.t2{background:#4ade80}.t3{background:#facc15}button.start{border:0;background:#a78bfa;color:#1f1638;font:inherit;font-weight:700;border-radius:10px;padding:12px 20px;cursor:pointer}#message{min-height:26px;color:#ddd6fe}</style></head><body><main class="app"><h1>Color Memory 🧠</h1><p>Watch the sequence, then repeat it in the same order.</p><div class="stats"><span id="level">Level: 0</span><span id="best">Best: 0</span></div><div class="grid" id="grid"><button class="tile t0" data-id="0" aria-label="Red"></button><button class="tile t1" data-id="1" aria-label="Blue"></button><button class="tile t2" data-id="2" aria-label="Green"></button><button class="tile t3" data-id="3" aria-label="Yellow"></button></div><p id="message" aria-live="polite">Press Start to play.</p><button class="start" id="start">Start game</button></main><script>const tiles=[...document.querySelectorAll('.tile')],message=document.querySelector('#message'),levelText=document.querySelector('#level'),bestText=document.querySelector('#best');let sequence=[],step=0,playing=false,showing=false,level=0,best=Number(localStorage.getItem('colorMemoryBest')||0);bestText.textContent='Best: '+best;const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function flash(id){const t=tiles[id];t.style.opacity='1';t.style.transform='scale(.94)';await sleep(280);t.style.opacity='.85';t.style.transform='';await sleep(100)}async function showSequence(){showing=true;playing=false;message.textContent='Watch carefully…';for(const id of sequence){await flash(id)}showing=false;playing=true;step=0;message.textContent='Your turn — repeat the pattern!'}function nextLevel(){level++;levelText.textContent='Level: '+level;sequence.push(Math.floor(Math.random()*4));showSequence()}tiles.forEach(t=>t.onclick=async()=>{if(!playing||showing)return;const id=Number(t.dataset.id);await flash(id);if(id!==sequence[step]){playing=false;message.textContent='Game over! You reached level '+(level-1)+'.';return}step++;if(step===sequence.length){playing=false;if(level>best){best=level;localStorage.setItem('colorMemoryBest',best);bestText.textContent='Best: '+best}message.textContent='Correct! Next level…';await sleep(650);nextLevel()}});document.querySelector('#start').onclick=()=>{sequence=[];step=0;level=0;levelText.textContent='Level: 0';nextLevel()};</script></body></html>
