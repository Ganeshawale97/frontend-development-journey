<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Picker</title><style>body{font:16px Arial,sans-serif;max-width:650px;margin:40px auto;padding:20px}main{padding:24px;border:1px solid #ddd;border-radius:12px}label{display:block;margin:16px 0}input{width:60px;height:40px;vertical-align:middle}#preview{padding:40px;text-align:center;border-radius:8px;background:#7c9cff}</style></head><body><main><h1>Color Picker</h1><p>Choose a color and watch the preview update. This uses an input event and a DOM style property.</p><label for="color">Background color <input id="color" type="color" value="#7c9cff"></label><div id="preview">Your preview</div><p id="value">Selected color: #7c9cff</p></main><script>const picker=document.querySelector('#color');const preview=document.querySelector('#preview');const value=document.querySelector('#value');picker.addEventListener('input',()=>{preview.style.backgroundColor=picker.value;value.textContent='Selected color: '+picker.value;});</script></body></html>
