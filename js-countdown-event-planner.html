<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create a named countdown to an upcoming date and time. The timer updates every second and remembers your event locally."><title>Event Countdown Planner</title><style>:root{font-family:system-ui,Arial;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:32px 16px}.wrap{max-width:850px;margin:auto}h1{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:8px}p{color:#64748b;line-height:1.6}.panel,.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 8px 28px #1e293b0b}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:white;font-weight:650}button.secondary,.remove{background:#e8eef8;color:#26344d}input,select{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px;min-width:0;width:100%}label{display:grid;gap:7px;color:#475569;font-size:.9rem}.grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:10px 0}ul{list-style:none;padding:0}li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{background:#eef4ff;padding:12px 16px;border-radius:12px;flex:1;min-width:100px}.stat b{display:block;font-size:1.5rem}.pill{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 10px;border-radius:20px;font-size:.8rem}.empty{color:#64748b;text-align:center;padding:24px}.compare{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:16/9;background:#dbeafe}.compare img{position:absolute;width:100%;height:100%;object-fit:cover}.compare .after{clip-path:inset(0 50% 0 0)}.line{position:absolute;top:0;bottom:0;width:3px;background:white;left:50%;pointer-events:none}.compare input{position:absolute;bottom:12px;left:5%;width:90%}.card.selected{outline:3px solid #2563eb}.price{font-size:2rem;font-weight:800}.features{line-height:2;color:#475569}@media(max-width:560px){body{padding:20px 12px}.row{grid-template-columns:1fr 1fr}.row input:first-child{grid-column:1/-1}}</style></head><body><main class="wrap"><span class="pill">Frontend Practice Project</span><h1>Event Countdown Planner</h1><p>Create a named countdown to an upcoming date and time. The timer updates every second and remembers your event locally.</p><section class="panel"><div class="grid"><label>Event name<input id="event" placeholder="Hackathon, concert, birthday…"></label><label>Date and time<input id="date" type="datetime-local"></label></div><p><button id="start">Start countdown</button> <button id="clear" class="secondary">Clear</button></p><h2 id="title">Your event</h2><div id="clock" style="font-size:clamp(1.4rem,5vw,2.4rem);font-weight:800;color:#2563eb" aria-live="polite">—</div></section></main><script>const $=s=>document.querySelector(s);let timer;function start(){clearInterval(timer);let name=$('#event').value.trim(),date=new Date($('#date').value).getTime();if(!name||!Number.isFinite(date)){alert('Enter an event name and valid date.');return}localStorage.countdown=JSON.stringify({name,date});$('#title').textContent=name;function tick(){let n=date-Date.now();if(n<=0){$('#clock').textContent='The event is here!';clearInterval(timer);return}let d=Math.floor(n/86400000),h=Math.floor(n/3600000)%24,m=Math.floor(n/60000)%60,s=Math.floor(n/1000)%60;$('#clock').textContent=d+' days · '+h+' hrs · '+m+' min · '+s+' sec'}tick();timer=setInterval(tick,1000)}$('#start').onclick=start;$('#clear').onclick=()=>{clearInterval(timer);localStorage.removeItem('countdown');$('#title').textContent='Your event';$('#clock').textContent='—';$('#event').value='';$('#date').value=''};let old=JSON.parse(localStorage.countdown||'null');if(old){$('#event').value=old.name;$('#date').value=new Date(old.date-new Date(old.date).getTimezoneOffset()*60000).toISOString().slice(0,16);start()}</script></body></html>
