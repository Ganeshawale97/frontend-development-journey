<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Timer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f172a;color:#f8fafc;font:16px system-ui}.app{width:min(520px,100%);padding:30px;text-align:center;background:#1e293b;border:1px solid #334155;border-radius:22px}.time{font-size:clamp(3rem,14vw,5.5rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em;margin:22px 0}.inputs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}input{width:100px;padding:11px;border:1px solid #475569;background:#0f172a;color:white;border-radius:9px;font:inherit;text-align:center}button{padding:11px 15px;border:0;border-radius:9px;background:#8b5cf6;color:white;font:inherit;cursor:pointer}.secondary{background:#334155}.buttons{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}#status{min-height:24px;color:#c4b5fd}</style></head><body><main class="app"><h1>Countdown Timer ⏳</h1><p>Set minutes and seconds, then start your focus session.</p><div class="inputs"><label>Minutes<br><input id="mins" type="number" min="0" max="999" value="1"></label><label>Seconds<br><input id="secs" type="number" min="0" max="59" value="0"></label></div><div id="time" class="time">01:00</div><p id="status" aria-live="polite">Ready when you are.</p><div class="buttons"><button id="start">Start</button><button id="pause" class="secondary">Pause</button><button id="reset" class="secondary">Reset</button></div></main><script>const mins=document.querySelector('#mins'),secs=document.querySelector('#secs'),time=document.querySelector('#time'),status=document.querySelector('#status');let remaining=60,timer=null,running=false;function display(){time.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}function stop(){clearInterval(timer);timer=null;running=false}function resetFromInputs(){stop();remaining=Math.max(0,Math.floor(Number(mins.value)||0))*60+Math.min(59,Math.max(0,Math.floor(Number(secs.value)||0)));display();status.textContent='Ready when you are.'}function start(){if(running)return;if(remaining<=0)resetFromInputs();if(remaining<=0){status.textContent='Choose a duration greater than zero.';return}running=true;status.textContent='Timer running…';timer=setInterval(()=>{remaining--;display();if(remaining<=0){stop();status.textContent='Time is up! 🎉'}},1000)}document.querySelector('#start').onclick=start;document.querySelector('#pause').onclick=()=>{stop();status.textContent='Paused.'};document.querySelector('#reset').onclick=resetFromInputs;mins.onchange=secs.onchange=resetFromInputs;display();</script></body></html>
