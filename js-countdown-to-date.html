<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Countdown to a Date</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif}.app{width:min(100%,600px);text-align:center;padding:26px;border:1px solid #334155;border-radius:18px;background:#1e293b}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}input,button{padding:11px;border-radius:8px;font:inherit;border:1px solid #475569}button{background:#818cf8;color:#0f172a;border:0;cursor:pointer}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.unit{padding:15px 6px;border-radius:10px;background:#334155}.number{display:block;font-size:clamp(1.5rem,5vw,2.5rem);font-weight:700}.label{font-size:.8rem;color:#cbd5e1}@media(max-width:450px){.timer{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><h1>Countdown Timer</h1><p>Choose a future date and time.</p><div class="controls"><input id="target" type="datetime-local" aria-label="Target date and time"><button id="start">Start countdown</button></div><div class="timer" aria-live="polite"><div class="unit"><span id="days" class="number">0</span><span class="label">Days</span></div><div class="unit"><span id="hours" class="number">00</span><span class="label">Hours</span></div><div class="unit"><span id="minutes" class="number">00</span><span class="label">Minutes</span></div><div class="unit"><span id="seconds" class="number">00</span><span class="label">Seconds</span></div></div><p id="message">Set your target to begin.</p>
<script>
let timer=null;const ids=["days","hours","minutes","seconds"];function tick(){const target=new Date(document.querySelector("#target").value).getTime(),diff=target-Date.now();if(!Number.isFinite(target)){document.querySelector("#message").textContent="Please choose a valid date and time.";clearInterval(timer);return;}if(diff<=0){ids.forEach(id=>document.querySelector("#"+id).textContent="0");document.querySelector("#message").textContent="The target time has arrived!";clearInterval(timer);return;}const values=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];ids.forEach((id,i)=>document.querySelector("#"+id).textContent=i===0?values[i]:String(values[i]).padStart(2,"0"));document.querySelector("#message").textContent="Counting down to your selected time.";}
document.querySelector("#start").addEventListener("click",()=>{clearInterval(timer);tick();timer=setInterval(tick,1000);});
</script></main></body></html>
