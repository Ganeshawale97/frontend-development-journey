<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Country Explorer</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f7ff;color:#1e344c;font:16px system-ui;padding:24px}.wrap{max-width:1000px;margin:auto}form{display:flex;gap:8px;margin:18px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #c9d9ea}input{flex:1;min-width:0}button{background:#2067a8;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 10px 28px #1a42610d}.flag{font-size:3rem}.muted{color:#667d93}a{color:#2067a8}</style><body><main class="wrap"><h1>🌍 Country Explorer</h1><p class="muted">Explore country flags, capitals, populations, regions, and currencies.</p><form id="form"><input id="query" placeholder="Search country (e.g. India)" value="India" required><button>Explore</button></form><p id="status" role="status"></p><div id="results" class="grid"></div></main><script>const $=x=>document.getElementById(x);$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Loading country data…';$('results').innerHTML='';try{let r=await fetch('https://restcountries.com/v3.1/name/'+encodeURIComponent($('query').value.trim())+'?fields=name,capital,region,subregion,population,flags,currencies,languages,maps');if(!r.ok)throw Error('Country not found. Try a different name.');let data=await r.json();data.sort((a,b)=>a.name.common.localeCompare(b.name.common));$('status').textContent=data.length+' matching countries.';data.forEach(c=>{let card=document.createElement('article');card.className='card';let flag=document.createElement('div');flag.className='flag';flag.textContent=c.flag||'🌐';let h=document.createElement('h2');h.textContent=c.name.common;let p=document.createElement('p');p.textContent='Capital: '+(c.capital||['Not listed']).join(', ');let p2=document.createElement('p');p2.textContent='Region: '+(c.region||'—')+(c.subregion?' · '+c.subregion:'');let p3=document.createElement('p');p3.textContent='Population: '+(c.population||0).toLocaleString();let p4=document.createElement('p');p4.textContent='Currencies: '+Object.values(c.currencies||{}).map(x=>x.name+' ('+x.symbol+')').join(', ');let a=document.createElement('a');a.href=c.maps?.googleMaps||'#';a.target='_blank';a.rel='noopener';a.textContent='Open map ↗';card.append(flag,h,p,p2,p3,p4,a);$('results').append(card)})}catch(err){$('status').textContent=err.message}};$('form').requestSubmit();</script></body></html>
