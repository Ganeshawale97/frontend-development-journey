<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Compare CSS selector weights and determine which rule wins."><title>CSS Specificity Calculator | Frontend Development Journey</title><style>:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:36px auto;padding:0 18px}header,main{background:white;border:1px solid #dbe2ea;border-radius:16px;padding:clamp(18px,4vw,32px);margin-bottom:16px}h1{font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 8px}p{color:#64748b}label{display:block;font-weight:650;margin:14px 0}input,select,textarea{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#5657d9;color:white;border:0;border-radius:8px;padding:10px 14px;margin:5px 5px 5px 0;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}pre{background:#111827;color:#e5e7eb;padding:15px;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}.preview{border:1px dashed #a5b4fc;border-radius:10px;padding:18px;margin:18px 0;min-height:120px;overflow:auto}.preview span{background:#c7d2fe;padding:15px;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cards article{border:1px solid #dbe2ea;padding:14px;border-radius:9px;overflow-wrap:anywhere}.cards small{display:block;color:#64748b;margin-top:6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.wrap{margin:16px auto}.cols{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><h1>CSS Specificity Calculator</h1><p>Compare CSS selector weights and determine which rule wins.</p></header><main><label>Selector A<input id="a" value="#app .card:hover"></label><label>Selector B<input id="b" value="main .card"></label><button id="go">Compare</button><pre id="out"></pre></main></div><script>function s(v){v=v.replace(/:where\([^)]*\)/g,"");return [(v.match(/#[\w-]+/g)||[]).length,(v.match(/\.[\w-]+|\[[^\]]+\]|:(?!:)[\w-]+/g)||[]).length,(v.match(/(^|[ >+~])\w+/g)||[]).length]}go.onclick=()=>{let x=s(a.value),y=s(b.value);out.textContent="A "+x.join("-")+"\nB "+y.join("-")+"\n"+(x.join()==y.join()?"Equal specificity":x[0]!=y[0]?(x[0]>y[0]?"A":"B")+" wins":x[1]!=y[1]?(x[1]>y[1]?"A":"B")+" wins":(x[2]>y[2]?"A":"B")+" wins")};go.click();</script></body></html>
