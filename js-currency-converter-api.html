<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Currency Converter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9f7f1;color:#173b30;font:16px system-ui;padding:20px}.app{width:min(100%,560px);background:white;padding:28px;border-radius:22px;box-shadow:0 18px 50px #184d3814}label{display:block;margin:14px 0 6px;font-weight:600}input,select,button{width:100%;font:inherit;padding:12px;border:1px solid #cbded5;border-radius:10px}button{background:#147653;color:white;border:0;cursor:pointer;margin-top:18px}.result{background:#e9f7f1;padding:20px;border-radius:14px;margin-top:18px}.big{font-size:2rem;font-weight:800;overflow-wrap:anywhere}.muted{color:#688076}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style><body><main class="app"><h1>💱 Currency Converter</h1><p class="muted">Convert currencies using the Frankfurter public exchange-rate API.</p><label for="amount">Amount</label><input id="amount" type="number" min="0" step="any" value="100"><div class="row"><div><label for="from">From</label><select id="from"><option>USD</option><option selected>INR</option><option>EUR</option><option>GBP</option><option>JPY</option><option>AUD</option><option>CAD</option><option>SGD</option><option>CHF</option></select></div><div><label for="to">To</label><select id="to"><option selected>USD</option><option>INR</option><option>EUR</option><option>GBP</option><option>JPY</option><option>AUD</option><option>CAD</option><option>SGD</option><option>CHF</option></select></div></div><button id="convert">Convert currency</button><section class="result" aria-live="polite"><p>Converted amount</p><div class="big" id="output">—</div><p id="rate" class="muted"></p><p id="status" role="status"></p></section><p class="muted">Rates may not be real-time. Check official financial sources before making transactions.</p></main><script>const $=x=>document.getElementById(x);$('convert').onclick=async()=>{let amount=Number($('amount').value),from=$('from').value,to=$('to').value;if(!Number.isFinite(amount)||amount<0){$('status').textContent='Enter a valid non-negative amount.';return}if(from===to){$('output').textContent=amount.toLocaleString(undefined,{maximumFractionDigits:4})+' '+to;$('rate').textContent='1 '+from+' = 1 '+to;$('status').textContent='Same currency selected.';return}$('status').textContent='Fetching latest available rate…';try{let r=await fetch('https://api.frankfurter.dev/v2/rate/'+from+'/'+to);if(!r.ok)throw Error('Rate unavailable for this currency pair.');let d=await r.json(),converted=amount*d.rate;$('output').textContent=converted.toLocaleString(undefined,{maximumFractionDigits:4})+' '+to;$('rate').textContent='1 '+from+' = '+d.rate+' '+to;$('status').textContent='Rate date: '+d.date}catch(e){$('status').textContent=e.message+' Please try another currency.'}};$('convert').click();</script></body></html>
