<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Data Types</title>
</head>
<body>
    <h1>JavaScript Data Types</h1>
    <p id="output"></p>

    <script>
        let studentName = "Ganesh";
        let age = 21;
        let isLearning = true;
        let skills = ["HTML", "CSS", "JavaScript"];

        document.getElementById("output").innerHTML =
            "Name: " + studentName + "<br>" +
            "Age: " + age + "<br>" +
            "Learning: " + isLearning + "<br>" +
            "First Skill: " + skills[0];
    </script>
</body>
</html>
