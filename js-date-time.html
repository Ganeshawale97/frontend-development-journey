<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date and Time Practice</title>
</head>
<body>
<h1>Date and Time</h1>
<p id="date"></p><p id="time"></p>
<button id="refresh">Refresh Date and Time</button>
<script>
function updateDateTime(){
const now=new Date();
document.getElementById("date").textContent="Date: "+now.toLocaleDateString();
document.getElementById("time").textContent="Time: "+now.toLocaleTimeString();
}
document.getElementById("refresh").addEventListener("click",updateDateTime);
updateDateTime();
</script>
</body>
</html>
