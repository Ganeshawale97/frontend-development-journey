<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roller</title>
<style>body{font-family:Arial,sans-serif;text-align:center;padding:40px}#die{font-size:5rem;margin:20px}button{padding:12px 18px;cursor:pointer}</style>
</head>
<body>
<h1>Dice Roller</h1><p>Roll a six-sided die.</p><div id="die" aria-live="polite">⚀</div><p id="result">Ready to roll?</p><button id="roll">Roll Dice</button>
<script>
const faces=["⚀","⚁","⚂","⚃","⚄","⚅"];document.getElementById("roll").addEventListener("click",function(){const value=Math.floor(Math.random()*6);document.getElementById("die").textContent=faces[value];document.getElementById("result").textContent="You rolled a "+(value+1)+".";});
</script>
</body>
</html>
