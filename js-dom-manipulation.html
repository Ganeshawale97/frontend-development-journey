<!DOCTYPE html>
<html>
<head><title>DOM Manipulation</title></head>
<body>
    <h1>DOM Manipulation</h1>
    <p id="message">This text will change.</p>
    <button id="change">Change Text</button>
    <button id="reset">Reset</button>
    <script>
        const message = document.getElementById("message");

        document.getElementById("change").addEventListener("click", function () {
            message.textContent = "The DOM lets JavaScript update webpage content!";
        });

        document.getElementById("reset").addEventListener("click", function () {
            message.textContent = "This text will change.";
        });
    </script>
</body>
</html>
