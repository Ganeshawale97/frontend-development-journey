<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Test CSS selectors against sample markup. Try querySelector and querySelectorAll selectors on a sandboxed snippet and inspect matching elements."><title>Test CSS selectors against sample markup | Frontend Development Journey</title><style>:root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#dbe2ee;--accent:#315eea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.top{margin-bottom:22px}.eyebrow{color:var(--accent);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(1.8rem,5vw,2.7rem);line-height:1.1;margin:.4rem 0}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);box-shadow:0 12px 35px #1720330b}label{display:block;font-weight:650;margin:14px 0}input,textarea,select{display:block;width:100%;margin-top:7px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}textarea{resize:vertical}button{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:white;font:inherit;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e8edf8;color:#203052}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #7ca2ff;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px}.status,.result{padding:12px;border-radius:10px;background:#eef3ff;color:#203052;margin-top:14px;overflow-wrap:anywhere}pre,code{white-space:pre-wrap;overflow-wrap:anywhere}pre{background:#101827;color:#dce8ff;padding:16px;border-radius:12px;overflow:auto}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.inline{display:inline-flex;align-items:center;gap:6px;margin-right:12px}.inline input{width:auto}.results p,.status-row,.char-grid article{border-bottom:1px solid var(--line);padding:10px 0}.results code{display:block;margin-top:4px}.stage,.track,.ratio-stage{min-height:190px;background:repeating-linear-gradient(45deg,#e8edf8,#e8edf8 10px,#f5f7fb 10px,#f5f7fb 20px);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:18px 0;overflow:hidden}.track{justify-content:flex-start;padding:12px}.track #dot{width:28px;height:28px;border-radius:50%;background:var(--accent)}.track #dot.go{animation:move 1.1s forwards}@keyframes move{to{transform:translateX(min(70vw,650px))}}#tile{background:#315eea;color:white;border-radius:14px;padding:25px;max-width:150px;text-align:center}.sample{height:170px;border-radius:16px;background:radial-gradient(circle at 30% 30%,#fbbf24 0 12%,transparent 13%),radial-gradient(circle at 70% 35%,#ec4899 0 18%,transparent 19%),linear-gradient(135deg,#2563eb,#14b8a6);margin:18px 0}.type-preview{font-size:clamp(2rem,7vw,4rem);font-weight:900;text-align:center;padding:36px 8px;overflow-wrap:anywhere}.ratio-stage{padding:20px}.ratio-stage #frame{max-width:100%;background:linear-gradient(135deg,#2563eb,#a855f7);color:white;border-radius:12px;display:grid;place-items:center}.preview{padding:12px;border:1px dashed var(--line);border-radius:12px;margin:12px 0}.match{padding:9px;margin:5px;background:#eaf0ff;color:#172033;border-radius:7px}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{padding:9px;text-align:left;border-bottom:1px solid var(--line)}.status-row{display:flex;gap:16px}.status-row>strong{font-size:1.4rem;color:var(--accent);min-width:52px}.status-row small{display:block;color:var(--muted)}.status-row p{margin:4px 0}.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}.char-grid article{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.char-grid strong,.char-grid small,.char-grid code{display:block}.char-grid strong{font-size:1.6rem}.char-grid small{color:var(--muted)}.interactive li{padding:10px;margin:7px;border-radius:8px;background:#edf2ff;color:#172033;cursor:pointer}.interactive li.selected{background:#c7d7ff;outline:2px solid var(--accent)}#frame{padding:35px;text-align:center;border-radius:12px;background:#f1f5f9;color:#172033;min-height:130px;display:grid;place-items:center}fieldset{border:1px solid var(--line);border-radius:10px}footer{font-size:.85rem;color:var(--muted);margin:16px 4px}@media(prefers-color-scheme:dark){:root{--bg:#101827;--panel:#172235;--ink:#edf2ff;--muted:#a6b2c8;--line:#344158}.status,.result{background:#24365a;color:#e5edff}.interactive li,.match{background:#24365a;color:#edf2ff}button.secondary{background:#344158;color:#edf2ff}.stage,.track,.ratio-stage{background:repeating-linear-gradient(45deg,#263349,#263349 10px,#1a2638 10px,#1a2638 20px)}}</style></head>
<body><main class="wrap"><header class="top"><div class="eyebrow">Frontend Development Journey · Practice Lab</div><h1>Test CSS selectors against sample markup</h1><p>Try querySelector and querySelectorAll selectors on a sandboxed snippet and inspect matching elements.</p></header><section class="panel"><label>HTML sample<textarea id="html" rows="6"><article class="card"><h2>First card</h2><p class="tag">New</p></article><article class="card featured"><h2>Second card</h2><p>Popular</p></article></textarea></label><label>CSS selector<input id="selector" value=".card h2"></label><button id="run">Find matches</button><div id="preview" class="preview"></div><pre id="matches" aria-live="polite"></pre></section><footer>Runs locally in your browser. Built for learning HTML, CSS and JavaScript.</footer></main><script>document.querySelector('#run').onclick=()=>{const preview=document.querySelector('#preview'),matches=document.querySelector('#matches');preview.replaceChildren();matches.textContent='';try{const parsed=new DOMParser().parseFromString(document.querySelector('#html').value,'text/html'),sel=document.querySelector('#selector').value.trim();if(!sel)throw Error('Enter a selector.');const found=[...parsed.body.querySelectorAll(sel)];found.forEach(el=>{const div=document.createElement('div');div.className='match';div.textContent='<'+el.tagName.toLowerCase()+'>'+el.textContent.trim().slice(0,100);preview.append(div)});matches.textContent=found.length+' match(es)\n'+found.map((el,i)=>(i+1)+'. '+el.tagName.toLowerCase()+' · '+el.textContent.trim()).join('\n')||'No matches.'}catch(e){matches.textContent='Selector error: '+e.message}};document.querySelector('#run').click();</script></body></html>
