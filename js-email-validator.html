<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Validator Demo</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff7ed;color:#431407;font:16px system-ui}.card{width:min(520px,100%);padding:28px;background:white;border:1px solid #fed7aa;border-radius:20px;box-shadow:0 15px 40px #9a34120b}h1{margin-top:0}label{display:block;font-weight:600;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #fdba74;border-radius:9px;font:inherit}button{margin-top:12px;padding:11px 15px;border:0;border-radius:9px;background:#c2410c;color:white;font:inherit;cursor:pointer}#result{margin-top:16px;padding:13px;border-radius:9px;background:#f1f5f9;color:#334155;overflow-wrap:anywhere}.ok{background:#dcfce7!important;color:#166534!important}.bad{background:#fee2e2!important;color:#991b1b!important}.hint{color:#9a3412;font-size:.9rem;line-height:1.6}</style></head><body><main class="card"><h1>Email Validator</h1><p>Practise input handling and basic email-format checks with JavaScript.</p><form id="form"><label for="email">Email address</label><input id="email" type="text" autocomplete="off" placeholder="name@example.com" required><button>Check email</button></form><div id="result" role="status">Enter an email address to begin.</div><p class="hint">Note: this checks common formatting only. It cannot confirm that an address exists or can receive email.</p><script>const form=document.querySelector('#form'),email=document.querySelector('#email'),result=document.querySelector('#result');form.onsubmit=e=>{e.preventDefault();const value=email.value.trim();const valid=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value);result.className=valid?'ok':'bad';result.textContent=valid?'✓ The format looks valid: '+value:'✕ Please enter an email in a format like name@example.com.'};email.oninput=()=>{result.className='';result.textContent='Ready to check.'};</script></main></body></html>
