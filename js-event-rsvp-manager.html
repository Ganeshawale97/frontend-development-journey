<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Add guests, track attendance responses, search the guest list, and see live RSVP totals. Data is saved in localStorage."><title>Event RSVP Manager</title><style>:root{font-family:system-ui,Arial;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:32px 16px}.wrap{max-width:850px;margin:auto}h1{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:8px}p{color:#64748b;line-height:1.6}.panel,.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 8px 28px #1e293b0b}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:white;font-weight:650}button.secondary,.remove{background:#e8eef8;color:#26344d}input,select{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px;min-width:0;width:100%}label{display:grid;gap:7px;color:#475569;font-size:.9rem}.grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:10px 0}ul{list-style:none;padding:0}li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{background:#eef4ff;padding:12px 16px;border-radius:12px;flex:1;min-width:100px}.stat b{display:block;font-size:1.5rem}.pill{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 10px;border-radius:20px;font-size:.8rem}.empty{color:#64748b;text-align:center;padding:24px}.compare{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:16/9;background:#dbeafe}.compare img{position:absolute;width:100%;height:100%;object-fit:cover}.compare .after{clip-path:inset(0 50% 0 0)}.line{position:absolute;top:0;bottom:0;width:3px;background:white;left:50%;pointer-events:none}.compare input{position:absolute;bottom:12px;left:5%;width:90%}.card.selected{outline:3px solid #2563eb}.price{font-size:2rem;font-weight:800}.features{line-height:2;color:#475569}@media(max-width:560px){body{padding:20px 12px}.row{grid-template-columns:1fr 1fr}.row input:first-child{grid-column:1/-1}}</style></head><body><main class="wrap"><span class="pill">Frontend Practice Project</span><h1>Event RSVP Manager</h1><p>Add guests, track attendance responses, search the guest list, and see live RSVP totals. Data is saved in localStorage.</p><section class="panel"><form id="form" class="grid"><label>Guest name<input id="name" required></label><label>Email<input id="email" type="email"></label><label>Response<select id="status"><option>Going</option><option>Not going</option><option>Maybe</option></select></label><button style="align-self:end">Add guest</button></form><div class="stats"><div class="stat">Guests<b id="total">0</b></div><div class="stat">Going<b id="yes">0</b></div><div class="stat">Not going<b id="no">0</b></div></div><input id="search" placeholder="Search guests…"><ul id="list"></ul><button id="clear" class="secondary">Clear guest list</button></section></main><script>const $=s=>document.querySelector(s);let a=JSON.parse(localStorage.guests||'[]');function draw(){let q=$('#search').value.toLowerCase();$('#total').textContent=a.length;$('#yes').textContent=a.filter(x=>x.status==='Going').length;$('#no').textContent=a.filter(x=>x.status==='Not going').length;$('#list').innerHTML=a.filter(x=>x.name.toLowerCase().includes(q)).map(x=>'<li><span><b>'+x.name+'</b><small>'+(x.email||'No email')+' · '+x.status+'</small></span><button data-id="'+x.id+'" class="del">Remove</button></li>').join('')||'<li class="empty">No guests yet.</li>';localStorage.guests=JSON.stringify(a)}$('#form').onsubmit=e=>{e.preventDefault();a.unshift({id:Date.now(),name:$('#name').value.trim(),email:$('#email').value.trim(),status:$('#status').value});e.target.reset();draw()};$('#search').oninput=draw;$('#list').onclick=e=>{if(e.target.matches('.del')){a=a.filter(x=>x.id!=e.target.dataset.id);draw()}};$('#clear').onclick=()=>{if(confirm('Clear all guests?')){a=[];draw()}};draw();</script></body></html>
