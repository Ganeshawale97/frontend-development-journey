<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<style>
body{font-family:Arial,sans-serif;max-width:650px;margin:40px auto;padding:0 16px}
input,button{padding:10px;margin:5px 0}
li{display:flex;justify-content:space-between;gap:12px;padding:8px 0}
</style>
</head>
<body>
<h1>Simple Expense Tracker</h1>
<form id="expenseForm">
<label for="description">Expense:</label>
<input id="description" required placeholder="e.g. Lunch">
<label for="amount">Amount (₹):</label>
<input id="amount" type="number" min="0.01" step="0.01" required>
<button type="submit">Add Expense</button>
</form>
<h2>Total: <span id="total">₹0.00</span></h2>
<ul id="expenses"></ul>
<script>
const form=document.getElementById("expenseForm");
const description=document.getElementById("description");
const amount=document.getElementById("amount");
const list=document.getElementById("expenses");
const totalOutput=document.getElementById("total");
let expenses=[];
function render(){
list.replaceChildren();
let total=0;
expenses.forEach(function(expense,index){
total+=expense.amount;
const item=document.createElement("li");
const label=document.createElement("span");
label.textContent=expense.description+" — ₹"+expense.amount.toFixed(2);
const remove=document.createElement("button");
remove.type="button";remove.textContent="Delete";
remove.addEventListener("click",function(){expenses.splice(index,1);render();});
item.append(label,remove);list.appendChild(item);
});
totalOutput.textContent="₹"+total.toFixed(2);
}
form.addEventListener("submit",function(event){
event.preventDefault();
const value=Number(amount.value);
const name=description.value.trim();
if(!name||!Number.isFinite(value)||value<=0)return;
expenses.push({description:name,amount:value});
form.reset();render();
});
</script>
</body>
</html>
