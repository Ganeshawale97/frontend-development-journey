<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashcard Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ff;color:#242044;font:16px system-ui;padding:24px}.wrap{max-width:760px;margin:auto}.panel{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 10px 30px #21174a0d}form{display:grid;gap:10px}input,textarea,button{font:inherit;padding:12px;border:1px solid #d8d4ee;border-radius:10px}button{background:#5a45c8;color:white;border:0;cursor:pointer}.study{min-height:220px;display:grid;place-items:center;text-align:center;cursor:pointer;background:linear-gradient(140deg,#5a45c8,#8d74ed);color:white;padding:24px;border-radius:18px}.study h2{font-size:clamp(1.4rem,5vw,2.4rem)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}.muted{color:#716d8b}li{padding:8px 0;border-bottom:1px solid #eee}</style><body><main class="wrap"><h1>🧠 Flashcard Studio</h1><p class="muted">Create study cards and practise active recall. Cards are saved on this device.</p><section class="panel"><h2>Create a card</h2><form id="form"><input id="q" placeholder="Question or term" maxlength="180" required><textarea id="a" placeholder="Answer or definition" rows="3" maxlength="500" required></textarea><button>Add flashcard</button></form></section><section class="panel"><h2>Study cards <small id="count"></small></h2><div class="study" id="card" tabindex="0" role="button"><div><p id="side">READY</p><h2 id="face">Add a card to begin</h2><p>Tap to flip</p></div></div><div class="actions"><button id="prev">← Previous</button><button id="flip">Flip</button><button id="next">Next →</button><button id="remove" style="background:#b23a48">Delete</button></div><p id="progress" class="muted"></p></section><section class="panel"><h2>Your deck</h2><ol id="deck"></ol><button id="clear" style="background:#4b5563">Clear deck</button></section></main><script>const $=x=>document.getElementById(x);let cards=JSON.parse(localStorage.getItem('flashCards')||'[]'),index=0,flipped=false;function save(){localStorage.setItem('flashCards',JSON.stringify(cards));render()}function render(){index=Math.max(0,Math.min(index,cards.length-1));$('count').textContent=cards.length+' total';$('deck').innerHTML='';cards.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.textContent=c.q;b.style.background='transparent';b.style.color='#5a45c8';b.onclick=()=>{index=i;flipped=false;render()};li.append(b);$('deck').append(li)});if(!cards.length){$('face').textContent='Add a card to begin';$('side').textContent='READY';$('progress').textContent='No cards yet'}else{$('face').textContent=flipped?cards[index].a:cards[index].q;$('side').textContent=flipped?'ANSWER':'QUESTION';$('progress').textContent='Card '+(index+1)+' of '+cards.length}}$('form').onsubmit=e=>{e.preventDefault();cards.push({q:$('q').value.trim(),a:$('a').value.trim()});index=cards.length-1;flipped=false;$('form').reset();save()};function flip(){if(cards.length){flipped=!flipped;render()}}$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>{if(cards.length){index=(index-1+cards.length)%cards.length;flipped=false;render()}};$('next').onclick=()=>{if(cards.length){index=(index+1)%cards.length;flipped=false;render()}};$('remove').onclick=()=>{if(cards.length){cards.splice(index,1);flipped=false;save()}};$('clear').onclick=()=>{if(confirm('Clear all flashcards?')){cards=[];index=0;save()}};render();</script></body></html>
