<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Flashcard Study</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#eef2ff;font-family:system-ui,sans-serif;color:#172033}.app{width:min(100%,560px);text-align:center;background:white;padding:26px;border-radius:18px;box-shadow:0 15px 45px #312e8115}.card{min-height:210px;display:grid;place-items:center;padding:24px;margin:18px 0;border:2px solid #c7d2fe;border-radius:14px;background:#eef2ff;font-size:1.3rem}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{padding:11px 15px;border:0;border-radius:9px;background:#4338ca;color:white;cursor:pointer}button.secondary{background:#e2e8f0;color:#172033}#counter{color:#64748b}
</style></head><body><main class="app"><h1>Flashcard Study</h1><p id="counter"></p><div class="card" id="card" aria-live="polite"></div><div class="buttons"><button class="secondary" id="prev">Previous</button><button id="flip">Show answer</button><button class="secondary" id="next">Next</button></div><p>Sample cards for HTML, CSS, and JavaScript.</p>
<script>
const cards=[{q:"What does HTML stand for?",a:"HyperText Markup Language."},{q:"What does CSS control?",a:"The presentation and layout of web pages."},{q:"Which keyword declares a block-scoped variable that can be reassigned?",a:"let"},{q:"What does DOM stand for?",a:"Document Object Model."},{q:"Which HTML element creates a hyperlink?",a:"The <a> element."}];let index=0,flipped=false;const card=document.querySelector("#card"),counter=document.querySelector("#counter"),flip=document.querySelector("#flip");
function render(){card.textContent=flipped?cards[index].a:cards[index].q;counter.textContent="Card "+(index+1)+" of "+cards.length;flip.textContent=flipped?"Show question":"Show answer";}
flip.addEventListener("click",()=>{flipped=!flipped;render()});document.querySelector("#next").addEventListener("click",()=>{index=(index+1)%cards.length;flipped=false;render()});document.querySelector("#prev").addEventListener("click",()=>{index=(index-1+cards.length)%cards.length;flipped=false;render()});render();
</script></main></body></html>
