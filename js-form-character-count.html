<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Message Form Character Limit</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#ecfeff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:26px;border-radius:16px;max-width:500px;width:100%;box-shadow:0 10px 30px #155e7518}label{display:block;margin:14px 0 6px}input,textarea,button{font:inherit;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}textarea{min-height:140px;resize:vertical}button{margin-top:16px;background:#0e7490;color:white;border:0;cursor:pointer}#count{font-size:.9rem;text-align:right;color:#475569}#status{min-height:1.5em;font-weight:bold}.limit{color:#b91c1c!important}</style></head>
<body><main class="card"><h1>Message Form</h1><p>Write a message with a 150-character limit.</p><form id="messageForm"><label for="name">Your name</label><input id="name" required maxlength="40" placeholder="Enter your name"><label for="message">Message</label><textarea id="message" maxlength="150" required placeholder="Write your message..."></textarea><p id="count">0 / 150 characters</p><button type="submit">Submit message</button></form><p id="status" aria-live="polite"></p><small>Practice: form submission, maxlength, and live feedback.</small></main>
<script>
const message = document.querySelector("#message"), count = document.querySelector("#count"), status = document.querySelector("#status");
message.addEventListener("input", () => {
  count.textContent = message.value.length + " / 150 characters";
  count.classList.toggle("limit", message.value.length >= 140);
});
document.querySelector("#messageForm").addEventListener("submit", event => {
  event.preventDefault();
  status.textContent = "Thanks, " + document.querySelector("#name").value.trim() + "! Your message is ready.";
});
</script></body></html>
