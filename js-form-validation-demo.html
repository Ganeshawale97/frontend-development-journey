<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Validation</title><style>
*{box-sizing:border-box}body{font:16px system-ui;background:#eef2ff;min-height:100vh;display:grid;place-items:center;padding:20px;margin:0;color:#20243a}.card{width:min(460px,100%);background:white;border-radius:20px;padding:28px;box-shadow:0 16px 40px #252e601a}h1{margin-top:0}label{display:block;font-weight:600;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd2e4;border-radius:9px;font:inherit}input.invalid{border-color:#dc2626}small.error{display:block;color:#dc2626;min-height:20px;margin-top:4px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#4f46e5;color:white;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}#result{padding:12px;border-radius:9px;background:#dcfce7;color:#166534;display:none;margin-top:16px}</style></head><body><main class="card"><h1>Create account</h1><p>Try the form — errors appear when something needs attention.</p><form id="form" novalidate><label for="name">Full name</label><input id="name" autocomplete="name"><small class="error" id="nameErr"></small><label for="email">Email address</label><input id="email" type="email" autocomplete="email"><small class="error" id="emailErr"></small><label for="password">Password</label><input id="password" type="password" autocomplete="new-password"><small class="error" id="passErr"></small><button>Create account</button></form><div id="result" role="status">Looks good! The demo form is valid (nothing was sent).</div></main><script>
const form=document.querySelector('#form');form.onsubmit=e=>{e.preventDefault();const name=document.querySelector('#name'),email=document.querySelector('#email'),password=document.querySelector('#password');let ok=true;function error(id,msg,input){document.querySelector('#'+id).textContent=msg;input.classList.toggle('invalid',!!msg);if(msg)ok=false}error('nameErr',name.value.trim().length<2?'Enter at least 2 characters.':'',name);error('emailErr',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())?'':'Enter a valid email address.',email);error('passErr',password.value.length<8?'Use at least 8 characters.':'',password);document.querySelector('#result').style.display=ok?'block':'none';if(ok)form.reset()};
</script></body></html>
