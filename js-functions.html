<!DOCTYPE html>
<html>
<head><title>JavaScript Functions</title></head>
<body>
    <h1>JavaScript Functions</h1>
    <p id="result">Click the button to calculate.</p>
    <button id="calculate">Add 10 + 5</button>
    <script>
        function add(a, b) {
            return a + b;
        }

        document.getElementById("calculate").addEventListener("click", function () {
            document.getElementById("result").textContent = "Result: " + add(10, 5);
        });
    </script>
</body>
</html>
