<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Profile Finder</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182230;font:16px system-ui;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 10px 30px #162b460d}form{display:flex;gap:8px}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #d5deea}input{flex:1;min-width:0}button{background:#202b3b;color:white;cursor:pointer;border:0}.profile{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eef2f8;padding:14px;border-radius:12px}.stat b{display:block;font-size:1.5rem}.muted{color:#64748b}a{color:#3156c9}@media(max-width:480px){form{flex-direction:column}.stats{grid-template-columns:1fr}}</style><body><main class="wrap"><h1>🐙 GitHub Profile Finder</h1><p class="muted">Look up public GitHub profiles using the GitHub API.</p><section class="card"><form id="form"><input id="username" placeholder="GitHub username (e.g. octocat)" value="octocat" required><button>Search profile</button></form><p id="status" role="status"></p></section><section id="result" class="card" hidden><div class="profile"><img id="avatar" class="avatar" alt="Profile avatar"><div><h2 id="name"></h2><p id="login"></p><p id="bio"></p><a id="link" target="_blank" rel="noopener">View GitHub profile ↗</a></div></div><div class="stats"><div class="stat">Repositories<b id="repos">0</b></div><div class="stat">Followers<b id="followers">0</b></div><div class="stat">Following<b id="following">0</b></div></div><p id="location" class="muted"></p></section></main><script>const $=x=>document.getElementById(x);$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Searching…';$('result').hidden=true;try{let r=await fetch('https://api.github.com/users/'+encodeURIComponent($('username').value.trim()));if(r.status===404)throw Error('User not found. Check the spelling.');if(!r.ok)throw Error('GitHub API request failed. Try again later.');let d=await r.json();$('avatar').src=d.avatar_url;$('avatar').alt=d.login+' avatar';$('name').textContent=d.name||d.login;$('login').textContent='@'+d.login;$('bio').textContent=d.bio||'No public bio provided.';$('link').href=d.html_url;$('repos').textContent=d.public_repos;$('followers').textContent=d.followers;$('following').textContent=d.following;$('location').textContent=d.location?'📍 '+d.location:'';$('result').hidden=false;$('status').textContent='Profile found.'}catch(err){$('status').textContent=err.message}};$('form').requestSubmit();</script></body></html>
