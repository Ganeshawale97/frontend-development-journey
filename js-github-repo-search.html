<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Repository Explorer</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:16px system-ui}.wrap{max-width:1000px;margin:50px auto;padding:0 18px}h1{font-size:clamp(2rem,6vw,3.5rem);margin-bottom:8px}.muted{color:#9da7b3}.search{display:flex;gap:8px;margin:25px 0}.search input{flex:1;min-width:0;padding:13px;border-radius:9px;border:1px solid #30363d;background:#161b22;color:white}.search button{padding:12px 18px;background:#238636;color:white;border:0;border-radius:9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.repo{padding:18px;border:1px solid #30363d;background:#161b22;border-radius:12px}.repo h2{font-size:1.1rem;margin:0 0 8px;overflow-wrap:anywhere}.repo a{color:#58a6ff;text-decoration:none}.repo p{color:#9da7b3;min-height:40px;overflow-wrap:anywhere}.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#c9d1d9}.status{color:#9da7b3;min-height:24px}footer{margin:28px 0;color:#8b949e;font-size:13px}
</style></head><body><main class="wrap"><h1>GitHub Repo Explorer</h1><p class="muted">Search public repositories and explore stars, languages, and descriptions.</p><form class="search" id="form"><input id="q" placeholder="Try: javascript portfolio" required><button>Search</button></form><div class="status" id="status" role="status">Search for a topic to get started.</div><section class="grid" id="results"></section><footer>Uses the public GitHub Search API. Internet connection required; unauthenticated requests are rate-limited.</footer></main><script>
const $=s=>document.querySelector(s);$('#form').onsubmit=async e=>{e.preventDefault();const q=$('#q').value.trim();$('#status').textContent='Searching…';$('#results').innerHTML='';try{const res=await fetch('https://api.github.com/search/repositories?q='+encodeURIComponent(q)+'&sort=stars&order=desc&per_page=12');if(!res.ok)throw Error(res.status===403?'GitHub API rate limit reached. Try again later.':'Request failed ('+res.status+').');const data=await res.json();$('#status').textContent=data.total_count.toLocaleString()+' repositories found (showing up to 12).';data.items.forEach(r=>{const card=document.createElement('article');card.className='repo';const h=document.createElement('h2'),a=document.createElement('a');a.href=r.html_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=r.full_name;h.append(a);const p=document.createElement('p');p.textContent=r.description||'No description provided.';const meta=document.createElement('div');meta.className='meta';[('★ '+r.stargazers_count.toLocaleString()),('⑂ '+r.forks_count.toLocaleString()),('Language: '+(r.language||'—'))].forEach(t=>{const s=document.createElement('span');s.textContent=t;meta.append(s)});card.append(h,p,meta);$('#results').append(card)});if(!data.items.length)$('#status').textContent='No repositories found. Try a different search.'}catch(err){$('#status').textContent=err.message.includes('fetch')?'Could not connect. Check your internet connection.':err.message}};
</script></body></html>
