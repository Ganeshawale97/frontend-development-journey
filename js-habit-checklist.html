<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Daily Habit Checklist</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f8fafc;color:#172033;font-family:system-ui,sans-serif}.app{max-width:560px;margin:auto;padding:24px;background:white;border:1px solid #e2e8f0;border-radius:16px}.habit{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #e2e8f0}.habit input{width:18px;height:18px;accent-color:#0f766e}.habit label{flex:1}.progress{height:9px;background:#e2e8f0;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:#0f766e;transition:width .2s}.note{color:#64748b;font-size:.9rem}
</style></head><body><main class="app"><h1>Daily Habit Checklist</h1><p class="note">Tick habits as you complete them. Your progress is saved in this browser.</p><p id="summary" aria-live="polite">0 of 5 completed</p><div class="progress"><div class="bar" id="bar"></div></div><div id="habits"></div><button id="reset" style="margin-top:18px;padding:10px 14px;border:0;border-radius:8px;background:#334155;color:white">Reset today</button>
<script>
const items=["Drink enough water","Read or study for 20 minutes","Move your body","Tidy your workspace","Plan tomorrow"];const key="habit-checklist-demo-v1",container=document.querySelector("#habits");let state={};try{state=JSON.parse(localStorage.getItem(key)||"{}")||{};}catch{state={};}
function render(){container.replaceChildren();items.forEach((item,i)=>{const row=document.createElement("div");row.className="habit";const checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.id="habit"+i;checkbox.checked=Boolean(state[i]);const label=document.createElement("label");label.htmlFor=checkbox.id;label.textContent=item;checkbox.addEventListener("change",()=>{state[i]=checkbox.checked;try{localStorage.setItem(key,JSON.stringify(state));}catch{}update();});row.append(checkbox,label);container.append(row);});update();}
function update(){const count=items.filter((_,i)=>state[i]).length;document.querySelector("#summary").textContent=count+" of "+items.length+" completed";document.querySelector("#bar").style.width=(count/items.length*100)+"%";}
document.querySelector("#reset").addEventListener("click",()=>{state={};try{localStorage.removeItem(key);}catch{}render();});render();
</script></main></body></html>
