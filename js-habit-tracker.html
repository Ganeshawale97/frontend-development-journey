<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habit Tracker</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#eff8f3;color:#19392e;font:16px system-ui}.wrap{max-width:760px;margin:auto}.card{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 10px 30px #163e2b0b}form{display:flex;gap:8px}input,button{padding:12px;border-radius:10px;border:1px solid #c9ded3;font:inherit}form input{flex:1;min-width:0}button{cursor:pointer;background:#16734d;color:white;border:0}.habit{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e4eee8}.habit label{flex:1}.habit input{width:20px;height:20px}.habit small{display:block;color:#658174}.remove{background:#ffe9e5;color:#a33123;padding:8px 10px}.stats{display:flex;gap:12px}.stat{background:#e1f3e9;border-radius:12px;padding:14px;flex:1}.muted{color:#658174}</style><body><main class="wrap"><h1>🌱 Daily Habit Tracker</h1><p class="muted">Small steps, repeated daily. Checklist saved on this device.</p><div class="stats"><div class="stat">Today's progress<h2 id="progress">0%</h2></div><div class="stat">Habits<h2 id="count">0</h2></div></div><section class="card"><h2>Add a habit</h2><form id="form"><input id="name" placeholder="e.g. Read 10 pages" maxlength="70" required><button>Add habit</button></form></section><section class="card"><h2 id="today"></h2><div id="list"></div><p id="empty" class="muted">No habits yet — add one above.</p><button id="reset" style="background:#52675d">Uncheck all</button></section></main><script>const $=x=>document.getElementById(x);let habits=JSON.parse(localStorage.getItem('dailyHabits')||'[]');const today=()=>new Date().toLocaleDateString('en-CA');function render(){let d=today();$('today').textContent='Today · '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});$('list').innerHTML='';let done=0;habits.forEach(h=>{if(h.doneDate===d)done++;let row=document.createElement('div');row.className='habit';let cb=document.createElement('input');cb.type='checkbox';cb.checked=h.doneDate===d;cb.onchange=()=>{h.doneDate=cb.checked?d:'';save()};let label=document.createElement('label');label.textContent=h.name;let small=document.createElement('small');small.textContent=cb.checked?'Completed today ✓':'Keep building your streak';label.append(small);let del=document.createElement('button');del.className='remove';del.textContent='Delete';del.onclick=()=>{habits=habits.filter(x=>x.id!==h.id);save()};row.append(cb,label,del);$('list').append(row)});$('empty').hidden=habits.length>0;$('count').textContent=habits.length;$('progress').textContent=(habits.length?Math.round(done/habits.length*100):0)+'%';localStorage.setItem('dailyHabits',JSON.stringify(habits))}function save(){render()}$('form').onsubmit=e=>{e.preventDefault();habits.push({id:Date.now(),name:$('name').value.trim(),doneDate:''});$('form').reset();save()};$('reset').onclick=()=>{habits.forEach(h=>h.doneDate='');save()};render();</script></body></html>
