<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search and filter a curated offline reference of common HTTP status codes."><title>HTTP Status Code Explorer | Frontend Development Journey</title><style>:root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#dbe2ee;--accent:#315eea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.wrap{width:min(850px,calc(100% - 32px));margin:40px auto}h1{font-size:clamp(1.8rem,5vw,2.6rem)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}p{color:var(--muted)}label{display:block;font-weight:650;margin:14px 0}input,select{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}button{padding:10px 14px;border:0;border-radius:9px;background:var(--accent);color:white;font:inherit;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7ca2ff;outline-offset:2px}.row{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.code{font-size:1.4rem;font-weight:800;color:var(--accent);min-width:58px}.category{font-size:.8rem;color:var(--muted)}.desc{margin:3px 0;color:var(--muted)}.count{padding:12px;background:#eef3ff;color:#203052;border-radius:9px;margin:14px 0}@media(prefers-color-scheme:dark){:root{--bg:#101827;--panel:#172235;--ink:#edf2ff;--muted:#a6b2c8;--line:#344158}.count{background:#24365a;color:#e5edff}}</style></head><body><main class="wrap"><p>FRONTEND DEVELOPMENT JOURNEY · JAVASCRIPT REFERENCE</p><h1>HTTP Status Code Explorer</h1><p>Search a compact offline reference of frequently encountered HTTP response codes. Filter by category or search by number, name or meaning.</p><section class="panel"><label for="search">Search status codes</label><input id="search" type="search" placeholder="Try 404, redirect, server error..."><label for="category">Category</label><select id="category"><option value="all">All categories</option><option>Informational</option><option>Success</option><option>Redirection</option><option>Client Error</option><option>Server Error</option></select><div class="count" id="count" aria-live="polite"></div><div id="list"></div></section></main><script>const codes=[[100,'Continue','Informational','Request headers were received; the client can continue sending the request body.'],[101,'Switching Protocols','Informational','The server is switching protocols as requested.'],[200,'OK','Success','The request succeeded.'],[201,'Created','Success','The request succeeded and a resource was created.'],[202,'Accepted','Success','The request was accepted for processing, but processing may not be complete.'],[204,'No Content','Success','The request succeeded and there is no response body.'],[206,'Partial Content','Success','The server is returning the requested range of a resource.'],[301,'Moved Permanently','Redirection','The resource has a permanent new URL.'],[302,'Found','Redirection','The resource is temporarily available at another URL.'],[304,'Not Modified','Redirection','The cached representation can be reused.'],[307,'Temporary Redirect','Redirection','Temporary redirect that preserves the request method.'],[308,'Permanent Redirect','Redirection','Permanent redirect that preserves the request method.'],[400,'Bad Request','Client Error','The server cannot process the request due to invalid syntax or content.'],[401,'Unauthorized','Client Error','Authentication is required or the supplied credentials are invalid.'],[403,'Forbidden','Client Error','The server understood the request but refuses to authorize it.'],[404,'Not Found','Client Error','The requested resource could not be found.'],[405,'Method Not Allowed','Client Error','The request method is not supported for this resource.'],[408,'Request Timeout','Client Error','The server timed out waiting for the request.'],[409,'Conflict','Client Error','The request conflicts with the current state of the resource.'],[410,'Gone','Client Error','The resource is no longer available and will likely remain unavailable.'],[413,'Content Too Large','Client Error','The request content exceeds the server limit.'],[415,'Unsupported Media Type','Client Error','The request media format is not supported.'],[422,'Unprocessable Content','Client Error','The content is syntactically valid but cannot be processed.'],[429,'Too Many Requests','Client Error','The client has sent too many requests in a given time.'],[500,'Internal Server Error','Server Error','The server encountered an unexpected condition.'],[501,'Not Implemented','Server Error','The server does not support the requested functionality.'],[502,'Bad Gateway','Server Error','A gateway received an invalid response from an upstream server.'],[503,'Service Unavailable','Server Error','The server is temporarily unable to handle the request.'],[504,'Gateway Timeout','Server Error','A gateway did not receive a timely upstream response.']];function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),cat=document.querySelector('#category').value;const filtered=codes.filter(c=>(cat==='all'||c[2]===cat)&&c.join(' ').toLowerCase().includes(q));const list=document.querySelector('#list');list.replaceChildren();filtered.forEach(c=>{const row=document.createElement('article');row.className='row';const number=document.createElement('strong');number.className='code';number.textContent=c[0];const info=document.createElement('div');const title=document.createElement('strong');title.textContent=c[1];const category=document.createElement('div');category.className='category';category.textContent=c[2];const desc=document.createElement('p');desc.className='desc';desc.textContent=c[3];info.append(title,category,desc);row.append(number,info);list.append(row)});document.querySelector('#count').textContent=filtered.length+' of '+codes.length+' status codes shown';if(!filtered.length)list.textContent='No matching status codes. Try a different search.'}document.querySelector('#search').addEventListener('input',render);document.querySelector('#category').addEventListener('change',render);render();</script></body></html>
