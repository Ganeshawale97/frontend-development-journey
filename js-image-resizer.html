<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer | Frontend Playground</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d31;--line:#2a3956;--text:#edf3ff;--muted:#a8b5ca;--accent:#8ba7ff;--good:#61dfb4;--bad:#ff9d9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1b2c4b,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:34px 20px 60px}.eyebrow{color:var(--good);font-size:.78rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.3rem);margin:.4rem 0}.lead,.hint{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:20px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.drop{border:1px dashed #526b9c;border-radius:14px;padding:25px;text-align:center;background:#101a2d}.drop input{max-width:100%}label{display:block;font-weight:650;margin:15px 0 7px}input,select{width:100%;background:#0b1324;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.dimensions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:9px;color:var(--muted)}.check input{width:18px}.preview{width:100%;max-height:330px;object-fit:contain;background:repeating-conic-gradient(#263247 0% 25%,#111a2b 0% 50%) 50%/20px 20px;border-radius:12px;min-height:120px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,.download{display:inline-block;border:0;border-radius:10px;background:#344d83;color:white;padding:11px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.status{color:var(--muted);margin-top:12px}.success{color:var(--good)}.error{color:var(--bad)}@media(max-width:720px){.layout{grid-template-columns:1fr}.wrap{padding:25px 14px 45px}}
</style></head><body><main class="wrap">
<div class="eyebrow">JavaScript · Canvas API</div><h1>Image Resizer</h1><p class="lead">Resize an image in your browser, keep its aspect ratio, choose an output format and save the result. Images are processed locally and are not uploaded.</p>
<section class="panel"><div class="layout"><div><div class="drop"><label for="file" style="margin:0 0 10px">Choose an image</label><input id="file" type="file" accept="image/*"><p class="hint">Try a JPG, PNG or WebP image.</p></div>
<div class="dimensions"><div><label for="width">Width (px)</label><input id="width" type="number" min="1" max="5000" value="800"></div><div><label for="height">Height (px)</label><input id="height" type="number" min="1" max="5000" value="600"></div></div>
<label class="check"><input id="lock" type="checkbox" checked> Keep aspect ratio</label>
<label for="format">Output format</label><select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
<label for="quality">Quality (for JPEG/WebP): <span id="qualityValue">85%</span></label><input id="quality" type="range" min="10" max="100" value="85">
<div class="actions"><button id="resize" disabled>Resize image</button><a id="download" class="download" hidden>Download image</a></div><p id="status" class="status" role="status">Choose an image to begin.</p></div>
<div><h2 style="margin-top:0">Preview</h2><img id="preview" class="preview" alt="Selected image preview"><p id="details" class="hint">No image selected.</p><canvas id="canvas" hidden></canvas></div></div></section>
</main><script>
const file=document.getElementById('file'),widthEl=document.getElementById('width'),heightEl=document.getElementById('height'),preview=document.getElementById('preview'),canvas=document.getElementById('canvas'),status=document.getElementById('status'),download=document.getElementById('download');let image=null,ratio=1,sourceUrl=null,outputUrl=null;
function setStatus(text,kind){status.textContent=text;status.className='status '+(kind||'')}
function clearOutput(){download.hidden=true;if(outputUrl){URL.revokeObjectURL(outputUrl);outputUrl=null}}
file.addEventListener('change',()=>{const f=file.files[0];if(!f)return;if(!f.type.startsWith('image/')){setStatus('Please choose a valid image file.','error');return}if(sourceUrl)URL.revokeObjectURL(sourceUrl);sourceUrl=URL.createObjectURL(f);const img=new Image();img.onload=()=>{image=img;ratio=img.width/img.height;widthEl.value=img.width;heightEl.value=img.height;preview.src=sourceUrl;document.getElementById('details').textContent=img.width+' × '+img.height+' px · '+Math.round(f.size/1024)+' KB';document.getElementById('resize').disabled=false;clearOutput();setStatus('Image ready. Set the dimensions and resize.','success')};img.onerror=()=>setStatus('This image could not be opened.','error');img.src=sourceUrl});
widthEl.addEventListener('input',()=>{if(image&&document.getElementById('lock').checked&&widthEl.value)heightEl.value=Math.max(1,Math.round(Number(widthEl.value)/ratio))});
heightEl.addEventListener('input',()=>{if(image&&document.getElementById('lock').checked&&heightEl.value)widthEl.value=Math.max(1,Math.round(Number(heightEl.value)*ratio))});
document.getElementById('quality').addEventListener('input',e=>document.getElementById('qualityValue').textContent=e.target.value+'%');
document.getElementById('resize').addEventListener('click',()=>{if(!image)return;const w=Number(widthEl.value),h=Number(heightEl.value);if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>5000||h>5000){setStatus('Enter width and height between 1 and 5000 pixels.','error');return}canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);ctx.drawImage(image,0,0,w,h);const type=document.getElementById('format').value,quality=Number(document.getElementById('quality').value)/100;canvas.toBlob(blob=>{if(!blob){setStatus('The browser could not create this image format. Try PNG or JPEG.','error');return}clearOutput();outputUrl=URL.createObjectURL(blob);download.href=outputUrl;download.download='resized-image.'+(type==='image/jpeg'?'jpg':type==='image/png'?'png':'webp');download.hidden=false;preview.src=outputUrl;document.getElementById('details').textContent=w+' × '+h+' px · '+Math.round(blob.size/1024)+' KB';setStatus('Image resized successfully. Your download is ready.','success')},type,quality)});
window.addEventListener('beforeunload',()=>{if(sourceUrl)URL.revokeObjectURL(sourceUrl);if(outputUrl)URL.revokeObjectURL(outputUrl)});
</script></body></html>
