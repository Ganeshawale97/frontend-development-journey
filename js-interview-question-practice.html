<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Practice Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#1e293b;font:16px system-ui}.wrap{max-width:920px;margin:35px auto;padding:0 18px}h1{margin-bottom:5px}.muted{color:#64748b}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stat{background:white;border:1px solid #e2e8f0;padding:12px 16px;border-radius:12px;min-width:110px}.stat strong{display:block;font-size:1.4rem}.add{display:flex;gap:8px;margin:18px 0}.add input{flex:1;min-width:0;padding:12px;border:1px solid #cbd5e1;border-radius:9px}button,select{padding:9px 12px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select{background:white;color:#334155;border:1px solid #cbd5e1}.item{display:flex;align-items:center;gap:12px;background:white;padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin:9px 0}.item .text{flex:1;overflow-wrap:anywhere}.item small{display:block;color:#64748b;margin-top:4px}.done .text{text-decoration:line-through;color:#64748b}.delete{background:#b91c1c}.empty{padding:25px;text-align:center;color:#64748b}@media(max-width:520px){.add{flex-wrap:wrap}.add input{flex-basis:100%}.item{align-items:flex-start}.item select{max-width:130px}}
</style></head><body><main class="wrap"><h1>Interview Practice Tracker</h1><p class="muted">Build consistency for DSA, frontend, and technical interviews.</p><section class="stats"><div class="stat"><strong id="total">0</strong>Total</div><div class="stat"><strong id="completed">0</strong>Completed</div><div class="stat"><strong id="remaining">0</strong>To practise</div></section><form class="add" id="form"><input id="question" placeholder="Add a question or topic…" maxlength="180" required><button>Add question</button></form><div class="filters"><select id="category"><option value="All">All categories</option><option>HTML/CSS</option><option>JavaScript</option><option>DSA</option><option>Projects</option><option>HR</option></select><select id="view"><option value="All">All statuses</option><option value="Pending">Pending</option><option value="Done">Completed</option></select></div><section id="list"></section></main><script>
const $=s=>document.querySelector(s);let items=JSON.parse(localStorage.getItem('interviewPractice')||'[]');function save(){localStorage.setItem('interviewPractice',JSON.stringify(items));render()}function render(){$('#total').textContent=items.length;$('#completed').textContent=items.filter(x=>x.done).length;$('#remaining').textContent=items.filter(x=>!x.done).length;const root=$('#list');root.innerHTML='';items.filter(x=>($('#category').value==='All'||x.category===$('#category').value)&&($('#view').value==='All'||($('#view').value==='Done')===x.done)).forEach(x=>{const row=document.createElement('article');row.className='item'+(x.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=x.done;check.setAttribute('aria-label','Mark completed');check.onchange=()=>{x.done=check.checked;save()};const text=document.createElement('div');text.className='text';const title=document.createElement('strong');title.textContent=x.question;const small=document.createElement('small');small.textContent=x.category;text.append(title,small);const cat=document.createElement('select');['HTML/CSS','JavaScript','DSA','Projects','HR'].forEach(c=>{const o=document.createElement('option');o.textContent=c;o.value=c;o.selected=c===x.category;cat.append(o)});cat.setAttribute('aria-label','Question category');cat.onchange=()=>{x.category=cat.value;save()};const del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label','Delete question');del.onclick=()=>{items=items.filter(y=>y.id!==x.id);save()};row.append(check,text,cat,del);root.append(row)});if(!root.children.length){const e=document.createElement('p');e.className='empty';e.textContent='No matching questions. Add one above to get started.';root.append(e)}}$('#form').onsubmit=e=>{e.preventDefault();items.unshift({id:Date.now(),question:$('#question').value.trim(),category:'JavaScript',done:false});$('#question').value='';save()};$('#category').onchange=render;$('#view').onchange=render;render();
</script></body></html>
