<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Invoice Maker</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f7;color:#1e293b;font:15px system-ui}.wrap{max-width:1000px;margin:28px auto;padding:0 16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{border:0;border-radius:8px;background:#2563eb;color:white;padding:10px 14px;cursor:pointer}.secondary{background:#475569}.sheet{background:white;padding:clamp(18px,4vw,42px);box-shadow:0 10px 35px #0f172a10;border-radius:10px}.top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.top h1{font-size:2.4rem;margin:0;color:#2563eb}.field{border:1px solid #d8dee9;border-radius:6px;padding:8px;font:inherit;max-width:100%}.wide{width:100%}.meta{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:25px 0}.meta label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}.items{width:100%;border-collapse:collapse;margin:18px 0}.items th,.items td{border-bottom:1px solid #e2e8f0;padding:10px 5px;text-align:left}.items th{font-size:12px;text-transform:uppercase;color:#64748b}.items input{width:100%;min-width:0;border:1px solid #d8dee9;border-radius:5px;padding:7px}.items .qty{width:65px}.items .price{width:100px}.totals{max-width:330px;margin-left:auto}.totalrow{display:flex;justify-content:space-between;padding:7px 0}.grand{font-size:1.35rem;font-weight:800;border-top:2px solid #1e293b;margin-top:8px;padding-top:12px}.remove{background:#fee2e2;color:#991b1b;padding:6px}.footer{margin-top:25px;color:#64748b;font-size:13px}@media(max-width:520px){.meta{grid-template-columns:1fr}.items th,.items td{padding:7px 3px;font-size:12px}.items .price{width:72px}}@media print{body{background:white}.wrap{margin:0;padding:0}.toolbar,.remove,.no-print{display:none!important}.sheet{box-shadow:none;padding:0}.field,.items input{border:0;padding:0;appearance:none}.items th,.items td{border-bottom:1px solid #bbb}}
</style></head><body><main class="wrap"><div class="toolbar"><button id="add">+ Add item</button><button id="print">Print / Save PDF</button><button class="secondary" id="reset">Reset invoice</button></div><section class="sheet"><header class="top"><div><h1>INVOICE</h1><p style="color:#64748b">Thank you for your business.</p></div><div><label>Invoice number<br><input class="field" id="number" value="INV-1001"></label><br><br><label>Invoice date<br><input class="field" id="date" type="date"></label></div></header><section class="meta"><div><label>FROM</label><input class="field wide" placeholder="Your name or business"><br><br><input class="field wide" placeholder="Your email / address"></div><div><label>BILL TO</label><input class="field wide" placeholder="Client name"><br><br><input class="field wide" placeholder="Client email / address"></div></section><table class="items"><thead><tr><th style="width:48%">Description</th><th>Qty</th><th>Rate (₹)</th><th>Amount</th><th class="no-print"></th></tr></thead><tbody id="rows"></tbody></table><button id="add2" class="secondary no-print">+ Add another item</button><section class="totals"><div class="totalrow"><span>Subtotal</span><strong id="subtotal">₹0.00</strong></div><div class="totalrow"><label for="tax">Tax (%)</label><input class="field" id="tax" type="number" min="0" max="100" value="0" style="width:90px"></div><div class="totalrow"><span>Tax amount</span><strong id="taxAmount">₹0.00</strong></div><div class="totalrow grand"><span>Total due</span><strong id="total">₹0.00</strong></div></section><p class="footer">Payment notes: <input class="field" style="width:min(100%,450px)" placeholder="Add payment instructions or a thank-you note"></p></section></main><script>
const $=s=>document.querySelector(s),rows=$('#rows');function money(n){return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}function addRow(desc='',qty=1,rate=0){const tr=document.createElement('tr');tr.innerHTML='<td><input class="desc" aria-label="Item description" placeholder="Service or product"></td><td><input class="qty" aria-label="Quantity" type="number" min="0" step="1" value="1"></td><td><input class="price" aria-label="Rate in rupees" type="number" min="0" step="0.01" value="0"></td><td class="amount">₹0.00</td><td class="no-print"><button class="remove" aria-label="Remove item">×</button></td>';tr.querySelector('.desc').value=desc;tr.querySelector('.qty').value=qty;tr.querySelector('.price').value=rate;tr.querySelectorAll('input').forEach(i=>i.addEventListener('input',calculate));tr.querySelector('.remove').onclick=()=>{tr.remove();calculate()};rows.append(tr);calculate()}function calculate(){let subtotal=0;[...rows.rows].forEach(r=>{const q=Math.max(0,Number(r.querySelector('.qty').value)||0),p=Math.max(0,Number(r.querySelector('.price').value)||0),amount=q*p;subtotal+=amount;r.querySelector('.amount').textContent=money(amount)});const taxPct=Math.min(100,Math.max(0,Number($('#tax').value)||0)),tax=subtotal*taxPct/100;$('#subtotal').textContent=money(subtotal);$('#taxAmount').textContent=money(tax);$('#total').textContent=money(subtotal+tax)}$('#add').onclick=()=>addRow();$('#add2').onclick=()=>addRow();$('#tax').oninput=calculate;$('#print').onclick=()=>window.print();$('#reset').onclick=()=>{if(confirm('Reset all invoice items and fields?')){rows.innerHTML='';document.querySelectorAll('.sheet input').forEach(i=>{if(i.id==='date')i.value=new Date().toISOString().slice(0,10);else if(i.id==='tax')i.value=0;else if(i.id==='number')i.value='INV-1001';else i.value=''});addRow()}};$('#date').value=new Date().toISOString().slice(0,10);addRow();
</script></body></html>
