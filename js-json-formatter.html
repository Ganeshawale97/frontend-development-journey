<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter & Validator</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1222;color:#e7edf8;font:16px system-ui}.wrap{max-width:1050px;margin:38px auto;padding:0 18px}h1{margin-bottom:4px;font-size:clamp(2rem,5vw,3rem)}p{color:#a7b3ca}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{padding:10px 14px;border:0;border-radius:8px;background:#6d7cff;color:white;cursor:pointer}button.secondary{background:#28344c}textarea{width:100%;min-height:330px;resize:vertical;padding:16px;background:#111a2d;color:#d5f5df;border:1px solid #33415d;border-radius:12px;font:14px/1.6 ui-monospace,monospace;tab-size:2}.status{padding:12px 14px;border-radius:8px;background:#17243a;color:#a7b3ca;margin:12px 0;overflow-wrap:anywhere}.status.good{color:#9ff0bb}.status.bad{color:#ffacb4}.hint{font-size:13px}
</style></head><body><main class="wrap"><h1>JSON Formatter</h1><p>Format, minify, and validate JSON right in your browser.</p><div class="toolbar"><button id="format">Format JSON</button><button id="minify">Minify</button><button id="validate" class="secondary">Validate</button><button id="sample" class="secondary">Load sample</button><button id="clear" class="secondary">Clear</button><button id="copy" class="secondary">Copy output</button></div><textarea id="input" spellcheck="false" aria-label="JSON input" placeholder='Paste JSON here, e.g. {"name":"Ganesh","skills":["HTML","CSS"]}'></textarea><div id="status" class="status" role="status" aria-live="polite">Paste JSON above and choose an action.</div><p class="hint">Your data stays in this page; it is not uploaded to a server.</p></main><script>
const input=document.querySelector('#input'),status=document.querySelector('#status');function parse(){return JSON.parse(input.value)}function show(text,type=''){status.className='status '+type;status.textContent=text}document.querySelector('#format').onclick=()=>{try{input.value=JSON.stringify(parse(),null,2);show('Valid JSON — formatted with 2-space indentation.','good')}catch(e){show('Invalid JSON: '+e.message,'bad')}};document.querySelector('#minify').onclick=()=>{try{input.value=JSON.stringify(parse());show('Valid JSON — minified successfully.','good')}catch(e){show('Invalid JSON: '+e.message,'bad')}};document.querySelector('#validate').onclick=()=>{try{const value=parse();show('Valid JSON. Root type: '+(Array.isArray(value)?'array':value===null?'null':typeof value)+'.','good')}catch(e){show('Invalid JSON: '+e.message,'bad')}};document.querySelector('#sample').onclick=()=>{input.value=JSON.stringify({name:'Ganesh',role:'IT student',skills:['HTML','CSS','JavaScript'],active:true},null,2);show('Sample JSON loaded.','good')};document.querySelector('#clear').onclick=()=>{input.value='';show('Editor cleared.')};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(input.value);show('Copied to clipboard.','good')}catch(e){show('Clipboard access is unavailable. Select the text and copy it manually.','bad')}}
</script></body></html>
