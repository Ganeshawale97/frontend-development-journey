<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Tree Explorer</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d30;--line:#2a3852;--text:#edf3ff;--muted:#9eacc3;--accent:#82a5ff;--green:#62dfbf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1b2b49,var(--bg) 48%);color:var(--text);font:16px/1.55 system-ui,sans-serif}.wrap{max-width:1100px;width:92%;margin:38px auto}.top{margin-bottom:22px}.eyebrow{color:var(--green);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.2rem);margin:.25rem 0}.muted,.hint{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(320px,1.15fr);gap:18px}.panel{background:#111a2b;border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}label{display:block;font-weight:650;margin-bottom:8px}textarea,input{width:100%;background:#0a1221;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}textarea{min-height:320px;resize:vertical;font:13px/1.6 ui-monospace,monospace}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:1px solid #3b527b;background:#243a61;color:white;border-radius:9px;padding:9px 13px;font:inherit;font-weight:650;cursor:pointer}.btn.secondary{background:#18243a;border-color:var(--line)}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.status{min-height:24px;color:var(--muted);font-size:.9rem}.status.error{color:#ff9e9e}.status.ok{color:var(--green)}.tree-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tree{font:14px/1.55 ui-monospace,monospace;overflow:auto;max-height:580px}.node{margin:3px 0 3px 12px}.node[hidden]{display:none}.node details{border-left:1px solid #34435e;padding-left:10px}.node summary{cursor:pointer;color:#c9d8f2;padding:3px 0}.node summary::marker{color:var(--accent)}.leaf{display:flex;gap:8px;align-items:flex-start;padding:4px 0;flex-wrap:wrap}.key{color:#91b5ff}.value{color:#9ee2c9;overflow-wrap:anywhere}.value.string{color:#e8c58c}.value.null{color:#b6a5d9}.copy-path{font:11px system-ui;border:1px solid var(--line);background:#17243a;color:var(--muted);border-radius:6px;padding:2px 6px;cursor:pointer}.node.match>.leaf,.node.match>details>summary{background:#263d5e;border-radius:5px}.empty{color:var(--muted);padding:30px;text-align:center}@media(max-width:800px){.layout{grid-template-columns:1fr}.wrap{margin:24px auto}textarea{min-height:220px}}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">JavaScript · Data tools</div><h1>JSON Tree Explorer</h1><p class="muted">Paste JSON to explore nested objects and arrays, search for values, and copy a node's path or value. Everything stays in your browser.</p></header>
<div class="layout"><section class="panel"><label for="source">JSON input</label><textarea id="source" spellcheck="false" aria-describedby="inputHint"></textarea><p id="inputHint" class="hint">Valid JSON is required. Try the sample or paste your own data.</p><div class="row"><button class="btn" id="render">Explore JSON</button><button class="btn secondary" id="sample">Load sample</button><button class="btn secondary" id="clear">Clear</button></div><div id="status" class="status" role="status" aria-live="polite"></div></section>
<section class="panel"><label for="search">Find a key or value</label><input id="search" type="search" placeholder="Search tree…" autocomplete="off"><div class="tree-tools"><button class="btn secondary" id="expand">Expand all</button><button class="btn secondary" id="collapse">Collapse all</button><button class="btn secondary" id="copyJson">Copy formatted JSON</button></div><div id="tree" class="tree" aria-live="polite"><div class="empty">Your JSON tree will appear here.</div></div></section></div></main>
<script>
const sample={profile:{name:"Ganesh Awale",role:"Frontend learner",location:"Pune"},skills:["HTML","CSS","JavaScript"],projects:[{name:"Portfolio",complete:true},{name:"JSON Tree Explorer",complete:false}],stats:{days:24,commits:300}};
const source=document.getElementById("source"),tree=document.getElementById("tree"),status=document.getElementById("status"),search=document.getElementById("search");let parsed=null;
function setStatus(message,type){status.textContent=message;status.className="status "+(type||"")}
function makeNode(key,value,path){const wrap=document.createElement("div");wrap.className="node";let own=String(key)+" ";if(value===null||typeof value!=="object")own+=String(value);wrap.dataset.own=own.toLowerCase();const isBranch=value!==null&&typeof value==="object";if(isBranch){const details=document.createElement("details");details.open=path==="$";const summary=document.createElement("summary");const size=Array.isArray(value)?value.length:Object.keys(value).length;summary.textContent=key+"  "+(Array.isArray(value)?"["+size+" items]":"{"+size+" keys}");details.append(summary);const children=document.createElement("div");children.className="children";const entries=Array.isArray(value)?value.map((v,i)=>[String(i),v]):Object.entries(value);entries.forEach(([childKey,childValue])=>children.append(makeNode(childKey,childValue,path+(Array.isArray(value)?"["+childKey+"]":"."+childKey))));details.append(children);wrap.append(details)}else{const line=document.createElement("div");line.className="leaf";const keyEl=document.createElement("span");keyEl.className="key";keyEl.textContent=key+":";const val=document.createElement("span");val.className="value "+(typeof value==="string"?"string":value===null?"null":"");val.textContent=JSON.stringify(value);const copy=document.createElement("button");copy.className="copy-path";copy.type="button";copy.textContent="Copy path";copy.setAttribute("aria-label","Copy path "+path);copy.addEventListener("click",()=>navigator.clipboard.writeText(path).then(()=>setStatus("Copied path: "+path,"ok")).catch(()=>setStatus("Clipboard access is unavailable in this browser.","error")));const copyValue=document.createElement("button");copyValue.className="copy-path";copyValue.type="button";copyValue.textContent="Copy value";copyValue.addEventListener("click",()=>navigator.clipboard.writeText(JSON.stringify(value)).then(()=>setStatus("Copied value.","ok")).catch(()=>setStatus("Clipboard access is unavailable.","error")));line.append(keyEl,val,copy,copyValue);wrap.append(line)}return wrap}
function filterNode(el,q){const own=el.dataset.own.includes(q);let childMatch=false;const children=el.querySelector(":scope > details > .children");if(children){Array.from(children.children).forEach(child=>{if(filterNode(child,q))childMatch=true});const details=el.querySelector(":scope > details");if(q&&childMatch)details.open=true}const visible=!q||own||childMatch;el.hidden=!visible;el.classList.toggle("match",!!q&&own);return visible}
function explore(){try{parsed=JSON.parse(source.value);tree.replaceChildren(makeNode("$",parsed,"$"));filterNode(tree.firstElementChild,search.value.trim().toLowerCase());setStatus("Valid JSON · tree rendered successfully.","ok")}catch(err){parsed=null;tree.innerHTML='<div class="empty">Could not parse this JSON. Check commas, quotes and brackets.</div>';setStatus(err.message,"error")}}
document.getElementById("render").addEventListener("click",explore);document.getElementById("sample").addEventListener("click",()=>{source.value=JSON.stringify(sample,null,2);explore()});document.getElementById("clear").addEventListener("click",()=>{source.value="";tree.innerHTML='<div class="empty">Your JSON tree will appear here.</div>';parsed=null;setStatus("Input cleared.")});document.getElementById("expand").addEventListener("click",()=>tree.querySelectorAll("details").forEach(d=>d.open=true));document.getElementById("collapse").addEventListener("click",()=>tree.querySelectorAll("details").forEach(d=>d.open=false));document.getElementById("copyJson").addEventListener("click",()=>{if(parsed===null){setStatus("Explore valid JSON first.","error");return}navigator.clipboard.writeText(JSON.stringify(parsed,null,2)).then(()=>setStatus("Formatted JSON copied.","ok")).catch(()=>setStatus("Clipboard access is unavailable.","error"))});search.addEventListener("input",()=>{if(tree.firstElementChild?.classList.contains("node"))filterNode(tree.firstElementChild,search.value.trim().toLowerCase())});source.value=JSON.stringify(sample,null,2);explore();
</script></body></html>
