<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanban Task Board</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f4f6fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0}.muted{color:#697386}.form{display:flex;gap:8px;margin:22px 0}.form input{flex:1;min-width:150px;padding:12px;border:1px solid #ccd3df;border-radius:10px}button,select{padding:9px 11px;border:0;border-radius:8px;cursor:pointer;background:#253cbb;color:white}button:hover{opacity:.85}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.col{background:#e7ebf4;padding:14px;border-radius:14px;min-height:280px}.col h2{font-size:1rem;display:flex;justify-content:space-between}.task{background:white;border-radius:10px;padding:13px;margin:10px 0;box-shadow:0 3px 12px #18264a0d}.task p{margin:0 0 12px;overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:6px 8px}.del{background:#b42336}.empty{color:#7b8496;font-size:14px}@media(max-width:700px){.board{grid-template-columns:1fr}.col{min-height:100px}.form{flex-wrap:wrap}}
</style></head><body><main class="wrap"><header><div><h1>Kanban Board</h1><p class="muted">Organize tasks into To do, In progress, and Done.</p></div><button id="clear">Clear board</button></header><form class="form" id="form"><input id="taskInput" maxlength="140" placeholder="What needs to get done?" required><button>Add task</button></form><section class="board" id="board"></section></main><script>
const cols=['todo','doing','done'], labels={todo:'To do',doing:'In progress',done:'Done'};let tasks=JSON.parse(localStorage.getItem('kanbanTasks')||'[]');const board=document.querySelector('#board');
function save(){localStorage.setItem('kanbanTasks',JSON.stringify(tasks));render()}
function render(){board.innerHTML='';cols.forEach(c=>{const col=document.createElement('div');col.className='col';const title=document.createElement('h2');title.innerHTML=labels[c]+' <span>'+tasks.filter(t=>t.status===c).length+'</span>';col.append(title);const list=tasks.filter(t=>t.status===c);if(!list.length){const e=document.createElement('p');e.className='empty';e.textContent='No tasks here yet.';col.append(e)}list.forEach(t=>{const card=document.createElement('article');card.className='task';const p=document.createElement('p');p.textContent=t.text;const actions=document.createElement('div');actions.className='actions';const sel=document.createElement('select');cols.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=labels[s];o.selected=s===t.status;sel.append(o)});sel.setAttribute('aria-label','Move task');sel.onchange=()=>{t.status=sel.value;save()};const del=document.createElement('button');del.textContent='Delete';del.className='del';del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save()};actions.append(sel,del);card.append(p,actions);col.append(card)});board.append(col)})}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#taskInput');tasks.push({id:Date.now(),text:input.value.trim(),status:'todo'});input.value='';save()};document.querySelector('#clear').onclick=()=>{if(confirm('Delete every task?')){tasks=[];save()}};render();
</script></body></html>
