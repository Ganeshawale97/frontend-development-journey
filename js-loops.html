<!DOCTYPE html>
<html>
<head><title>JavaScript Loops</title></head>
<body>
    <h1>JavaScript Loops</h1>
    <h2>Numbers from 1 to 5</h2>
    <ul id="numbers"></ul>
    <script>
        const list = document.getElementById("numbers");
        for (let i = 1; i <= 5; i++) {
            const item = document.createElement("li");
            item.textContent = "Number " + i;
            list.appendChild(item);
        }
    </script>
</body>
</html>
