<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mood Selector</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#fdf2f8;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;color:#831843}.card{max-width:440px;width:100%;background:white;padding:28px;border-radius:16px;text-align:center;box-shadow:0 10px 30px #83184315}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{font-size:1rem;padding:12px;border:0;border-radius:9px;background:#fbcfe8;cursor:pointer}#message{font-size:1.2rem;min-height:2em}</style></head><body><main class="card"><h1>How are you feeling?</h1><p>Choose a mood to update the message.</p><div class="choices"><button data-mood="happy">😊 Happy</button><button data-mood="calm">😌 Calm</button><button data-mood="curious">🤔 Curious</button><button data-mood="tired">😴 Tired</button></div><p id="message" aria-live="polite">Choose a mood above.</p><small>Practice: data attributes, events, and DOM updates.</small></main><script>const messages={happy:"Keep sharing that positive energy!",calm:"Take a slow breath and enjoy the moment.",curious:"Ask a question and explore something new.",tired:"A short break and some water may help."};document.querySelectorAll("[data-mood]").forEach(button=>button.addEventListener("click",()=>{document.querySelector("#message").textContent=messages[button.dataset.mood];}));</script></body></html>
