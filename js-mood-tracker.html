<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mood Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ff;color:#292341;font:16px system-ui;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 10px 30px #2213440b}.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}.moods button{background:#f0edff;color:#322657;border:2px solid transparent;padding:16px 8px;border-radius:12px;font:inherit;cursor:pointer}.moods button:focus,.moods button:hover{border-color:#7c5ce0}.moods span{display:block;font-size:2rem}textarea{width:100%;padding:12px;border:1px solid #ddd5f1;border-radius:10px;font:inherit}button.save{background:#6846c7;color:white;border:0;padding:12px 16px;border-radius:10px;cursor:pointer;margin-top:10px}.entry{padding:12px 0;border-bottom:1px solid #eee}.muted{color:#766f8c}</style><body><main class="wrap"><h1>🌤️ Mood Journal</h1><p class="muted">Check in with yourself. Entries stay in this browser.</p><section class="card"><h2>How are you feeling today?</h2><div class="moods" id="moods"><button data-mood="Great"> <span>😄</span>Great</button><button data-mood="Good"><span>🙂</span>Good</button><button data-mood="Okay"><span>😐</span>Okay</button><button data-mood="Low"><span>😔</span>Low</button><button data-mood="Stressed"><span>😣</span>Stressed</button></div><p id="chosen" class="muted">Choose a mood to begin.</p><label for="note">Optional note</label><textarea id="note" rows="3" maxlength="400" placeholder="What is on your mind?"></textarea><button class="save" id="save">Save today's check-in</button><p id="msg" role="status"></p></section><section class="card"><h2>Recent check-ins</h2><div id="history"></div><button class="save" id="clear" style="background:#666">Clear history</button></section></main><script>const $=x=>document.getElementById(x);let selected='',entries=JSON.parse(localStorage.getItem('moodJournal')||'[]');document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{selected=b.dataset.mood;$('chosen').textContent='Selected: '+selected;document.querySelectorAll('[data-mood]').forEach(x=>x.style.borderColor=x===b?'#7c5ce0':'transparent')});function render(){$('history').innerHTML='';if(!entries.length)$('history').textContent='No check-ins yet.';entries.slice().reverse().forEach(e=>{let d=document.createElement('div');d.className='entry';let b=document.createElement('b');b.textContent=e.date+' · '+e.mood;let p=document.createElement('p');p.textContent=e.note||'No note added.';d.append(b,p);$('history').append(d)});localStorage.setItem('moodJournal',JSON.stringify(entries))}$('save').onclick=()=>{if(!selected){$('msg').textContent='Please choose a mood first.';return}let date=new Date().toLocaleDateString();entries.push({date,mood:selected,note:$('note').value.trim()});$('note').value='';$('msg').textContent='Check-in saved.';render()};$('clear').onclick=()=>{if(confirm('Clear all mood entries?')){entries=[];render()}};render();</script></body></html>
