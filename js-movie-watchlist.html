<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Watchlist</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f3f4f6;font:16px system-ui}.wrap{max-width:1000px;margin:36px auto;padding:0 18px}h1{font-size:clamp(2rem,5vw,3rem);margin:0}.muted{color:#9ca3af}.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:22px 0}.form input,.form select,.filters input,.filters select{min-width:0;padding:11px;border:1px solid #374151;background:#1f2937;color:#f9fafb;border-radius:9px}.form button,button{padding:10px 13px;border:0;border-radius:9px;background:#f59e0b;color:#111827;font-weight:650;cursor:pointer}.filters{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.filters input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.movie{background:#1f2937;border:1px solid #374151;border-radius:13px;padding:16px}.movie h2{font-size:1.15rem;margin:0 0 6px;overflow-wrap:anywhere}.movie p{color:#9ca3af;margin:5px 0}.badge{display:inline-block;background:#374151;border-radius:20px;padding:4px 9px;font-size:12px;margin:6px 0}.movie button{margin:9px 5px 0 0;font-size:13px}.remove{background:#ef4444;color:white}.empty{color:#9ca3af}@media(max-width:650px){.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}}@media(max-width:420px){.form{grid-template-columns:1fr}.form input:first-child{grid-column:auto}}
</style></head><body><main class="wrap"><h1>🎬 Movie Watchlist</h1><p class="muted">Save films for later, track what you've watched, and filter your list.</p><form id="form" class="form"><input id="title" placeholder="Movie title" maxlength="100" required><input id="year" type="number" min="1888" max="2100" placeholder="Year"><select id="status"><option>Want to watch</option><option>Watching</option><option>Watched</option></select><button>Add movie</button></form><div class="filters"><input id="search" placeholder="Search movies…" aria-label="Search movies"><select id="filter"><option>All statuses</option><option>Want to watch</option><option>Watching</option><option>Watched</option></select></div><p class="muted" id="stats"></p><section class="grid" id="grid"></section></main><script>
const $=s=>document.querySelector(s);let movies=JSON.parse(localStorage.getItem('movieWatchlist')||'[]');function save(){localStorage.setItem('movieWatchlist',JSON.stringify(movies));render()}function render(){const q=$('#search').value.toLowerCase(),f=$('#filter').value;$('#stats').textContent=movies.length+' saved · '+movies.filter(m=>m.status==='Watched').length+' watched';const root=$('#grid');root.innerHTML='';movies.filter(m=>(f==='All statuses'||m.status===f)&&(m.title+' '+m.year).toLowerCase().includes(q)).forEach(m=>{const card=document.createElement('article');card.className='movie';const h=document.createElement('h2');h.textContent=m.title;const p=document.createElement('p');p.textContent=m.year||'Release year not set';const b=document.createElement('span');b.className='badge';b.textContent=m.status;const next=document.createElement('button');next.textContent='Change status';next.onclick=()=>{m.status=({'Want to watch':'Watching','Watching':'Watched','Watched':'Want to watch'})[m.status];save()};const del=document.createElement('button');del.textContent='Remove';del.className='remove';del.onclick=()=>{movies=movies.filter(x=>x.id!==m.id);save()};card.append(h,p,b,document.createElement('br'),next,del);root.append(card)});if(!root.children.length){const p=document.createElement('p');p.className='empty';p.textContent='No movies match. Add a film to start your watchlist.';root.append(p)}}$('#form').onsubmit=e=>{e.preventDefault();movies.unshift({id:Date.now(),title:$('#title').value.trim(),year:$('#year').value,status:$('#status').value});e.target.reset();save()};$('#search').oninput=render;$('#filter').onchange=render;render();
</script></body></html>
