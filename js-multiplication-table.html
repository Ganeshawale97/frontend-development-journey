<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Multiplication Table</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f8fafc;color:#172033;margin:0;padding:24px}
main{max-width:560px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0f172a12}
.controls{display:flex;gap:10px;flex-wrap:wrap}input,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #cbd5e1}
input{width:110px}button{background:#2563eb;color:white;border:0;cursor:pointer}button:hover{background:#1d4ed8}
#table{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.line{padding:10px;background:#eff6ff;border-radius:7px}
</style></head>
<body><main><h1>Multiplication Table</h1><p>Enter a number and choose how far the table should go.</p>
<div class="controls"><label>Number <input id="number" type="number" min="0" max="999" value="7"></label>
<label>Up to <input id="limit" type="number" min="1" max="30" value="10"></label><button id="generate">Generate</button></div>
<div id="table" aria-live="polite"></div></main>
<script>
const numberInput=document.querySelector("#number"),limitInput=document.querySelector("#limit"),table=document.querySelector("#table");
function generate(){
 const number=Number(numberInput.value),limit=Number(limitInput.value);
 if(numberInput.value===""||limitInput.value===""||!Number.isInteger(number)||number<0||number>999||!Number.isInteger(limit)||limit<1||limit>30){table.textContent="Enter a number from 0 to 999 and a limit from 1 to 30.";return;}
 table.replaceChildren();
 for(let i=1;i<=limit;i++){const row=document.createElement("div");row.className="line";row.textContent=number+" × "+i+" = "+number*i;table.append(row);}
}
document.querySelector("#generate").addEventListener("click",generate);generate();
</script></body></html>
