<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes App</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#262626;font:16px system-ui;padding:28px}.wrap{max-width:900px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0}input,textarea,button{font:inherit;border-radius:10px;border:1px solid #ddd;padding:12px}#search{min-width:220px}form{background:white;padding:18px;border:1px solid #e8e5dd;border-radius:16px;display:grid;gap:10px;margin:22px 0}textarea{min-height:100px;resize:vertical}button{cursor:pointer;background:#292524;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.note{background:#fff7cc;border-radius:14px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:140px;display:flex;flex-direction:column;gap:12px}.note h3{margin:0}.note p{margin:0;flex:1}.note small{color:#6b6250}.note button{align-self:flex-end;background:#7c2d12;padding:7px 10px}.muted{color:#777}</style></head><body><main class="wrap"><header><div><h1>My Notes ✍️</h1><p class="muted">A little space for big ideas.</p></div><input id="search" placeholder="Search notes…" aria-label="Search notes"></header><form id="form"><input id="title" maxlength="80" placeholder="Note title" required><textarea id="body" maxlength="2000" placeholder="Write your note…" required></textarea><button>Save note</button></form><p id="count" class="muted"></p><section id="notes" class="grid"></section></main><script>
const form=document.querySelector('#form'),title=document.querySelector('#title'),body=document.querySelector('#body'),search=document.querySelector('#search'),grid=document.querySelector('#notes'),count=document.querySelector('#count');let notes=JSON.parse(localStorage.getItem('quickNotes')||'[]');
function render(){const term=search.value.trim().toLowerCase(),filtered=notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(term));count.textContent=filtered.length+' note'+(filtered.length===1?'':'s');grid.replaceChildren();if(!filtered.length){const p=document.createElement('p');p.className='muted';p.textContent=notes.length?'No matching notes.':'Your saved notes will appear here.';grid.append(p)}filtered.forEach(n=>{const card=document.createElement('article');card.className='note';const h=document.createElement('h3');h.textContent=n.title;const p=document.createElement('p');p.textContent=n.body;const date=document.createElement('small');date.textContent=new Date(n.created).toLocaleString();const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{notes=notes.filter(x=>x.id!==n.id);save()};card.append(h,p,date,del);grid.append(card)})}
function save(){localStorage.setItem('quickNotes',JSON.stringify(notes));render()}form.onsubmit=e=>{e.preventDefault();notes.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:title.value.trim(),body:body.value.trim(),created:Date.now()});save();form.reset();title.focus()};search.oninput=render;render();
</script></body></html>
