<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Operators</title>
</head>
<body>
    <h1>JavaScript Operators</h1>
    <p id="output"></p>

    <script>
        let a = 20;
        let b = 5;

        let addition = a + b;
        let subtraction = a - b;
        let multiplication = a * b;
        let division = a / b;

        document.getElementById("output").innerHTML =
            "Addition: " + addition + "<br>" +
            "Subtraction: " + subtraction + "<br>" +
            "Multiplication: " + multiplication + "<br>" +
            "Division: " + division;
    </script>
</body>
</html>
