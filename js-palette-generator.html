<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Color Palette Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f8fafc;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:850px;margin:auto}button{padding:11px 16px;border:0;border-radius:9px;background:#4338ca;color:white;cursor:pointer}.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:20px}.swatch{min-height:180px;border-radius:12px;display:flex;align-items:end;padding:12px;color:white;text-shadow:0 1px 4px #0009;font-weight:700;cursor:pointer;border:1px solid #0001}.hint{color:#64748b}@media(max-width:600px){.palette{grid-template-columns:repeat(2,minmax(0,1fr))}.swatch{min-height:120px}}
</style></head><body><main class="wrap"><h1>Color Palette Generator</h1><p>Generate five colors, then tap a swatch to copy its hex code.</p><button id="generate">Generate palette</button><div id="palette" class="palette"></div><p id="message" class="hint" aria-live="polite">Ready to create a palette.</p>
<script>
const palette=document.querySelector("#palette"),message=document.querySelector("#message");
function makePalette(){palette.replaceChildren();for(let i=0;i<5;i++){const color="#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0").toUpperCase();const swatch=document.createElement("button");swatch.className="swatch";swatch.style.backgroundColor=color;swatch.textContent=color;swatch.setAttribute("aria-label","Copy color "+color);swatch.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(color);message.textContent=color+" copied.";}catch{message.textContent="Color: "+color+" (copy it manually).";}});palette.append(swatch);}}
document.querySelector("#generate").addEventListener("click",makePalette);makePalette();
</script></main></body></html>
