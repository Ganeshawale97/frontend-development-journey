<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Palindrome Checker</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f5f3ff;color:#2e1065;font-family:system-ui,sans-serif}.app{width:min(100%,480px);padding:26px;background:white;border-radius:16px;box-shadow:0 12px 35px #2e106510}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #c4b5fd;border-radius:8px;font:inherit}button{margin-top:14px;padding:11px 16px;background:#6d28d9;color:white;border:0;border-radius:8px;cursor:pointer}.result{margin-top:18px;padding:14px;border-radius:9px;background:#ede9fe;min-height:50px}
</style></head><body><main class="app"><h1>Palindrome Checker</h1><p>A palindrome reads the same forward and backward, ignoring spaces, punctuation, and letter case.</p><form id="form"><label for="phrase">Enter a word or phrase</label><input id="phrase" maxlength="300" required placeholder="e.g. Never odd or even"><button>Check palindrome</button></form><div class="result" id="result" aria-live="polite">Your result will appear here.</div>
<script>
document.querySelector("#form").addEventListener("submit",event=>{event.preventDefault();const original=document.querySelector("#phrase").value;const normalized=Array.from(original.toLocaleLowerCase()).filter(char=>/[\p{L}\p{N}]/u.test(char)).join("");const result=document.querySelector("#result");if(!normalized){result.textContent="Please enter at least one letter or number.";return;}const reversed=Array.from(normalized).reverse().join("");result.textContent=normalized===reversed?"Yes — this is a palindrome!":"No — this is not a palindrome.";});
</script></main></body></html>
