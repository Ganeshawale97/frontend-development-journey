<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Password Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef2ff;color:#172033;font-family:Arial,sans-serif}
main{width:min(100%,480px);padding:26px;background:white;border-radius:18px;box-shadow:0 16px 45px #312e8118}
h1{margin-top:0}.output{display:flex;gap:8px;margin:18px 0}.output input{min-width:0;flex:1;font-family:monospace;font-size:1rem}
input[type=text],input[type=number]{padding:12px;border:1px solid #cbd5e1;border-radius:8px}
button{padding:11px 14px;border:0;border-radius:8px;background:#4338ca;color:white;cursor:pointer}button:hover{background:#3730a3}
.option{display:flex;align-items:center;gap:9px;margin:12px 0}.option input{accent-color:#4338ca}
#message{min-height:1.4em;color:#047857;font-size:.9rem}#strength{height:7px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-top:10px}#bar{height:100%;width:0;background:#4f46e5;transition:width .2s}
</style>
</head>
<body><main><h1>Password Generator</h1><p>Create a random password with the options you choose.</p>
<label for="length">Password length (8–64)</label><br><input id="length" type="number" min="8" max="64" value="16">
<div class="option"><input id="lower" type="checkbox" checked><label for="lower">Lowercase letters (a–z)</label></div>
<div class="option"><input id="upper" type="checkbox" checked><label for="upper">Uppercase letters (A–Z)</label></div>
<div class="option"><input id="numbers" type="checkbox" checked><label for="numbers">Numbers (0–9)</label></div>
<div class="option"><input id="symbols" type="checkbox" checked><label for="symbols">Symbols (!@#$…)</label></div>
<button id="generate">Generate password</button>
<div class="output"><input id="password" type="text" readonly aria-label="Generated password" placeholder="Your password appears here"><button id="copy">Copy</button></div>
<div id="strength" aria-hidden="true"><div id="bar"></div></div><p id="message" aria-live="polite"></p>
<script>
const $=id=>document.getElementById(id);
const groups=[["lower","abcdefghijklmnopqrstuvwxyz"],["upper","ABCDEFGHIJKLMNOPQRSTUVWXYZ"],["numbers","0123456789"],["symbols","!@#$%^&*()-_=+[]{};:,.?"]];
function generate(){
 const length=Number($("length").value),selected=groups.filter(([id])=>$(id).checked);
 if(!Number.isInteger(length)||length<8||length>64){$("message").textContent="Choose a length between 8 and 64.";return;}
 if(!selected.length){$("message").textContent="Select at least one character type.";return;}
 const pool=selected.map(([,chars])=>chars).join("");let result="";
 const randomIndex=max=>{if(crypto.getRandomValues){const values=new Uint32Array(1);crypto.getRandomValues(values);return values[0]%max;}return Math.floor(Math.random()*max);};
 selected.forEach(([,chars])=>result+=chars[randomIndex(chars.length)]);
 while(result.length<length)result+=pool[randomIndex(pool.length)];
 result=result.split("");for(let i=result.length-1;i>0;i--){const j=randomIndex(i+1);[result[i],result[j]]=[result[j],result[i]];}
 $("password").value=result.join("");$("message").textContent="Password generated. Store it in a trusted password manager.";
 $("bar").style.width=Math.min(100,selected.length*25+(length>=16?20:0))+"%";
}
$("generate").addEventListener("click",generate);
$("copy").addEventListener("click",async()=>{if(!$("password").value){$("message").textContent="Generate a password first.";return;}try{await navigator.clipboard.writeText($("password").value);$("message").textContent="Copied to clipboard.";}catch{$("password").select();$("message").textContent="Copy is unavailable here; select the password and copy it manually.";}});
generate();
</script></main></body></html>
