<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
body{font-family:Arial,sans-serif;max-width:520px;margin:40px auto;padding:0 16px}
input,button{padding:10px;margin:6px 0}
#password{width:95%}
</style>
</head>
<body>
<h1>Password Generator</h1>
<label for="length">Password length (8–40):</label>
<input id="length" type="number" min="8" max="40" value="16">
<br>
<label><input id="symbols" type="checkbox" checked> Include symbols</label>
<br>
<button id="generate">Generate Password</button>
<br>
<label for="password">Generated password:</label>
<input id="password" type="text" readonly>
<button id="copy">Copy</button>
<p id="message" aria-live="polite"></p>
<script>
const lengthInput=document.getElementById("length");
const passwordInput=document.getElementById("password");
const message=document.getElementById("message");
document.getElementById("generate").addEventListener("click",function(){
const length=Number(lengthInput.value);
if(!Number.isInteger(length)||length<8||length>40){message.textContent="Choose a length from 8 to 40.";return;}
const letters="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
const symbols="!@#$%^&*()-_=+?";
const chars=letters+(document.getElementById("symbols").checked?symbols:"");
const randomValues=new Uint32Array(length);
crypto.getRandomValues(randomValues);
let password="";
for(const value of randomValues)password+=chars[value%chars.length];
passwordInput.value=password;
message.textContent="Password generated. Avoid sharing it with anyone.";
});
document.getElementById("copy").addEventListener("click",async function(){
if(!passwordInput.value){message.textContent="Generate a password first.";return;}
try{await navigator.clipboard.writeText(passwordInput.value);message.textContent="Copied to clipboard.";}
catch(error){passwordInput.select();message.textContent="Select and copy the password manually.";}
});
</script>
</body>
</html>
