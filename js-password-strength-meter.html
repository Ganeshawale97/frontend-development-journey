<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Strength Meter</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f0fdfa;color:#134e4a;font:16px system-ui}.card{width:min(470px,100%);padding:28px;background:white;border:1px solid #ccfbf1;border-radius:20px;box-shadow:0 18px 45px #115e5912}h1{margin-top:0}label{display:block;font-weight:600;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #99f6e4;border-radius:10px;font:inherit}.meter{height:8px;background:#e5e7eb;border-radius:8px;margin:12px 0;overflow:hidden}.meter span{display:block;height:100%;width:0;background:#ef4444;transition:width .2s,background .2s}#label{font-weight:700}ul{padding-left:20px;line-height:1.9;color:#64748b}.yes{color:#0f766e}small{color:#64748b}</style></head><body><main class="card"><h1>Password strength</h1><p>Demo locally checks common password characteristics. Do not enter a real password.</p><label for="password">Test password</label><input id="password" type="password" autocomplete="off" placeholder="Type a sample password"><div class="meter" role="progressbar" aria-label="Password strength" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span id="bar"></span></div><div id="label" aria-live="polite">Enter a sample password</div><ul><li id="length">At least 8 characters</li><li id="upper">Contains an uppercase letter</li><li id="number">Contains a number</li><li id="symbol">Contains a symbol</li></ul><small>This is an educational estimate, not a security audit.</small></main><script>
const input=document.querySelector('#password'),bar=document.querySelector('#bar'),label=document.querySelector('#label'),meter=document.querySelector('[role=progressbar]');const checks=[['length',v=>v.length>=8],['upper',v=>/[A-Z]/.test(v)],['number',v=>/[0-9]/.test(v)],['symbol',v=>/[^A-Za-z0-9]/.test(v)]];input.addEventListener('input',()=>{const v=input.value;let score=0;checks.forEach(([id,test])=>{const ok=test(v);if(ok)score++;const el=document.querySelector('#'+id);el.classList.toggle('yes',ok);el.textContent=(ok?'✓ ':'○ ')+({length:'At least 8 characters',upper:'Contains an uppercase letter',number:'Contains a number',symbol:'Contains a symbol'}[id])});bar.style.width=(score/4*100)+'%';bar.style.background=['#ef4444','#f97316','#eab308','#14b8a6','#0d9488'][score];meter.setAttribute('aria-valuenow',score);label.textContent=v.length===0?'Enter a sample password':['Very weak','Weak','Fair','Strong','Great'][score]});
</script></body></html>
