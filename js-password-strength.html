<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Checker</title>
</head>
<body>
<h1>Password Strength Checker</h1>
<label for="password">Enter a sample password:</label><br>
<input id="password" type="password" autocomplete="new-password">
<p id="strength" aria-live="polite">Strength will appear here.</p>
<p>Tip: use a long, unique password with a mix of character types.</p>
<script>
const password=document.getElementById("password");
const strength=document.getElementById("strength");
password.addEventListener("input",function(){
const value=password.value;
let score=0;
if(value.length>=8)score++;
if(value.length>=12)score++;
if(/[a-z]/.test(value)&&/[A-Z]/.test(value))score++;
if(/[0-9]/.test(value))score++;
if(/[^A-Za-z0-9]/.test(value))score++;
const labels=["Very weak","Weak","Fair","Good","Strong","Very strong"];
strength.textContent=value.length===0?"Strength will appear here.":"Estimated strength: "+labels[score];
});
</script>
</body>
</html>
