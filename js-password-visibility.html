<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Password Visibility Toggle</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eff6ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;color:#1e293b}.card{background:white;padding:28px;border-radius:16px;width:100%;max-width:420px;box-shadow:0 10px 30px #1e40af18}label{display:block;margin:14px 0 6px}input,button{font:inherit;padding:12px;border-radius:8px}input{width:100%;border:1px solid #cbd5e1}button{margin-top:12px;border:0;background:#1d4ed8;color:white;cursor:pointer;width:100%}#hint{color:#475569}</style></head><body><main class="card"><h1>Password visibility</h1><p>Use the button to show or hide the password.</p><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter a sample password"><button id="toggle" type="button" aria-pressed="false">Show password</button><p id="hint" aria-live="polite">Your password is hidden.</p><small>Practice: input types, click events, and accessible button states.</small></main><script>const password=document.querySelector("#password"),toggle=document.querySelector("#toggle"),hint=document.querySelector("#hint");toggle.addEventListener("click",()=>{const showing=password.type==="password";password.type=showing?"text":"password";toggle.textContent=showing?"Hide password":"Show password";toggle.setAttribute("aria-pressed",String(showing));hint.textContent=showing?"Your password is visible.":"Your password is hidden.";});</script></body></html>
