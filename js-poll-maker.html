<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Poll Maker</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e5edff,#f8e9ff);font:16px system-ui;color:#202642}.app{width:min(680px,100%);background:#fff;padding:clamp(20px,5vw,38px);border-radius:22px;box-shadow:0 20px 60px #35416b20}h1{margin:0}.muted{color:#6e7590}.form{display:grid;gap:10px;margin:22px 0}.form input{padding:12px;border:1px solid #d9deea;border-radius:10px}.row{display:flex;gap:8px}.row input{flex:1;min-width:0}button{border:0;border-radius:10px;padding:11px 14px;background:#4c52cf;color:white;cursor:pointer}.secondary{background:#eef0ff;color:#383e9b}.option{margin:14px 0}.optHead{display:flex;justify-content:space-between;gap:12px}.bar{height:9px;background:#eceef7;border-radius:9px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#555de5,#b15fe7);width:0;transition:width .3s}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.notice{min-height:24px;color:#4c52cf}
</style></head><body><main class="app"><h1>Quick Poll Maker 🗳️</h1><p class="muted">Create a poll, share this page locally, and vote. Results are saved in this browser.</p><form class="form" id="create"><input id="question" placeholder="Ask a question…" maxlength="160" required><div id="optionInputs"><input class="pollOption" placeholder="Option 1" maxlength="80" required><input class="pollOption" placeholder="Option 2" maxlength="80" required></div><div class="actions"><button type="button" class="secondary" id="addOption">+ Add option</button><button>Create poll</button></div></form><hr style="border:0;border-top:1px solid #eee;margin:25px 0"><section id="poll"></section><p class="notice" id="notice" role="status"></p><div class="actions"><button class="secondary" id="reset">Reset poll</button></div></main><script>
const $=s=>document.querySelector(s);let poll=JSON.parse(localStorage.getItem('quickPoll')||'null'),voted=localStorage.getItem('quickPollVoted')==='yes';$('#addOption').onclick=()=>{const inputs=$$('.pollOption');if(inputs.length>=6)return alert('Maximum 6 options.');const input=document.createElement('input');input.className='pollOption';input.placeholder='Option '+(inputs.length+1);input.maxLength=80;input.required=true;$('#optionInputs').append(input)};function $$(s){return [...document.querySelectorAll(s)]}function save(){localStorage.setItem('quickPoll',JSON.stringify(poll));render()}$('#create').onsubmit=e=>{e.preventDefault();poll={question:$('#question').value.trim(),options:$$('.pollOption').map(x=>x.value.trim()).filter(Boolean).map((text,i)=>({id:i,text,votes:0}))};voted=false;localStorage.removeItem('quickPollVoted');save();$('#notice').textContent='Poll created.'};function render(){const root=$('#poll');root.innerHTML='';if(!poll){root.textContent='Your poll will appear here after you create it.';return}const h=document.createElement('h2');h.textContent=poll.question;root.append(h);const total=poll.options.reduce((s,o)=>s+o.votes,0);poll.options.forEach(o=>{const wrap=document.createElement('div');wrap.className='option';const head=document.createElement('div');head.className='optHead';const label=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name='vote';radio.value=o.id;radio.disabled=voted;label.append(radio,document.createTextNode(' '+o.text));const count=document.createElement('span');count.textContent=o.votes+' votes';head.append(label,count);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=(total?o.votes/total*100:0)+'%';bar.append(fill);wrap.append(head,bar);root.append(wrap)});const vote=document.createElement('button');vote.textContent=voted?'Vote submitted':'Submit vote';vote.disabled=voted;vote.onclick=()=>{const chosen=$('input[name="vote"]:checked');if(!chosen){$('#notice').textContent='Choose an option first.';return}poll.options.find(o=>o.id===Number(chosen.value)).votes++;voted=true;localStorage.setItem('quickPollVoted','yes');save();$('#notice').textContent='Thanks for voting!';};root.append(vote)}$('#reset').onclick=()=>{if(confirm('Remove the current poll and its votes?')){poll=null;voted=false;localStorage.removeItem('quickPoll');localStorage.removeItem('quickPollVoted');render();$('#notice').textContent='Poll reset.'}};render();
</script></body></html>
