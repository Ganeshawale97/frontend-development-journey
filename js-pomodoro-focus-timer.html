<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Timer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#211b4b,#6548a7);font-family:system-ui;color:white}.app{width:min(92%,480px);text-align:center;background:#ffffff14;border:1px solid #ffffff30;border-radius:25px;padding:28px}.modes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{padding:11px 15px;border:0;border-radius:10px;cursor:pointer;font:inherit}.mode,.secondary{background:#ffffff22;color:white}.active{background:white;color:#39276b}.clock{font-size:clamp(4rem,18vw,7rem);font-weight:800;margin:22px}.primary{background:#ffcf70;color:#32234f;font-weight:bold}.settings{display:flex;justify-content:center;gap:12px;margin-top:24px}.settings label{display:grid;gap:6px}.settings input{width:75px;padding:8px;border-radius:8px;border:0;text-align:center;font:inherit}</style><body><main class="app"><h1>🎯 Focus Room</h1><p>Work in focused sprints. Take breaks on purpose.</p><div class="modes"><button class="mode active" data-mode="focus">Focus</button><button class="mode" data-mode="short">Short break</button><button class="mode" data-mode="long">Long break</button></div><div class="clock" id="clock">25:00</div><p id="status">Ready when you are.</p><button class="primary" id="toggle">Start</button> <button class="secondary" id="reset">Reset</button><div class="settings"><label>Focus min<input id="focus" type="number" min="1" max="120" value="25"></label><label>Short min<input id="short" type="number" min="1" max="60" value="5"></label><label>Long min<input id="long" type="number" min="1" max="90" value="15"></label></div><p>Sessions completed: <b id="sessions">0</b></p></main><script>const $=x=>document.getElementById(x);let mode='focus',left=1500,timer=null,sessions=+(localStorage.getItem('focusSessions')||0);$('sessions').textContent=sessions;function dur(){return Math.max(1,+$(mode).value||1)*60}function draw(){$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}function stop(){clearInterval(timer);timer=null;$('toggle').textContent='Start'}function select(m){stop();mode=m;left=dur();document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('status').textContent=m==='focus'?'Focus time selected.':'Break selected.';draw()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>select(b.dataset.mode));$('toggle').onclick=()=>{if(timer){stop();$('status').textContent='Paused.';return}$('toggle').textContent='Pause';timer=setInterval(()=>{left--;draw();if(left<=0){stop();if(mode==='focus'){sessions++;localStorage.setItem('focusSessions',sessions);$('sessions').textContent=sessions}$('status').textContent='Session complete. Take a breath!';if('Notification'in window&&Notification.permission==='granted')new Notification('Timer complete')}},1000)};$('reset').onclick=()=>select(mode);['focus','short','long'].forEach(id=>$(id).onchange=()=>{if(!timer){left=dur();draw()}});draw();</script></body></html>
