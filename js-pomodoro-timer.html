<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro Timer</title><style>body{font-family:Arial,sans-serif;background:#fff4ef;color:#4b2621;display:grid;place-items:center;min-height:90vh;margin:0;padding:20px}.timer{text-align:center;background:white;padding:30px;border-radius:18px;max-width:430px;width:100%}#clock{font-size:4rem;font-weight:bold;margin:22px}button{padding:11px 16px;margin:4px;border:0;border-radius:8px;background:#c44735;color:white;cursor:pointer}.secondary{background:#f1e3df;color:#632c24}</style></head><body><main class="timer"><h1>Pomodoro Timer</h1><p>Practise timers with setInterval and clearInterval. The session is 25 minutes.</p><div id="clock">25:00</div><button id="start">Start</button><button id="pause" class="secondary">Pause</button><button id="reset" class="secondary">Reset</button><p id="status" aria-live="polite">Ready to focus.</p></main><script>const clock=document.querySelector('#clock');const status=document.querySelector('#status');const duration=25*60;let remaining=duration;let timer=null;function render(){clock.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');}document.querySelector('#start').addEventListener('click',()=>{if(timer!==null||remaining===0)return;status.textContent='Focus session in progress.';timer=setInterval(()=>{remaining--;render();if(remaining<=0){clearInterval(timer);timer=null;status.textContent='Session complete. Take a short break!';}},1000);});document.querySelector('#pause').addEventListener('click',()=>{if(timer!==null){clearInterval(timer);timer=null;status.textContent='Timer paused.';}});document.querySelector('#reset').addEventListener('click',()=>{clearInterval(timer);timer=null;remaining=duration;render();status.textContent='Timer reset.';});render();</script></body></html>
