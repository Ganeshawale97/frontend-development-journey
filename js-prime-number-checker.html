<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Prime Number Checker</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#ecfeff;color:#164e63;font-family:system-ui,sans-serif}.app{width:min(100%,460px);padding:26px;background:white;border-radius:16px;box-shadow:0 12px 35px #164e630f}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #a5f3fc;border-radius:8px;font:inherit}button{margin-top:14px;padding:11px 16px;background:#0e7490;color:white;border:0;border-radius:8px;cursor:pointer}.result{margin-top:18px;padding:14px;background:#cffafe;border-radius:9px;min-height:50px}
</style></head><body><main class="app"><h1>Prime Number Checker</h1><p>Check whether an integer from 0 to 1,000,000 is prime.</p><form id="form"><label for="number">Whole number</label><input id="number" type="number" min="0" max="1000000" step="1" required value="17"><button>Check number</button></form><div id="result" class="result" aria-live="polite"></div>
<script>
function isPrime(n){if(n<2)return false;if(n===2)return true;if(n%2===0)return false;for(let i=3;i<=Math.sqrt(n);i+=2){if(n%i===0)return false;}return true;}
document.querySelector("#form").addEventListener("submit",event=>{event.preventDefault();const raw=document.querySelector("#number").value,n=Number(raw),out=document.querySelector("#result");if(raw===""||!Number.isInteger(n)||n<0||n>1000000){out.textContent="Enter a whole number from 0 to 1,000,000.";return;}out.textContent=n+(isPrime(n)?" is a prime number.":" is not a prime number.");});
document.querySelector("#form").requestSubmit();
</script></main></body></html>
