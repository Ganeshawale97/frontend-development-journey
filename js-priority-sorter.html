<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create a task list and drag items into priority order. Keyboard-friendly move-up and move-down controls are included."><title>Drag and Drop Priority Sorter</title><style>:root{font-family:system-ui,Arial;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:32px 16px}.wrap{max-width:850px;margin:auto}h1{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:8px}p{color:#64748b;line-height:1.6}.panel,.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 8px 28px #1e293b0b}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:white;font-weight:650}button.secondary,.remove{background:#e8eef8;color:#26344d}input,select{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px;min-width:0;width:100%}label{display:grid;gap:7px;color:#475569;font-size:.9rem}.grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:10px 0}ul{list-style:none;padding:0}li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{background:#eef4ff;padding:12px 16px;border-radius:12px;flex:1;min-width:100px}.stat b{display:block;font-size:1.5rem}.pill{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 10px;border-radius:20px;font-size:.8rem}.empty{color:#64748b;text-align:center;padding:24px}.compare{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:16/9;background:#dbeafe}.compare img{position:absolute;width:100%;height:100%;object-fit:cover}.compare .after{clip-path:inset(0 50% 0 0)}.line{position:absolute;top:0;bottom:0;width:3px;background:white;left:50%;pointer-events:none}.compare input{position:absolute;bottom:12px;left:5%;width:90%}.card.selected{outline:3px solid #2563eb}.price{font-size:2rem;font-weight:800}.features{line-height:2;color:#475569}@media(max-width:560px){body{padding:20px 12px}.row{grid-template-columns:1fr 1fr}.row input:first-child{grid-column:1/-1}}</style></head><body><main class="wrap"><span class="pill">Frontend Practice Project</span><h1>Drag and Drop Priority Sorter</h1><p>Create a task list and drag items into priority order. Keyboard-friendly move-up and move-down controls are included.</p><section class="panel"><form id="form" class="grid"><label>New task<input id="task" required placeholder="What matters most?"></label><button style="align-self:end">Add task</button></form><p><b id="count">0</b> tasks · Drag to reorder or use arrows.</p><ul id="list"></ul></section></main><script>const $=s=>document.querySelector(s),list=$('#list');let tasks=[];function draw(){list.innerHTML='';tasks.forEach((t,i)=>{let li=document.createElement('li');li.draggable=true;li.dataset.i=i;li.innerHTML='<span>⠿ '+t+'</span><span><button data-m="-1">↑</button> <button data-m="1">↓</button> <button data-x="1" class="secondary">×</button></span>';list.append(li)});$('#count').textContent=tasks.length}function move(i,d){let j=i+d;if(j>=0&&j<tasks.length){[tasks[i],tasks[j]]=[tasks[j],tasks[i]];draw()}}$('#form').onsubmit=e=>{e.preventDefault();tasks.push($('#task').value.trim());$('#task').value='';draw()};list.onclick=e=>{let li=e.target.closest('li');if(!li)return;let i=+li.dataset.i;if(e.target.dataset.m)move(i,+e.target.dataset.m);if(e.target.dataset.x){tasks.splice(i,1);draw()}};let from=null;list.ondragstart=e=>from=+e.target.closest('li').dataset.i;list.ondragover=e=>e.preventDefault();list.ondrop=e=>{e.preventDefault();let to=+e.target.closest('li')?.dataset.i;if(Number.isInteger(to)&&from!==null){let v=tasks.splice(from,1)[0];tasks.splice(to,0,v);draw()}from=null};draw();</script></body></html>
