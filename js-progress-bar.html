<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Interactive Progress Bar</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#fff7ed;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.card{background:white;padding:28px;border-radius:16px;width:100%;max-width:480px;box-shadow:0 10px 30px #9a341218}progress{width:100%;height:22px;accent-color:#ea580c}input{width:100%;margin:18px 0}#value{font-size:1.6rem;font-weight:bold;color:#c2410c}button{padding:10px 14px;margin-right:8px;margin-top:8px;border:0;border-radius:8px;background:#c2410c;color:white;cursor:pointer}</style></head><body><main class="card"><h1>Progress Bar</h1><p>Move the slider or use the buttons to update progress.</p><progress id="bar" value="35" max="100"></progress><p><span id="value">35%</span> complete</p><label for="range">Progress: <input id="range" type="range" min="0" max="100" value="35"></label><button id="minus" type="button">−10%</button><button id="plus" type="button">+10%</button><button id="reset" type="button">Reset</button><p><small>Practice: range inputs, values, and reusable functions.</small></p></main><script>const range=document.querySelector("#range"),bar=document.querySelector("#bar"),value=document.querySelector("#value");function setProgress(next){const amount=Math.max(0,Math.min(100,next));range.value=amount;bar.value=amount;value.textContent=amount+"%";}range.addEventListener("input",()=>setProgress(Number(range.value)));document.querySelector("#minus").addEventListener("click",()=>setProgress(Number(range.value)-10));document.querySelector("#plus").addEventListener("click",()=>setProgress(Number(range.value)+10));document.querySelector("#reset").addEventListener("click",()=>setProgress(0));setProgress(35);</script></body></html>
