<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Quiz</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#111827;color:#f9fafb;font:16px system-ui}.card{width:min(600px,100%);padding:28px;background:#1f2937;border:1px solid #374151;border-radius:20px}h1{margin-top:0}.top{display:flex;justify-content:space-between;color:#cbd5e1}.bar{height:7px;background:#374151;border-radius:8px;overflow:hidden;margin:16px 0 24px}.bar span{display:block;height:100%;width:0;background:#a78bfa;transition:width .2s}#answers{display:grid;gap:10px}.answer,button{padding:13px 15px;border:1px solid #4b5563;border-radius:10px;background:#273449;color:white;text-align:left;cursor:pointer;font:inherit}.answer:hover:not(:disabled){border-color:#a78bfa}.answer:disabled{cursor:default}.correct{background:#14532d!important;border-color:#22c55e!important}.wrong{background:#7f1d1d!important;border-color:#f87171!important}.primary{background:#7c3aed;border:0;text-align:center;margin-top:18px;width:100%}.muted{color:#cbd5e1}</style></head><body><main class="card"><h1>Quick Quiz ⚡</h1><div class="top"><span id="count">Question 1 of 5</span><span id="score">Score: 0</span></div><div class="bar"><span id="progress"></span></div><h2 id="question"></h2><div id="answers"></div><p class="muted" id="feedback" aria-live="polite"></p><button class="primary" id="next" hidden>Next question</button></main>
<script>
const qs=[{q:'Which language structures the content of a webpage?',a:['CSS','HTML','JavaScript','SQL'],c:1},{q:'Which CSS property changes text colour?',a:['font-style','background','color','text-size'],c:2},{q:'Which keyword declares a block-scoped variable that can be reassigned?',a:['const','let','static','define'],c:1},{q:'Which method converts JSON text into a JavaScript value?',a:['JSON.parse()','JSON.stringify()','JSON.read()','parse.JSON()'],c:0},{q:'Which event fires when a form is submitted?',a:['hover','changeColor','submit','loadForm'],c:2}];
let index=0,score=0,locked=false;const question=document.querySelector('#question'),answers=document.querySelector('#answers'),feedback=document.querySelector('#feedback'),next=document.querySelector('#next');
function show(){locked=false;const item=qs[index];document.querySelector('#count').textContent='Question '+(index+1)+' of '+qs.length;document.querySelector('#score').textContent='Score: '+score;document.querySelector('#progress').style.width=(index/qs.length*100)+'%';question.textContent=item.q;answers.replaceChildren();feedback.textContent='';next.hidden=true;item.a.forEach((label,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=()=>choose(i,b);answers.append(b)})}
function choose(i,button){if(locked)return;locked=true;const item=qs[index];[...answers.children].forEach((b,j)=>{b.disabled=true;if(j===item.c)b.classList.add('correct')});if(i===item.c){score++;feedback.textContent='Correct! Nice work.'}else{button.classList.add('wrong');feedback.textContent='Not quite — the correct answer is '+item.a[item.c]+'.'}document.querySelector('#score').textContent='Score: '+score;document.querySelector('#progress').style.width=((index+1)/qs.length*100)+'%';next.textContent=index===qs.length-1?'See results':'Next question';next.hidden=false}
next.onclick=()=>{if(index<qs.length-1){index++;show()}else{question.textContent='You scored '+score+' out of '+qs.length+'!';answers.replaceChildren();feedback.textContent=score===qs.length?'Perfect score! 🎉':'Keep practising — you are improving.';next.textContent='Try again';next.onclick=()=>{index=0;score=0;next.onclick=advance;show()};document.querySelector('#progress').style.width='100%'}};function advance(){if(index<qs.length-1){index++;show()}else{question.textContent='You scored '+score+' out of '+qs.length+'!';answers.replaceChildren();feedback.textContent='Quiz complete.';next.textContent='Try again';next.onclick=()=>{index=0;score=0;next.onclick=advance;show()}}}show();
</script></body></html>
