<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gradient Generator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f8fafc;color:#0f172a;font:16px system-ui}.app{width:min(650px,100%);padding:26px;background:white;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 14px 40px #0f172a0d}h1{margin-top:0}.preview{height:220px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);margin:18px 0}.controls{display:flex;gap:10px;flex-wrap:wrap}button{padding:11px 15px;border:0;border-radius:9px;background:#4f46e5;color:white;font:inherit;cursor:pointer}button.secondary{background:#e0e7ff;color:#3730a3}code{display:block;padding:13px;background:#f1f5f9;border-radius:9px;overflow-wrap:anywhere;margin-top:12px}.angle{display:flex;gap:10px;align-items:center;margin-top:12px}input{flex:1;min-width:0}</style></head><body><main class="app"><h1>CSS Gradient Generator 🎨</h1><p>Generate a random gradient or adjust its angle, then copy the CSS.</p><div id="preview" class="preview"></div><label for="angle">Angle: <span id="angleValue">135</span>°</label><div class="angle"><input id="angle" type="range" min="0" max="360" value="135"><button id="random">Randomize</button></div><div class="controls"><button id="copy">Copy CSS</button><button id="reset" class="secondary">Reset</button></div><code id="css" aria-live="polite"></code></main><script>const preview=document.querySelector('#preview'),angle=document.querySelector('#angle'),angleValue=document.querySelector('#angleValue'),css=document.querySelector('#css');let c1='#8b5cf6',c2='#ec4899';function render(){const value='linear-gradient('+angle.value+'deg, '+c1+', '+c2+')';preview.style.background=value;angleValue.textContent=angle.value;css.textContent='background: '+value+';'}function hex(){return '#'+Math.floor(Math.random()*16777216).toString(16).padStart(6,'0')}angle.oninput=render;document.querySelector('#random').onclick=()=>{c1=hex();c2=hex();render()};document.querySelector('#reset').onclick=()=>{c1='#8b5cf6';c2='#ec4899';angle.value=135;render()};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(css.textContent);document.querySelector('#copy').textContent='Copied!';setTimeout(()=>document.querySelector('#copy').textContent='Copy CSS',1200)}catch{document.querySelector('#copy').textContent='Select CSS to copy'}};render();</script></body></html>
