<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>
</head>
<body>
    <h1>Random Number Generator</h1>
    <p>Generate a random whole number between 1 and 100.</p>
    <button id="generate">Generate Number</button>
    <p id="number" aria-live="polite">Click the button to begin.</p>
    <script>
        document.getElementById("generate").addEventListener("click", function () {
            const randomNumber = Math.floor(Math.random() * 100) + 1;
            document.getElementById("number").textContent = "Your number: " + randomNumber;
        });
    </script>
</body>
</html>
