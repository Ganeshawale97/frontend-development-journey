<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Random Quote Generator</title><style>*{box-sizing:border-box}body{font-family:Georgia,serif;background:#f5f3ff;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;color:#312e81}.card{background:white;padding:30px;border-radius:18px;max-width:560px;width:100%;box-shadow:0 12px 35px #4338ca18}blockquote{font-size:1.4rem;line-height:1.6;margin:24px 0}button{font: bold 1rem Arial;padding:12px 16px;border:0;border-radius:9px;background:#4f46e5;color:white;cursor:pointer}#author{color:#6b7280}</style></head><body><main class="card"><h1>Daily Inspiration</h1><blockquote id="quote" aria-live="polite">Small steps every day lead to big changes.</blockquote><p id="author">— Practice quote</p><button id="newQuote">Show another quote</button><p><small>Practice: arrays, random numbers, and DOM updates.</small></p></main><script>const quotes=[{text:"Great things are done by a series of small things brought together.",author:"Vincent van Gogh"},{text:"It always seems impossible until it's done.",author:"Nelson Mandela"},{text:"Learning never exhausts the mind.",author:"Leonardo da Vinci"},{text:"The secret of getting ahead is getting started.",author:"Mark Twain"},{text:"Success is the sum of small efforts repeated day in and day out.",author:"Robert Collier"}];let previous=-1;document.querySelector("#newQuote").addEventListener("click",()=>{let index;do{index=Math.floor(Math.random()*quotes.length)}while(quotes.length>1&&index===previous);previous=index;document.querySelector("#quote").textContent=quotes[index].text;document.querySelector("#author").textContent="— "+quotes[index].author;});</script></body></html>
