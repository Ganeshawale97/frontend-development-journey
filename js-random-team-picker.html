<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Random Team Picker</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f0fdf4;color:#14532d;font-family:system-ui,sans-serif}.app{max-width:650px;margin:auto;padding:24px;background:white;border-radius:16px;box-shadow:0 12px 35px #14532d10}textarea,input{width:100%;padding:12px;border:1px solid #bbf7d0;border-radius:8px;font:inherit}textarea{min-height:150px;resize:vertical}label{display:block;margin:14px 0 6px}button{margin-top:14px;padding:11px 16px;background:#15803d;color:white;border:0;border-radius:8px;cursor:pointer}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.team{padding:14px;background:#dcfce7;border-radius:10px;overflow-wrap:anywhere}.team h2{margin-top:0}@media(max-width:520px){.teams{grid-template-columns:1fr}}
</style></head><body><main class="app"><h1>Random Team Picker</h1><p>Enter one name per line and choose how many teams to create.</p><label for="names">Names</label><textarea id="names" placeholder="Aarav&#10;Diya&#10;Kabir&#10;Meera"></textarea><label for="teamCount">Number of teams</label><input id="teamCount" type="number" min="1" max="50" value="2"><button id="pick">Create teams</button><div id="teams" class="teams" aria-live="polite"></div><p id="message"></p>
<script>
document.querySelector("#pick").addEventListener("click",()=>{const names=document.querySelector("#names").value.split(/\n/).map(n=>n.trim()).filter(Boolean),count=Number(document.querySelector("#teamCount").value),out=document.querySelector("#teams"),message=document.querySelector("#message");out.replaceChildren();message.textContent="";if(!names.length){message.textContent="Enter at least one name.";return;}if(!Number.isInteger(count)||count<1||count>50){message.textContent="Choose between 1 and 50 teams.";return;}for(let i=names.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]];}const teams=Array.from({length:Math.min(count,names.length)},()=>[]);names.forEach((name,i)=>teams[i%teams.length].push(name));teams.forEach((members,i)=>{const card=document.createElement("section");card.className="team";const title=document.createElement("h2");title.textContent="Team "+(i+1);const list=document.createElement("ul");members.forEach(name=>{const li=document.createElement("li");li.textContent=name;list.append(li);});card.append(title,list);out.append(card);});message.textContent="Assigned "+names.length+" participant(s) to "+teams.length+" team(s).";});
</script></main></body></html>
