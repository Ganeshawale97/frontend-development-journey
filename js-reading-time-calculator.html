<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reading Time Calculator</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0fdf4;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.card{background:white;padding:26px;border-radius:16px;max-width:620px;width:100%;box-shadow:0 10px 30px #16653418}textarea{width:100%;min-height:190px;padding:14px;border:1px solid #bbf7d0;border-radius:10px;font:1rem/1.5 Arial;resize:vertical}#result{padding:14px;background:#dcfce7;border-radius:10px;font-weight:bold}</style></head><body><main class="card"><h1>Reading Time Calculator</h1><p>Paste text to estimate how long it takes to read at 200 words per minute.</p><label for="article">Your text</label><textarea id="article" placeholder="Paste an article or type a few sentences..."></textarea><p id="result" aria-live="polite">0 words · less than a minute</p><small>Practice: string methods, word counting, and Math.ceil().</small></main><script>const article=document.querySelector("#article"),result=document.querySelector("#result");function update(){const trimmed=article.value.trim();const words=trimmed?trimmed.split(/\s+/).length:0;const minutes=Math.ceil(words/200);result.textContent=words+" word"+(words===1?"":"s")+" · "+(minutes===0?"less than a minute":minutes+" minute"+(minutes===1?"":"s"))+" to read";}article.addEventListener("input",update);</script></body></html>
