<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Time Estimator</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center;background:#f5f3ff;color:#292344;font:16px system-ui}.app{width:min(720px,100%);background:white;padding:28px;border-radius:20px;box-shadow:0 16px 40px #392c6814}textarea{width:100%;min-height:260px;resize:vertical;padding:14px;border:1px solid #d8d1ef;border-radius:12px;font:inherit;line-height:1.6}h1{margin-top:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{padding:14px;background:#f5f3ff;border-radius:12px}.num{font-size:1.5rem;font-weight:750;display:block}.muted{color:#706b85}@media(max-width:460px){.stats{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>Reading Time Estimator</h1><p class="muted">Paste or write text to estimate how long it may take to read.</p><textarea id="text" placeholder="Start typing or paste your text here…"></textarea><section class="stats"><div class="stat"><span class="num" id="words">0</span><span class="muted">Words</span></div><div class="stat"><span class="num" id="chars">0</span><span class="muted">Characters</span></div><div class="stat"><span class="num" id="time">0 min</span><span class="muted">Reading time</span></div></section><p class="muted">Estimate uses an average reading speed of 200 words per minute.</p></main><script>const input=document.querySelector('#text');input.addEventListener('input',()=>{const value=input.value.trim(),words=value?value.split(/\s+/).length:0;document.querySelector('#words').textContent=words.toLocaleString();document.querySelector('#chars').textContent=input.value.length.toLocaleString();const mins=words/200;document.querySelector('#time').textContent=words===0?'0 min':mins<1?Math.max(1,Math.ceil(mins*60))+' sec':Math.ceil(mins)+' min'});</script></body></html>
