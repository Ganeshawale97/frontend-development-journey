<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>README Badge Builder</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d30;--line:#2a3852;--text:#eef4ff;--muted:#9eacc3;--accent:#8eafff;--mint:#68dfbf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1a2b49,var(--bg) 50%);color:var(--text);font:16px/1.55 system-ui,sans-serif}.wrap{max-width:900px;width:92%;margin:38px auto}.eyebrow{color:var(--mint);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.2rem);margin:.3rem 0}.muted{color:var(--muted)}.panel{background:#121b2c;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:650;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#091321;color:white;font:inherit}.field{margin-bottom:12px}.preview{background:#0a1322;border:1px dashed #3a4c6a;border-radius:12px;padding:28px;min-height:120px;display:grid;place-items:center}.preview img{max-width:100%;height:auto}.code{width:100%;min-height:90px;background:#091220;border:1px solid var(--line);border-radius:10px;padding:12px;color:#cfe0ff;font:13px/1.6 ui-monospace,monospace}.btn{background:#29416d;color:white;border:1px solid #486396;border-radius:9px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer}.status{color:var(--muted);min-height:22px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{margin:24px auto}}
</style></head><body><main class="wrap"><div class="eyebrow">GitHub · Markdown tools</div><h1>README Badge Builder</h1><p class="muted">Create a Shields.io badge for your README. Customize the label, message, color and style, then copy the Markdown snippet.</p>
<section class="panel"><div class="grid"><div><div class="field"><label for="label">Badge label</label><input id="label" value="build"></div><div class="field"><label for="message">Badge message</label><input id="message" value="passing"></div><div class="field"><label for="color">Badge color</label><select id="color"><option value="brightgreen">Bright green</option><option value="green">Green</option><option value="blue" selected>Blue</option><option value="informational">Informational</option><option value="yellow">Yellow</option><option value="orange">Orange</option><option value="red">Red</option><option value="critical">Critical</option><option value="lightgrey">Light grey</option><option value="success">Success</option></select></div><div class="field"><label for="style">Badge style</label><select id="style"><option value="flat">Flat</option><option value="flat-square">Flat square</option><option value="for-the-badge">For the badge</option><option value="plastic">Plastic</option><option value="social">Social</option></select></div><div class="field"><label for="logo">Optional logo name</label><input id="logo" placeholder="e.g. github, html5, javascript"></div><div class="field"><label for="target">Optional link URL</label><input id="target" type="url" placeholder="https://github.com/username/repo"></div></div><div><h2>Live badge preview</h2><div class="preview"><img id="badge" alt="Generated README badge preview"></div><p class="muted">Preview is loaded from Shields.io. The Markdown can be used without this page.</p></div></div></section>
<section class="panel"><h2>Markdown snippet</h2><textarea id="markdown" class="code" readonly aria-label="Markdown badge snippet"></textarea><button id="copy" class="btn">Copy Markdown</button><p id="status" class="status" role="status"></p></section></main>
<script>
const fields=["label","message","color","style","logo","target"].map(id=>document.getElementById(id)),badge=document.getElementById("badge"),markdown=document.getElementById("markdown"),status=document.getElementById("status");
function enc(s){return encodeURIComponent(s.trim()).replace(/%20/g,"_")}
function update(){const label=fields[0].value||"label",message=fields[1].value||"value",color=fields[2].value,style=fields[3].value,logo=fields[4].value.trim(),target=fields[5].value.trim();let url="https://img.shields.io/badge/"+enc(label)+"-"+enc(message)+"-"+enc(color)+"?style="+encodeURIComponent(style);if(logo)url+="&logo="+encodeURIComponent(logo)+"&logoColor=white";badge.src=url;badge.alt=label+": "+message;const image="![ "+label+" | "+message+" ]("+url+")";markdown.value=target?"["+image+"]("+target+")":image;status.textContent="Badge URL updated."}
fields.forEach(el=>el.addEventListener("input",update));document.getElementById("copy").addEventListener("click",()=>navigator.clipboard.writeText(markdown.value).then(()=>status.textContent="Markdown copied to clipboard.").catch(()=>status.textContent="Clipboard permission is unavailable."));badge.addEventListener("error",()=>status.textContent="Badge preview could not load. Check your connection or logo name.");update();
</script></body></html>
