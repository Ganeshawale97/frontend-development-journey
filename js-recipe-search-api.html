<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Search</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7ed;color:#422b1b;font:16px system-ui;padding:24px}.wrap{max-width:1000px;margin:auto}form{display:flex;gap:8px;margin:18px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #e8d3bf}input{flex:1;min-width:0}button{background:#bd5723;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 10px 28px #70401812}.card img{width:100%;height:170px;object-fit:cover}.body{padding:16px}.body a{color:#b34b19}.muted{color:#896f5d}</style><body><main class="wrap"><h1>🍲 Recipe Search</h1><p class="muted">Search meal ideas by ingredient or recipe name. Powered by TheMealDB public API.</p><form id="form"><input id="query" value="chicken" placeholder="Try pasta, chicken, curry…" required><button>Search recipes</button></form><p id="status" role="status"></p><div id="results" class="grid"></div></main><script>const $=x=>document.getElementById(x);$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Searching recipes…';$('results').innerHTML='';try{let r=await fetch('https://www.themealdb.com/api/json/v1/1/search.php?s='+encodeURIComponent($('query').value.trim()));if(!r.ok)throw Error('Recipe service unavailable.');let d=await r.json(),meals=d.meals||[];if(!meals.length){$('status').textContent='No recipes found. Try another search.';return}$('status').textContent=meals.length+' recipe results shown.';meals.forEach(m=>{let card=document.createElement('article');card.className='card';let img=document.createElement('img');img.src=m.strMealThumb;img.alt=m.strMeal;img.loading='lazy';let body=document.createElement('div');body.className='body';let h=document.createElement('h2');h.textContent=m.strMeal;let p=document.createElement('p');p.className='muted';p.textContent=(m.strCategory||'Meal')+' · '+(m.strArea||'Various cuisine');let a=document.createElement('a');a.href=m.strSource||m.strYoutube||'#';a.target='_blank';a.rel='noopener';a.textContent='View recipe ↗';body.append(h,p,a);card.append(img,body);$('results').append(card)})}catch(err){$('status').textContent=err.message}};$('form').requestSubmit();</script></body></html>
