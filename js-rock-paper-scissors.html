<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rock Paper Scissors</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f8fafc;color:#172033;font-family:system-ui,sans-serif}.game{width:min(100%,520px);padding:26px;background:white;border:1px solid #e2e8f0;border-radius:18px;text-align:center}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choices button{font-size:1rem;padding:14px 16px;background:#4f46e5;color:white;border:0;border-radius:10px;cursor:pointer}.result{min-height:80px;margin:20px 0;padding:16px;background:#eef2ff;border-radius:12px}strong{font-size:1.1rem}
</style></head><body><main class="game"><h1>Rock, Paper, Scissors</h1><p>Choose your move to play against the computer.</p><div class="choices"><button data-move="rock">✊ Rock</button><button data-move="paper">✋ Paper</button><button data-move="scissors">✌️ Scissors</button></div><section class="result" aria-live="polite"><p id="round">Your move will appear here.</p><strong id="winner"></strong></section><p>Wins: <span id="wins">0</span> · Losses: <span id="losses">0</span> · Draws: <span id="draws">0</span></p><button id="reset">Reset score</button>
<script>
let wins=0,losses=0,draws=0;const moves=["rock","paper","scissors"];function play(player){const computer=moves[Math.floor(Math.random()*moves.length)];let result;if(player===computer){result="draws";}else if((player==="rock"&&computer==="scissors")||(player==="paper"&&computer==="rock")||(player==="scissors"&&computer==="paper")){result="wins";}else{result="losses";}if(result==="wins")wins++;if(result==="losses")losses++;if(result==="draws")draws++;document.querySelector("#round").textContent="You chose "+player+" · Computer chose "+computer;document.querySelector("#winner").textContent=result==="draws"?"It's a draw!":result==="wins"?"You win this round!":"Computer wins this round.";document.querySelector("#wins").textContent=wins;document.querySelector("#losses").textContent=losses;document.querySelector("#draws").textContent=draws;}
document.querySelectorAll("[data-move]").forEach(button=>button.addEventListener("click",()=>play(button.dataset.move)));document.querySelector("#reset").addEventListener("click",()=>{wins=losses=draws=0;["wins","losses","draws"].forEach(id=>document.querySelector("#"+id).textContent="0");document.querySelector("#round").textContent="Score reset. Choose your move!";document.querySelector("#winner").textContent="";});
</script></main></body></html>
