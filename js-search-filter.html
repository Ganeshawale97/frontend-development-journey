<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Search Filter</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font:16px system-ui;padding:30px}.wrap{max-width:780px;margin:auto}h1{margin-bottom:6px}p{color:#64748b}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;margin:16px 0}.list{display:grid;gap:10px}.item{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:15px;display:flex;justify-content:space-between;gap:12px}.tag{font-size:.8rem;padding:4px 9px;border-radius:99px;background:#e0e7ff;color:#3730a3;white-space:nowrap}#status{font-size:.9rem}</style></head><body><main class="wrap"><h1>Find a topic 🔎</h1><p>Search by name or category to filter the list instantly.</p><input id="search" type="search" placeholder="Try “JavaScript” or “design”" aria-label="Search topics"><p id="status" aria-live="polite"></p><section id="list" class="list"></section></main><script>
const topics=[['HTML Basics','Frontend'],['CSS Flexbox','CSS'],['CSS Grid','CSS'],['JavaScript Events','JavaScript'],['DOM Manipulation','JavaScript'],['Responsive Design','Design'],['Accessibility','Design'],['Git and GitHub','Tools'],['Fetch API','JavaScript'],['Semantic HTML','Frontend'],['CSS Animations','CSS'],['Web Performance','Tools']];const input=document.querySelector('#search'),list=document.querySelector('#list'),status=document.querySelector('#status');function render(){const q=input.value.trim().toLowerCase(),found=topics.filter(([name,category])=>(name+' '+category).toLowerCase().includes(q));list.replaceChildren();status.textContent=found.length+' result'+(found.length===1?'':'s');if(!found.length){const p=document.createElement('p');p.textContent='No topics found. Try a different search.';list.append(p)}found.forEach(([name,category])=>{const row=document.createElement('article');row.className='item';const title=document.createElement('strong');title.textContent=name;const tag=document.createElement('span');tag.className='tag';tag.textContent=category;row.append(title,tag);list.append(row)})}input.addEventListener('input',render);render();
</script></body></html>
