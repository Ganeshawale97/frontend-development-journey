<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini Shopping Cart</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:24px}.wrap{max-width:760px;margin:auto}h1{margin-top:0}.products,.cart{background:white;padding:20px;border-radius:14px;margin:16px 0;box-shadow:0 6px 22px #0f172a0c}.product{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e2e8f0}.product:last-child{border-bottom:0}button{border:0;background:#2563eb;color:white;padding:9px 13px;border-radius:8px;cursor:pointer}.remove{background:#dc2626}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}.total{font-size:1.25rem;font-weight:bold}@media(max-width:480px){.product{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="wrap"><h1>Mini Shopping Cart</h1><p>Add products and watch your total update.</p><section class="products"><h2>Products</h2><div id="products"></div></section><section class="cart"><h2>Your cart</h2><div id="cart"><p>Your cart is empty.</p></div><p class="total">Total: ₹<span id="total">0.00</span></p><button id="clear" class="remove">Clear cart</button></section><small>Practice: arrays, objects, reduce(), and rendering DOM elements.</small></main>
<script>
const products = [{id:1,name:"Notebook",price:60},{id:2,name:"Pen pack",price:40},{id:3,name:"Water bottle",price:180}];
const cart = [];
const productList = document.querySelector("#products"), cartList = document.querySelector("#cart");
const money = amount => amount.toFixed(2);
products.forEach(product => {
  const row = document.createElement("div"); row.className = "product";
  row.innerHTML = "<span><strong>" + product.name + "</strong> — ₹" + money(product.price) + "</span>";
  const button = document.createElement("button"); button.textContent = "Add to cart";
  button.addEventListener("click", () => { const found = cart.find(item => item.id === product.id); found ? found.quantity++ : cart.push({...product, quantity:1}); renderCart(); });
  row.append(button); productList.append(row);
});
function renderCart() {
  cartList.replaceChildren();
  if (!cart.length) cartList.innerHTML = "<p>Your cart is empty.</p>";
  cart.forEach(item => {
    const row = document.createElement("div"); row.className = "item";
    const label = document.createElement("span"); label.textContent = item.name + " × " + item.quantity + " — ₹" + money(item.price * item.quantity);
    const remove = document.createElement("button"); remove.className = "remove"; remove.textContent = "Remove";
    remove.addEventListener("click", () => { const index = cart.findIndex(product => product.id === item.id); cart.splice(index, 1); renderCart(); });
    row.append(label, remove); cartList.append(row);
  });
  document.querySelector("#total").textContent = money(cart.reduce((sum, item) => sum + item.price * item.quantity, 0));
}
document.querySelector("#clear").addEventListener("click", () => { cart.length = 0; renderCart(); });
renderCart();
</script></body></html>
