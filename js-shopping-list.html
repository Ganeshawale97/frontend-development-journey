<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping List</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center;background:#f0fdf4;color:#14532d;font:16px system-ui}.app{width:min(600px,100%);padding:26px;background:white;border-radius:20px;box-shadow:0 15px 40px #14532d12}h1{margin-top:0}form{display:flex;gap:8px}input{min-width:0;flex:1;padding:12px;border:1px solid #bbf7d0;border-radius:9px;font:inherit}button{padding:11px 14px;border:0;border-radius:9px;background:#15803d;color:white;font:inherit;cursor:pointer}.list{padding:0;list-style:none}.list li{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #dcfce7}.list li span{flex:1;overflow-wrap:anywhere}.done span{text-decoration:line-through;color:#86a98f}.delete{background:#fee2e2;color:#991b1b;padding:7px 10px}.muted{color:#64748b}.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}</style></head><body><main class="app"><h1>🛒 Shopping List</h1><p class="muted">Add items, tick them off, and come back later — your list is saved in this browser.</p><form id="form"><input id="item" maxlength="100" placeholder="Add an item…" required><button>Add</button></form><div class="tools"><p id="count" class="muted">0 items left</p><button id="clear" type="button">Clear completed</button></div><ul id="list" class="list"></ul></main><script>const form=document.querySelector('#form'),input=document.querySelector('#item'),list=document.querySelector('#list'),count=document.querySelector('#count');let items=JSON.parse(localStorage.getItem('shoppingListDemo')||'[]');function save(){localStorage.setItem('shoppingListDemo',JSON.stringify(items));render()}function render(){list.replaceChildren();items.forEach(item=>{const li=document.createElement('li');if(item.done)li.className='done';const check=document.createElement('input');check.type='checkbox';check.checked=item.done;check.setAttribute('aria-label','Mark '+item.name+' complete');check.onchange=()=>{item.done=check.checked;save()};const name=document.createElement('span');name.textContent=item.name;const del=document.createElement('button');del.className='delete';del.textContent='Remove';del.onclick=()=>{items=items.filter(x=>x.id!==item.id);save()};li.append(check,name,del);list.append(li)});count.textContent=items.filter(x=>!x.done).length+' items left · '+items.length+' total';if(!items.length){const li=document.createElement('li');li.className='muted';li.textContent='Your list is empty.';list.append(li)}}form.onsubmit=e=>{e.preventDefault();items.push({id:Date.now()+Math.random(),name:input.value.trim(),done:false});save();form.reset();input.focus()};document.querySelector('#clear').onclick=()=>{items=items.filter(x=>!x.done);save()};render();</script></body></html>
