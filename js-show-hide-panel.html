<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Show and Hide Panel</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;background:#f5f3ff;color:#312e81}.card{max-width:500px;width:100%;background:white;padding:28px;border-radius:16px;box-shadow:0 10px 30px #4c1d9515}button{padding:12px 16px;background:#6d28d9;color:white;border:0;border-radius:8px;cursor:pointer}#panel{margin-top:18px;padding:16px;background:#ede9fe;border-radius:10px;line-height:1.6}</style></head><body><main class="card"><h1>Show / Hide Panel</h1><p>Use the button to reveal or hide extra information.</p><button id="toggle" aria-expanded="false" aria-controls="panel">Show details</button><section id="panel" hidden><h2>What you learned</h2><p>The <code>hidden</code> property controls whether an element is displayed. JavaScript can update both the property and button label.</p></section><p><small>Practice: click events, boolean state, and accessible button attributes.</small></p></main><script>const button=document.querySelector('#toggle'), panel=document.querySelector('#panel');button.addEventListener('click',()=>{const open=panel.hidden;panel.hidden=!open;button.textContent=open?'Hide details':'Show details';button.setAttribute('aria-expanded',String(open));});</script></body></html>
