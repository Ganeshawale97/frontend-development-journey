<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Session Planner</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#242b3b;font:16px system-ui;padding:24px}.wrap{max-width:780px;margin:auto}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #1720330c}form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}input,button{font:inherit;padding:11px;border:1px solid #d8deea;border-radius:9px}button{background:#4d56c9;color:white;border:0;cursor:pointer}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}.task span{flex:1}.task.done span{text-decoration:line-through;color:#8490a4}.task input{width:18px;height:18px}.del{background:#ffebeb;color:#a32d2d;padding:8px}.stats{display:flex;gap:12px}.stats div{flex:1;background:#eef0ff;border-radius:10px;padding:14px}@media(max-width:650px){form{grid-template-columns:1fr 1fr}form input:first-child{grid-column:1/-1}}</style><body><main class="wrap"><h1>📅 Study Session Planner</h1><p>Plan study blocks and track completed tasks.</p><div class="stats"><div>Planned minutes<h2 id="minutes">0</h2></div><div>Completed<h2 id="done">0 / 0</h2></div></div><section class="card"><h2>Add study task</h2><form id="form"><input id="title" placeholder="e.g. Revise DBMS normalization" maxlength="100" required><input id="mins" type="number" min="5" max="600" step="5" value="30" required aria-label="Minutes"><input id="date" type="date" required aria-label="Date"><button>Add</button></form></section><section class="card"><h2>Your plan</h2><p id="empty">No tasks yet.</p><div id="list"></div><button id="clear" style="background:#596579">Clear completed tasks</button></section></main><script>const $=x=>document.getElementById(x);let tasks=JSON.parse(localStorage.getItem('studyPlan')||'[]');$('date').value=new Date().toISOString().slice(0,10);function save(){localStorage.setItem('studyPlan',JSON.stringify(tasks));render()}function render(){let minutes=tasks.filter(t=>!t.done).reduce((s,t)=>s+t.mins,0),done=tasks.filter(t=>t.done).length;$('minutes').textContent=minutes;$('done').textContent=done+' / '+tasks.length;$('empty').hidden=tasks.length>0;$('list').innerHTML='';tasks.forEach(t=>{let row=document.createElement('div');row.className='task'+(t.done?' done':'');let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.onchange=()=>{t.done=cb.checked;save()};let span=document.createElement('span');span.textContent=t.title+' · '+t.mins+' min · '+t.date;let b=document.createElement('button');b.className='del';b.textContent='Delete';b.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save()};row.append(cb,span,b);$('list').append(row)})}$('form').onsubmit=e=>{e.preventDefault();tasks.push({id:Date.now(),title:$('title').value.trim(),mins:+$('mins').value,date:$('date').value,done:false});$('form').reset();$('mins').value=30;$('date').value=new Date().toISOString().slice(0,10);save()};$('clear').onclick=()=>{tasks=tasks.filter(t=>!t.done);save()};render();</script></body></html>
