<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert text to UTF-8 bytes and decode valid hexadecimal byte sequences with TextEncoder and TextDecoder."><title>Text Encoder & Decoder Lab</title><style>
:root{color-scheme:light dark;--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#64748b;--accent:#5b5ce2;--line:#dce2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}h1{line-height:1.15;margin:.35rem 0}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 28px #1720330a}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:white;font-weight:700;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#e8eaff;color:#292b80}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9294ff;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.output{padding:14px;border-radius:12px;background:#111827;color:#e5e7eb;overflow-wrap:anywhere;min-height:54px}small,.hint{color:var(--muted)}.status{min-height:1.5em;color:var(--accent);font-weight:650}.demo{border:1px dashed var(--line);padding:16px;border-radius:12px;margin-top:14px}@media(prefers-color-scheme:dark){:root{--bg:#101827;--panel:#172235;--ink:#eef2ff;--muted:#aab6ca;--line:#344258}button.secondary{background:#30365e;color:#eef2ff}}@media(max-width:520px){.wrap{margin:24px auto}.panel{padding:16px}}
</style></head><body><main class="wrap"><span class="eyebrow">Frontend Development Journey</span><h1>Text Encoder & Decoder Lab</h1><p>Convert text to UTF-8 bytes and decode valid hexadecimal byte sequences with TextEncoder and TextDecoder.</p><section class="panel"><label for="plain">Text to encode</label><textarea id="plain">Hello, frontend developer! 👋</textarea><button id="encode">Encode to UTF-8</button><label for="hex">UTF-8 bytes (hexadecimal)</label><textarea id="hex" spellcheck="false" placeholder="48 65 6c 6c 6f"></textarea><button id="decode">Decode bytes to text</button><p class="status" id="status" role="status" aria-live="polite"></p><label for="decoded">Decoded text</label><div class="output" id="decoded"></div><p class="hint" id="count"></p></section></main><script>const plain=document.querySelector('#plain'),hex=document.querySelector('#hex'),decoded=document.querySelector('#decoded'),status=document.querySelector('#status'),count=document.querySelector('#count');document.querySelector('#encode').onclick=()=>{const bytes=new TextEncoder().encode(plain.value);hex.value=[...bytes].map(b=>b.toString(16).padStart(2,'0')).join(' ');count.textContent=bytes.length+' UTF-8 bytes';status.textContent='Text encoded.'};document.querySelector('#decode').onclick=()=>{try{const parts=hex.value.trim().split(/[\\s,]+/).filter(Boolean);if(!parts.length||parts.some(x=>!/^[0-9a-f]{2}$/i.test(x)))throw Error('Enter byte pairs such as 48 65 6c.');const bytes=Uint8Array.from(parts,x=>parseInt(x,16));decoded.textContent=new TextDecoder('utf-8',{fatal:true}).decode(bytes);status.textContent='Bytes decoded successfully.'}catch(e){decoded.textContent='';status.textContent=e.message==='The encoded data was not valid for encoding utf-8'?'Invalid UTF-8 byte sequence.':e.message}};</script></body></html>
