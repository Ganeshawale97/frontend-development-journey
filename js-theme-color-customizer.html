<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Theme Color Customizer</title><style>:root{--accent:#7c3aed;--surface:#ffffff;--page:#f5f3ff}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--page);min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;transition:background .2s}.card{background:var(--surface);padding:28px;border-radius:18px;width:100%;max-width:480px;box-shadow:0 12px 30px #11182712}h1{color:var(--accent)}label{display:block;margin:18px 0 8px}input[type=color]{width:70px;height:42px;padding:3px;border:1px solid #cbd5e1;border-radius:8px;vertical-align:middle}button{padding:11px 14px;background:var(--accent);color:white;border:0;border-radius:8px;cursor:pointer}#sample{margin-top:20px;padding:16px;border:2px solid var(--accent);border-radius:10px}</style></head><body><main class="card"><h1>Theme Customizer</h1><p>Choose an accent colour and see CSS variables update the interface.</p><label for="color">Accent colour <input id="color" type="color" value="#7c3aed"></label><button id="reset" type="button">Reset theme</button><div id="sample">This sample panel uses your selected accent colour.</div><p><small>Practice: CSS custom properties, input events, and style.setProperty().</small></p></main><script>const picker=document.querySelector("#color");function applyColor(color){document.documentElement.style.setProperty("--accent",color);document.documentElement.style.setProperty("--page",color+"18");}picker.addEventListener("input",()=>applyColor(picker.value));document.querySelector("#reset").addEventListener("click",()=>{picker.value="#7c3aed";applyColor(picker.value);});applyColor(picker.value);</script></body></html>
