<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Toggle</title>
<style>
body{font-family:Arial,sans-serif;padding:40px;transition:background-color .2s,color .2s}
.card{max-width:520px;padding:24px;border:1px solid currentColor}
button{padding:10px 16px;cursor:pointer}
body.dark{background:#202124;color:#f5f5f5}
body.dark .card{background:#303134}
</style>
</head>
<body>
<main class="card">
<h1>Theme Toggle</h1>
<p>Switch between light and dark themes.</p>
<button id="toggle" type="button" aria-pressed="false">Enable Dark Mode</button>
</main>
<script>
const button=document.getElementById("toggle");
button.addEventListener("click",function(){
const isDark=document.body.classList.toggle("dark");
button.textContent=isDark?"Enable Light Mode":"Enable Dark Mode";
button.setAttribute("aria-pressed",String(isDark));
});
</script>
</body>
</html>
