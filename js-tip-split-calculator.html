<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tip and Bill Split Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff7ed;color:#431407;font-family:system-ui,sans-serif}.app{width:min(100%,460px);padding:25px;background:white;border-radius:16px;box-shadow:0 12px 35px #9a34120f}label{display:block;margin:13px 0 6px}input,select{width:100%;padding:11px;border:1px solid #fed7aa;border-radius:8px;font:inherit}button{width:100%;margin-top:18px;padding:12px;background:#c2410c;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}.result{margin-top:18px;background:#ffedd5;border-radius:10px;padding:15px;line-height:1.8}
</style></head><body><main class="app"><h1>Tip & Bill Split</h1><form id="form"><label for="bill">Bill amount (₹)</label><input id="bill" type="number" min="0" step="0.01" value="1000" required><label for="tip">Tip percentage</label><select id="tip"><option value="0">0%</option><option value="5">5%</option><option value="10" selected>10%</option><option value="15">15%</option><option value="20">20%</option></select><label for="people">Number of people</label><input id="people" type="number" min="1" max="100" step="1" value="2" required><button type="submit">Calculate split</button></form><div id="result" class="result" aria-live="polite">Enter your bill details.</div>
<script>
document.querySelector("#form").addEventListener("submit",event=>{event.preventDefault();const bill=Number(document.querySelector("#bill").value),tip=Number(document.querySelector("#tip").value),people=Number(document.querySelector("#people").value),out=document.querySelector("#result");if(!Number.isFinite(bill)||bill<0||!Number.isInteger(people)||people<1||people>100){out.textContent="Please enter a valid bill and number of people.";return;}const tipAmount=bill*tip/100,total=bill+tipAmount;out.textContent="Tip: ₹"+tipAmount.toFixed(2)+" | Total: ₹"+total.toFixed(2)+" | Each person: ₹"+(total/people).toFixed(2);});
</script></main></body></html>
