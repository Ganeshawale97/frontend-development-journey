<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Practice</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f3ff;color:#2e1065;font:16px system-ui}.app{width:min(700px,100%);padding:28px;background:white;border-radius:20px;box-shadow:0 15px 40px #4c1d9512}h1{margin-top:0}.sample{padding:18px;background:#f5f3ff;border-radius:12px;font-size:1.1rem;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{padding:12px;background:#faf5ff;border-radius:10px}.stat strong{display:block;font-size:1.5rem}.stat span{color:#7e22ce;font-size:.85rem}textarea{width:100%;min-height:130px;padding:13px;border:1px solid #d8b4fe;border-radius:10px;font:inherit;resize:vertical}button{margin-top:12px;padding:11px 15px;background:#7c3aed;color:white;border:0;border-radius:9px;font:inherit;cursor:pointer}@media(max-width:460px){.stats{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>Typing Practice ⌨️</h1><p>Type the sentence below as accurately and quickly as you can.</p><div id="sample" class="sample"></div><div class="stats"><div class="stat"><strong id="wpm">0</strong><span>Words/min</span></div><div class="stat"><strong id="accuracy">100%</strong><span>Accuracy</span></div><div class="stat"><strong id="time">0s</strong><span>Time typed</span></div></div><textarea id="input" placeholder="Start typing the sentence here…" aria-label="Typing practice input"></textarea><button id="reset">Try another sentence</button><p id="status" aria-live="polite">Timer starts when you type.</p><script>const sentences=['Practice makes progress, and consistency builds confidence.','Small steps every day can lead to remarkable results.','Accessible websites work better for more people.','JavaScript makes webpages interactive and useful.'];let target='',start=null,interval=null;const sample=document.querySelector('#sample'),input=document.querySelector('#input');function setup(){target=sentences[Math.floor(Math.random()*sentences.length)];sample.textContent=target;input.value='';input.disabled=false;start=null;clearInterval(interval);interval=null;update();document.querySelector('#status').textContent='Timer starts when you type.';input.focus()}function update(){const typed=input.value,elapsed=start?(Date.now()-start)/1000:0,correct=[...typed].filter((c,i)=>c===target[i]).length,accuracy=typed.length?Math.round(correct/typed.length*100):100;document.querySelector('#accuracy').textContent=accuracy+'%';document.querySelector('#time').textContent=Math.floor(elapsed)+'s';document.querySelector('#wpm').textContent=elapsed>0?Math.round((typed.trim()?typed.trim().split(/\s+/).length:0)/(elapsed/60)):0;if(typed===target){clearInterval(interval);input.disabled=true;document.querySelector('#status').textContent='Completed! Great job.'}else document.querySelector('#status').textContent=typed.length>target.length?'You typed beyond the sample. Check for extra characters.':'Keep going — match the sample exactly.'}input.addEventListener('input',()=>{if(start===null){start=Date.now();interval=setInterval(update,500)}update()});document.querySelector('#reset').onclick=setup;setup();</script></main></body></html>
