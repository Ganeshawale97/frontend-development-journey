<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Speed Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f3ff;color:#292449;font:16px system-ui}.app{width:min(100%,760px);background:white;padding:26px;border-radius:20px;box-shadow:0 16px 45px #29244912}.quote{padding:18px;background:#f0efff;border-radius:12px;font-size:1.2rem;line-height:1.8}.quote span.correct{color:#198754}.quote span.wrong{color:#c32d4b;background:#ffe7ed}.quote span.current{border-bottom:3px solid #6654d9}textarea{width:100%;padding:14px;font:inherit;border:1px solid #d8d4ef;border-radius:12px;margin-top:14px;min-height:110px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#f0efff;padding:12px;border-radius:10px}.stat b{display:block;font-size:1.5rem}button{padding:12px 16px;background:#5a48cc;color:white;border:0;border-radius:10px;font:inherit;cursor:pointer}.muted{color:#77718f}</style><body><main class="app"><h1>⌨️ Typing Speed Test</h1><p class="muted">Type the passage as accurately and quickly as you can.</p><div class="quote" id="passage"></div><textarea id="input" placeholder="Click here and start typing…" disabled></textarea><div class="stats"><div class="stat">Time left<b id="time">60s</b></div><div class="stat">Speed<b id="wpm">0 WPM</b></div><div class="stat">Accuracy<b id="accuracy">100%</b></div></div><button id="start">Start / Restart</button><p id="status" role="status">Press Start to begin a 60-second test.</p></main><script>const text='Learning to code is a journey built from small experiments, patient debugging, and steady practice. Write a little code every day, explore how it works, and improve one step at a time.';const $=x=>document.getElementById(x);let started=0,interval=null,active=false;function paint(){let typed=$('input').value,html='';for(let i=0;i<text.length;i++){let cls=i<typed.length?(typed[i]===text[i]?'correct':'wrong'):(i===typed.length?'current':'');html+='<span class="'+cls+'">'+(text[i]===' '?'&nbsp;':text[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'))+'</span>'}$('passage').innerHTML=html;let correct=0;for(let i=0;i<typed.length&&i<text.length;i++)if(typed[i]===text[i])correct++;let elapsed=active?(Date.now()-started)/60000:Math.max((60-parseInt($('time').textContent))/60,1/60);$('wpm').textContent=Math.round(correct/5/Math.max(elapsed,1/60))+' WPM';$('accuracy').textContent=(typed.length?Math.round(correct/typed.length*100):100)+'%'}function end(){active=false;clearInterval(interval);$('input').disabled=true;$('status').textContent='Test complete! Press Start to try again.'}function start() {clearInterval(interval);$('input').value='';$('input').disabled=false;$('input').focus();started=Date.now();active=true;$('time').textContent='60s';$('status').textContent='Go!';paint();interval=setInterval(()=>{let left=Math.max(0,60-Math.floor((Date.now()-started)/1000));$('time').textContent=left+'s';paint();if(!left)end()},250)}$('input').addEventListener('input',()=>{if($('input').value.length>=text.length){end()}paint()});$('start').onclick=start;$('passage').textContent=text;</script></body></html>
