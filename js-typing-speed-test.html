<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Typing Speed Test</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f8fafc;color:#172033;font-family:system-ui,sans-serif}.app{max-width:700px;margin:auto;padding:24px;background:white;border:1px solid #e2e8f0;border-radius:16px}.quote{padding:16px;background:#eff6ff;border-radius:10px;line-height:1.7}textarea{width:100%;min-height:120px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;margin-top:12px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:120px;padding:12px;background:#f1f5f9;border-radius:9px}button{padding:11px 15px;background:#2563eb;color:white;border:0;border-radius:8px;cursor:pointer;margin-top:12px}
</style></head><body><main class="app"><h1>Typing Speed Test</h1><p>Type the sample text below. Your WPM and accuracy update as you type.</p><div class="quote" id="sample">Small steps every day can turn a new skill into a lasting habit.</div><textarea id="typed" placeholder="Start typing the sample text here..." aria-label="Type the sample text"></textarea><div class="stats"><div class="stat">Speed<strong id="wpm" style="display:block;font-size:1.5rem">0 WPM</strong></div><div class="stat">Accuracy<strong id="accuracy" style="display:block;font-size:1.5rem">100%</strong></div><div class="stat">Elapsed<strong id="elapsed" style="display:block;font-size:1.5rem">0s</strong></div></div><button id="reset">Try again</button><p id="message" aria-live="polite"></p>
<script>
const sample=document.querySelector("#sample").textContent,typed=document.querySelector("#typed");let started=0,timer=null;function update(){const value=typed.value;if(value.length&&!started){started=Date.now();timer=setInterval(update,250);}const elapsed=started?(Date.now()-started)/1000:0;let correct=0;for(let i=0;i<value.length;i++){if(value[i]===sample[i])correct++;}const accuracy=value.length?Math.round(correct/value.length*100):100;document.querySelector("#wpm").textContent=(elapsed>0?Math.round((value.length/5)/(elapsed/60)):0)+" WPM";document.querySelector("#accuracy").textContent=accuracy+"%";document.querySelector("#elapsed").textContent=Math.floor(elapsed)+"s";if(value===sample){clearInterval(timer);document.querySelector("#message").textContent="Completed! Try again to improve your score.";}}
typed.addEventListener("input",update);document.querySelector("#reset").addEventListener("click",()=>{clearInterval(timer);timer=null;started=0;typed.value="";document.querySelector("#message").textContent="";update();});update();
</script></main></body></html>
