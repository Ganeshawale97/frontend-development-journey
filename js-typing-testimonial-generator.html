<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testimonial Generator</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f0f4ff,#fef1f6);font:16px system-ui;color:#20243b}.wrap{width:min(720px,100%);text-align:center}.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#6a63d8;font-weight:700}.card{background:white;border-radius:24px;padding:clamp(24px,6vw,50px);box-shadow:0 20px 65px #252e6214;margin:20px 0}.quote{font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.6;margin:10px 0 25px}.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#e5e7ff;color:#4b48b8;font-size:1.4rem;font-weight:800;margin:auto}.name{font-weight:750;margin:12px 0 2px}.role{color:#7b8097;margin:0}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 16px;background:#5a54d6;color:white;cursor:pointer}.secondary{background:#e8e9fb;color:#3d399d}.hint{font-size:13px;color:#767b91}
</style></head><body><main class="wrap"><div class="eyebrow">Design inspiration</div><h1>Testimonial Carousel</h1><p class="hint">Cycle through sample customer feedback. Customize the array in the script.</p><section class="card" aria-live="polite"><div class="avatar" id="avatar">A</div><p class="quote" id="quote"></p><div class="name" id="name"></div><p class="role" id="role"></p></section><div class="controls"><button class="secondary" id="prev">← Previous</button><button id="next">Next testimonial →</button><button class="secondary" id="random">Surprise me</button></div></main><script>
const data=[{quote:'The interface is simple, thoughtful, and easy to use. It made our everyday workflow smoother.',name:'Aarav Mehta',role:'Product Designer',initials:'AM'},{quote:'A reliable experience from the first click. The team understood our needs and delivered beautifully.',name:'Mira Shah',role:'Small Business Owner',initials:'MS'},{quote:'Everything feels clear and well organized. I spend less time searching and more time creating.',name:'Kabir Rao',role:'Developer',initials:'KR'},{quote:'A lovely balance of clean design and practical features. I would happily recommend it to others.',name:'Anaya Joshi',role:'Marketing Specialist',initials:'AJ'}];let index=0;function render(){const d=data[index];document.querySelector('#quote').textContent='“'+d.quote+'”';document.querySelector('#name').textContent=d.name;document.querySelector('#role').textContent=d.role;document.querySelector('#avatar').textContent=d.initials}document.querySelector('#prev').onclick=()=>{index=(index-1+data.length)%data.length;render()};document.querySelector('#next').onclick=()=>{index=(index+1)%data.length;render()};document.querySelector('#random').onclick=()=>{if(data.length>1){let n;do{n=Math.floor(Math.random()*data.length)}while(n===index);index=n}render()};render();
</script></body></html>
