<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eff6ff;color:#172554;font:16px system-ui}.app{width:min(600px,100%);padding:28px;background:white;border-radius:20px;box-shadow:0 16px 40px #1e3a8a12}h1{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:600}input,select{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #bfdbfe;border-radius:9px;font:inherit}.result{margin-top:18px;padding:20px;background:#dbeafe;border-radius:12px}.result small{display:block;color:#1d4ed8}.result strong{display:block;font-size:1.8rem;overflow-wrap:anywhere}button{margin-top:14px;padding:10px 14px;background:#2563eb;color:white;border:0;border-radius:9px;font:inherit;cursor:pointer}@media(max-width:460px){.fields{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>Unit Converter</h1><p>Convert length, weight, and temperature in one place.</p><label>Category<select id="category"><option value="length">Length</option><option value="weight">Weight</option><option value="temperature">Temperature</option></select></label><div class="fields" style="margin-top:14px"><label>From<input id="value" type="number" value="1" step="any"></label><label>Unit<select id="from"></select></label><label>Convert to<select id="to"></select></label></div><div class="result"><small>Converted result</small><strong id="result" aria-live="polite">—</strong></div><button id="swap">Swap units ⇄</button><script>const sets={length:{Meter:1,Kilometer:1000,Centimeter:.01,Millimeter:.001,Mile:1609.344,Foot:.3048,Inch:.0254},weight:{Kilogram:1,Gram:.001,Milligram:.000001,Pound:.45359237,Ounce:.028349523125},temperature:{Celsius:1,Fahrenheit:1,Kelvin:1}};const category=document.querySelector('#category'),from=document.querySelector('#from'),to=document.querySelector('#to'),value=document.querySelector('#value'),result=document.querySelector('#result');function fill(){const units=Object.keys(sets[category.value]);from.replaceChildren();to.replaceChildren();units.forEach((u,i)=>{from.add(new Option(u,u));to.add(new Option(u,u))});to.selectedIndex=Math.min(1,units.length-1);convert()}function temp(v,u){return u==='Celsius'?v:u==='Fahrenheit'?(v-32)*5/9:v-273.15}function fromC(v,u){return u==='Celsius'?v:u==='Fahrenheit'?v*9/5+32:v+273.15}function convert(){const v=Number(value.value);if(value.value===''||!Number.isFinite(v)){result.textContent='Enter a valid number';return}let out;if(category.value==='temperature')out=fromC(temp(v,from.value),to.value);else out=v*sets[category.value][from.value]/sets[category.value][to.value];result.textContent=Number(out.toPrecision(10)).toLocaleString(undefined,{maximumFractionDigits:8})+' '+to.value}category.onchange=fill;[from,to,value].forEach(el=>el.addEventListener('input',convert));document.querySelector('#swap').onclick=()=>{const old=from.value;from.value=to.value;to.value=old;convert()};fill();</script></main></body></html>
