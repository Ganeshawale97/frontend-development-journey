<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Encoder & Decoder</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#1e293b;font:16px system-ui}.wrap{max-width:850px;margin:42px auto;padding:0 18px}.panel{background:white;padding:22px;border-radius:16px;box-shadow:0 12px 35px #1e293b0c}h1{margin:0}.muted{color:#64748b}label{display:block;font-weight:650;margin:18px 0 7px}textarea{width:100%;min-height:140px;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:15px/1.5 ui-monospace,monospace;resize:vertical}button{padding:11px 14px;border:0;border-radius:9px;background:#0f766e;color:white;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.secondary{background:#e2e8f0;color:#334155}.status{min-height:24px;color:#0f766e;overflow-wrap:anywhere}.foot{font-size:13px;color:#64748b}
</style></head><body><main class="wrap"><section class="panel"><h1>URL Encoder / Decoder</h1><p class="muted">Convert text for safe use in URLs and decode percent-encoded strings.</p><label for="source">Input text</label><textarea id="source" placeholder="Type text or paste a URL parameter…"></textarea><div class="row"><button id="encode">Encode text</button><button id="decode">Decode text</button><button id="clear" class="secondary">Clear</button></div><label for="output">Result</label><textarea id="output" readonly placeholder="Your result appears here…"></textarea><div class="row"><button id="copy">Copy result</button><button id="swap" class="secondary">Use result as input</button></div><div class="status" id="status" role="status"></div><p class="foot">Uses encodeURIComponent/decodeURIComponent. Do not use this tool to submit sensitive data to untrusted websites.</p></section></main><script>
const $=s=>document.querySelector(s),src=$('#source'),out=$('#output'),status=$('#status');$('#encode').onclick=()=>{out.value=encodeURIComponent(src.value);status.textContent='Text encoded successfully.'};$('#decode').onclick=()=>{try{out.value=decodeURIComponent(src.value);status.textContent='Text decoded successfully.'}catch(e){status.textContent='Could not decode: the input may contain an invalid percent-encoded sequence.'}};$('#clear').onclick=()=>{src.value='';out.value='';status.textContent='Cleared.'};$('#swap').onclick=()=>{src.value=out.value;status.textContent='Result moved to input.'};$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(out.value);status.textContent='Copied result.'}catch(e){out.focus();out.select();status.textContent='Select the result and copy it manually.'}}
</script></body></html>
