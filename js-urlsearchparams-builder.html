<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Build and edit URL query strings with JavaScript's URLSearchParams API."><title>URLSearchParams Builder</title><style>
:root{color-scheme:light dark;--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#64748b;--accent:#5b5ce2;--line:#dce2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}h1{line-height:1.15;margin:.35rem 0}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 28px #1720330a}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:white;font-weight:700;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#e8eaff;color:#292b80}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9294ff;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.output{padding:14px;border-radius:12px;background:#111827;color:#e5e7eb;overflow-wrap:anywhere;min-height:54px}small,.hint{color:var(--muted)}.status{min-height:1.5em;color:var(--accent);font-weight:650}.demo{border:1px dashed var(--line);padding:16px;border-radius:12px;margin-top:14px}@media(prefers-color-scheme:dark){:root{--bg:#101827;--panel:#172235;--ink:#eef2ff;--muted:#aab6ca;--line:#344258}button.secondary{background:#30365e;color:#eef2ff}}@media(max-width:520px){.wrap{margin:24px auto}.panel{padding:16px}}
</style></head><body><main class="wrap"><span class="eyebrow">Frontend Development Journey</span><h1>URLSearchParams Builder</h1><p>Build and edit URL query strings with JavaScript's URLSearchParams API.</p><section class="panel"><div class="grid"><div><label for="base">Base URL</label><input id="base" value="https://example.com/products"></div><div><label for="key">Parameter name</label><input id="key" placeholder="category"></div><div><label for="value">Parameter value</label><input id="value" placeholder="books"></div></div><button id="add">Add / update parameter</button><button class="secondary" id="remove">Remove parameter</button><button class="secondary" id="clear">Clear all</button><label for="result">Generated URL</label><div id="result" class="output" aria-live="polite"></div><p id="status" class="status" role="status"></p><button class="secondary" id="copy">Copy URL</button></section></main><script>const base=document.querySelector('#base'),key=document.querySelector('#key'),value=document.querySelector('#value'),result=document.querySelector('#result'),status=document.querySelector('#status');function render(){try{const u=new URL(base.value);result.textContent=u.href}catch{result.textContent='Enter a valid absolute URL.'}}document.querySelector('#add').onclick=()=>{try{const u=new URL(base.value);if(!key.value.trim())throw Error('Enter a parameter name.');u.searchParams.set(key.value.trim(),value.value);base.value=u.href;render();status.textContent='Parameter added or updated.'}catch(e){status.textContent=e.message}};document.querySelector('#remove').onclick=()=>{try{const u=new URL(base.value);u.searchParams.delete(key.value);base.value=u.href;render();status.textContent='Parameter removed.'}catch{status.textContent='Enter a valid URL.'}};document.querySelector('#clear').onclick=()=>{try{const u=new URL(base.value);u.search='';base.value=u.href;render();status.textContent='Query string cleared.'}catch{status.textContent='Enter a valid URL.'}};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(result.textContent);status.textContent='Copied.'}catch{status.textContent='Clipboard access unavailable; select the URL to copy.'}};base.oninput=render;render();</script></body></html>
