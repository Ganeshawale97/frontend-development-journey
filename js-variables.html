<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Variables</title>
</head>
<body>
    <h1>JavaScript Variables</h1>
    <p id="output"></p>

    <script>
        let name = "Ganesh";
        let age = 21;
        const course = "Information Technology";

        document.getElementById("output").textContent =
            name + " is " + age + " years old and studies " + course + ".";
    </script>
</body>
</html>
