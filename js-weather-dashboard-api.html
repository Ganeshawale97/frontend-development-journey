<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Dashboard</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:linear-gradient(135deg,#dbeafe,#f5f3ff);font:16px system-ui;color:#172554}.wrap{max-width:720px;margin:auto}.card{background:#ffffffd9;border:1px solid #fff;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 12px 36px #25416c14}form{display:flex;gap:8px}input,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px}input{flex:1;min-width:0}button{background:#3156c9;color:white;border:0;cursor:pointer}.hero{text-align:center;padding:28px}.temp{font-size:4rem;font-weight:800;margin:4px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:#eef2ff;padding:14px;border-radius:12px}@media(max-width:500px){.grid{grid-template-columns:1fr}form{flex-direction:column}}</style><body><main class="wrap"><h1>🌦️ Weather Dashboard</h1><p class="muted">Search a city for current weather using Open-Meteo's public API.</p><section class="card"><form id="form"><input id="city" placeholder="Enter city (e.g. Pune)" value="Pune" required><button>Get weather</button></form><p id="status" role="status"></p></section><section class="card hero" id="result" hidden><h2 id="place"></h2><div class="temp" id="temp"></div><p id="desc"></p><div class="grid"><div class="tile">Feels like<h3 id="feels">—</h3></div><div class="tile">Humidity<h3 id="humidity">—</h3></div><div class="tile">Wind<h3 id="wind">—</h3></div></div><p class="muted" id="time"></p></section><p class="muted">Weather data: Open-Meteo. City lookup: Open-Meteo Geocoding.</p></main><script>const $=x=>document.getElementById(x);const descriptions={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Depositing rime fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Slight rain',63:'Rain',65:'Heavy rain',71:'Slight snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Heavy showers',95:'Thunderstorm'};$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Loading weather…';$('result').hidden=true;try{let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent($('city').value.trim())+'&count=1&language=en&format=json');if(!g.ok)throw Error('City lookup failed');let gd=await g.json();if(!gd.results?.length)throw Error('City not found. Try another name.');let c=gd.results[0],w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+c.latitude+'&longitude='+c.longitude+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m');if(!w.ok)throw Error('Weather service unavailable');let d=(await w.json()).current;$('place').textContent=c.name+(c.admin1?', '+c.admin1:'')+', '+c.country;$('temp').textContent=Math.round(d.temperature_2m)+'°C';$('desc').textContent=descriptions[d.weather_code]||'Weather code '+d.weather_code;$('feels').textContent=Math.round(d.apparent_temperature)+'°C';$('humidity').textContent=d.relative_humidity_2m+'%';$('wind').textContent=d.wind_speed_10m+' km/h';$('time').textContent='Updated: '+d.time.replace('T',' ')+' · Local timezone';$('result').hidden=false;$('status').textContent='Weather loaded.'}catch(err){$('status').textContent=err.message+' Check your internet connection and try again.'}};$('form').requestSubmit();</script></body></html>
