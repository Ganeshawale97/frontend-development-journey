<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Preview a share message and use the browser's native share sheet when supported."><title>Web Share API Playground</title><style>
:root{color-scheme:light dark;--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#64748b;--accent:#5b5ce2;--line:#dce2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}h1{line-height:1.15;margin:.35rem 0}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 28px #1720330a}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:white;font-weight:700;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#e8eaff;color:#292b80}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9294ff;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.output{padding:14px;border-radius:12px;background:#111827;color:#e5e7eb;overflow-wrap:anywhere;min-height:54px}small,.hint{color:var(--muted)}.status{min-height:1.5em;color:var(--accent);font-weight:650}.demo{border:1px dashed var(--line);padding:16px;border-radius:12px;margin-top:14px}@media(prefers-color-scheme:dark){:root{--bg:#101827;--panel:#172235;--ink:#eef2ff;--muted:#aab6ca;--line:#344258}button.secondary{background:#30365e;color:#eef2ff}}@media(max-width:520px){.wrap{margin:24px auto}.panel{padding:16px}}
</style></head><body><main class="wrap"><span class="eyebrow">Frontend Development Journey</span><h1>Web Share API Playground</h1><p>Preview a share message and use the browser's native share sheet when supported.</p><section class="panel"><label for="shareTitle">Share title</label><input id="shareTitle" value="My frontend project"><label for="shareText">Message</label><textarea id="shareText">I built this small project while learning JavaScript!</textarea><label for="shareUrl">Link (optional)</label><input id="shareUrl" type="url" placeholder="https://example.com"><div class="demo"><strong>Preview</strong><p id="preview"></p></div><button id="share">Share</button><button class="secondary" id="copy">Copy share text</button><p class="status" id="status" role="status" aria-live="polite"></p></section></main><script>const title=document.querySelector('#shareTitle'),msg=document.querySelector('#shareText'),url=document.querySelector('#shareUrl'),preview=document.querySelector('#preview'),status=document.querySelector('#status');function update(){preview.textContent=[msg.value,url.value].filter(Boolean).join(' — ')}[title,msg,url].forEach(x=>x.addEventListener('input',update));document.querySelector('#share').onclick=async()=>{const data={title:title.value,text:msg.value,url:url.value.trim()};if(data.url&&!/^https?:\\/\\//i.test(data.url)){status.textContent='Use a valid http or https link.';return}try{if(navigator.share&&(!navigator.canShare||navigator.canShare(data))){await navigator.share(data);status.textContent='Share sheet opened.'}else{await navigator.clipboard.writeText([data.title,data.text,data.url].filter(Boolean).join('\\n'));status.textContent='Native sharing is unavailable; content copied instead.'}}catch(e){status.textContent=e.name==='AbortError'?'Sharing cancelled.':'Sharing could not be completed.'}};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText([title.value,msg.value,url.value].filter(Boolean).join('\\n'));status.textContent='Copied.'}catch{status.textContent='Clipboard unavailable.'}};update();</script></body></html>
