<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Add expenses, view totals and remove entries using LocalStorage."><title>Expense Tracker | Frontend Development Journey</title><style>:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#172033;background:#f2f5fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 18px;display:grid;place-items:center}button,input,select{font:inherit}button{border:0;border-radius:10px;background:#5558dc;color:white;padding:11px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.panel,.card{width:min(100%,560px);background:white;border:1px solid #e1e7f0;border-radius:20px;padding:28px;box-shadow:0 18px 55px #1b2b4b12}.panel h1,.card h1{margin-top:0}.eyebrow{color:#6668dc;font-size:12px;font-weight:800;letter-spacing:.12em}label{display:block;margin:15px 0;color:#536078;font-size:13px;font-weight:700}input,select{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #dce3ee;border-radius:9px;background:white;color:#172033}p{color:#69758a;line-height:1.55}.secondary,.ghost,.subtle{background:#eef0ff;color:#4d50c7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}output,.clock{display:block;text-align:center;font-size:64px;font-weight:850;margin:25px 0;color:#5558dc}.stats{display:flex;justify-content:space-around;margin:22px 0;color:#68748a}.stats span{text-align:center}.stats b{display:block;color:#172033;font-size:20px}.cover{height:105px;background:linear-gradient(120deg,#6266e9,#9b8af7);border-radius:14px}.avatar{width:94px;height:94px;border-radius:50%;object-fit:cover;border:5px solid white;margin-top:-48px}.role{color:#5558dc;font-weight:700}.bio{max-width:430px}.card{text-align:center}.card .stats{border-block:1px solid #edf0f5;padding:15px 0}.done{text-decoration:line-through;color:#9aa3b2}.filters{display:flex;gap:8px;margin:18px 0}.filters button{background:#eef0ff;color:#5054c8}.filters .selected{background:#5558dc;color:white}ul{padding:0;list-style:none}li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f5}li label{display:flex;align-items:center;gap:10px;margin:0}li input{width:auto;margin:0}li button{padding:7px 10px;background:#fff0f1;color:#b93648;font-size:12px}.result,.total{background:#f5f6ff;border-radius:12px;padding:15px;margin-top:18px}.result p{display:flex;justify-content:space-between}.result strong{color:#5558dc}.answers{display:grid;gap:10px}.answers button{background:#f0f2f8;color:#253047;text-align:left}.answers button.correct{background:#dff7ea;color:#08774b}.answers button.wrong{background:#ffeaed;color:#b52e42}.meter{height:9px;background:#e9edf4;border-radius:20px;overflow:hidden;margin:16px 0}.meter span{display:block;height:100%;width:0;background:#5558dc;transition:width .2s}.pass{color:#078453}.password{display:flex;gap:8px}.password input{flex:1}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.swatch{height:150px;padding:8px;display:flex;align-items:end;justify-content:center;overflow-wrap:anywhere}.total{display:flex;justify-content:space-between;font-size:17px}.total strong{color:#5558dc}header{width:min(100%,1000px);display:flex;align-items:center;justify-content:space-between;background:#fff;padding:16px 22px;border-radius:14px;box-shadow:0 10px 35px #14203b0d}header .logo{font-weight:900;font-size:22px;color:#5558dc;text-decoration:none}header nav{display:flex;gap:22px}header nav a{color:#344056;text-decoration:none}header #menuBtn{display:none}main#home{width:min(100%,1000px);padding:60px 20px}main#home h1{font-size:clamp(36px,6vw,64px)}main#home section{min-height:160px;padding-top:25px}@media(max-width:650px){body{padding:16px 10px}.panel,.card{padding:20px}.palette{grid-template-columns:repeat(2,1fr)}.swatch{height:100px}header{flex-wrap:wrap}header #menuBtn{display:block}header nav{display:none;flex-basis:100%;flex-direction:column;padding-top:15px}header nav.open{display:flex}}body.dark{background:#111827;color:#f4f6ff}body.dark .card{background:#202b40;color:#f4f6ff}body.dark .bio{color:#d0d8e8}</style></head><body>
<main class="panel"><h1>Expense tracker</h1><form id="form"><input id="title" placeholder="Expense name" required maxlength="50"><input id="amount" type="number" min=".01" step=".01" placeholder="Amount ₹" required><button>Add</button></form><div class="total">Total spent <strong id="total">₹0.00</strong></div><ul id="expenses"></ul><p id="empty">No expenses added yet.</p><button id="clear" class="subtle">Clear all</button></main>
<script>let expenses=JSON.parse(localStorage.getItem('practice-expenses')||'[]');const list=document.querySelector('#expenses');function render(){list.innerHTML='';let total=0;expenses.forEach(e=>{total+=e.amount;const li=document.createElement('li'),name=document.createElement('span'),amount=document.createElement('b'),del=document.createElement('button');name.textContent=e.title;amount.textContent='₹'+e.amount.toFixed(2);del.textContent='Remove';del.onclick=()=>{expenses=expenses.filter(x=>x.id!==e.id);save()};li.append(name,amount,del);list.append(li)});document.querySelector('#total').textContent='₹'+total.toFixed(2);document.querySelector('#empty').hidden=expenses.length>0}function save(){localStorage.setItem('practice-expenses',JSON.stringify(expenses));render()}document.querySelector('#form').onsubmit=e=>{e.preventDefault();expenses.unshift({id:crypto.randomUUID(),title:document.querySelector('#title').value.trim(),amount:Number(document.querySelector('#amount').value)});e.target.reset();save()};document.querySelector('#clear').onclick=()=>{expenses=[];save()};render();</script>
</body></html>
