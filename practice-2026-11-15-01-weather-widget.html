<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Widget</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#e0e7ff);font:16px system-ui;color:#172554}.card{width:min(92vw,390px);padding:28px;border-radius:24px;background:#fff;box-shadow:0 20px 50px #1e3a8a22}.muted{color:#64748b}.row{display:flex;gap:10px}input,button{padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}input{min-width:0;flex:1}button{background:#2563eb;color:white;border:0;cursor:pointer}.temp{font-size:4rem;font-weight:700;margin:10px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.tile{background:#eff6ff;padding:14px;border-radius:14px}</style></head><body><main class="card"><h1>Weather snapshot</h1><p class="muted">Demo widget using sample data. No API key required.</p><form id="search" class="row"><input id="city" placeholder="Enter a city" value="Pune" required><button>Search</button></form><section id="result" aria-live="polite"><p class="muted">Pune · Sample conditions</p><div class="temp">28°</div><strong>Partly cloudy ☁️</strong><div class="details"><div class="tile">💧 Humidity<br><b>62%</b></div><div class="tile">💨 Wind<br><b>12 km/h</b></div></div></section></main><script>
const form=document.querySelector('#search'),city=document.querySelector('#city'),result=document.querySelector('#result');form.addEventListener('submit',e=>{e.preventDefault();const name=city.value.trim();if(!name)return;result.innerHTML='<p class="muted"></p><div class="temp">28°</div><strong>Demo conditions ☀️</strong><div class="details"><div class="tile">💧 Humidity<br><b>60%</b></div><div class="tile">💨 Wind<br><b>10 km/h</b></div></div>';result.querySelector('p').textContent=name+' · Sample conditions';});</script></body></html>
