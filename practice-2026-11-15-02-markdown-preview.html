<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Notes Preview</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f1f5f9;font:16px system-ui;color:#0f172a}.wrap{max-width:1000px;margin:auto}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}textarea,.preview{min-height:360px;width:100%;padding:18px;border:1px solid #cbd5e1;border-radius:14px;background:white;font:15px/1.6 ui-monospace,monospace}.preview{font:16px/1.6 system-ui;overflow-wrap:anywhere}.preview h1{font-size:2rem}.preview code{background:#e2e8f0;padding:2px 5px;border-radius:4px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Live notes preview</h1><p>Try headings, bold text, bullets, and inline code.</p><div class="grid"><textarea id="source" aria-label="Markdown input"># My learning log
Today I practised **JavaScript DOM**.

- Selected elements
- Added event listeners
- Updated the page

Run `console.log("hello")` in the browser console.</textarea><article id="preview" class="preview" aria-live="polite"></article></div></main><script>
const source=document.querySelector('#source'),preview=document.querySelector('#preview');function escapeHTML(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}function render(){const lines=escapeHTML(source.value).split('\n');let html='',list=false;for(const line of lines){if(line.startsWith('- ')){if(!list){html+='<ul>';list=true;}html+='<li>'+line.slice(2)+'</li>';continue;}if(list){html+='</ul>';list=false;}if(line.startsWith('# '))html+='<h1>'+line.slice(2)+'</h1>';else if(line.startsWith('## '))html+='<h2>'+line.slice(3)+'</h2>';else if(line.trim())html+='<p>'+line+'</p>';}if(list)html+='</ul>';preview.innerHTML=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}source.addEventListener('input',render);render();</script></body></html>
