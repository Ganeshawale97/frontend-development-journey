<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filterable Gallery</title><style>body{font:16px system-ui;background:#f8fafc;padding:28px;color:#0f172a}.wrap{max-width:1000px;margin:auto}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{border:0;border-radius:99px;padding:9px 16px;cursor:pointer}.active{background:#0f172a;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.item{border-radius:16px;overflow:hidden;background:white;box-shadow:0 8px 24px #0f172a10}.item img{width:100%;height:160px;object-fit:cover}.item p{margin:12px;font-weight:600}</style><main class="wrap"><h1>Mini image gallery</h1><nav class="filters" aria-label="Gallery filters"><button class="active" data-filter="all">All</button><button data-filter="nature">Nature</button><button data-filter="city">City</button><button data-filter="design">Design</button></nav><section class="grid"><article class="item" data-category="nature"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Sunrise over hills"><p>Sunrise · Nature</p></article><article class="item" data-category="city"><img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600" alt="City skyline"><p>Skyline · City</p></article><article class="item" data-category="design"><img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?w=600" alt="Minimal desk"><p>Workspace · Design</p></article><article class="item" data-category="nature"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest path"><p>Forest · Nature</p></article></section></main><script>const buttons=document.querySelectorAll('[data-filter]'),items=document.querySelectorAll('.item');buttons.forEach(b=>b.addEventListener('click',()=>{buttons.forEach(x=>x.classList.toggle('active',x===b));items.forEach(item=>item.hidden=b.dataset.filter!=='all'&&item.dataset.category!==b.dataset.filter)}));</script>
