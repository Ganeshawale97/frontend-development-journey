<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filterable Image Gallery</title><style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#f8fafc;color:#0f172a;font:16px system-ui}.wrap{max-width:1000px;margin:auto}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{border:0;border-radius:999px;padding:9px 16px;background:#e2e8f0;cursor:pointer}.filters button.active{background:#0f172a;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.item{border-radius:16px;overflow:hidden;background:white;box-shadow:0 8px 24px #0f172a10}.item img{width:100%;height:160px;object-fit:cover;display:block}.item p{margin:12px;font-weight:600}</style></head><body><main class="wrap"><h1>Mini image gallery</h1><p>Filter cards by category using JavaScript.</p><nav class="filters" aria-label="Gallery filters"><button class="active" data-filter="all">All</button><button data-filter="nature">Nature</button><button data-filter="city">City</button><button data-filter="design">Design</button></nav><section class="grid" id="gallery"><article class="item" data-category="nature"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Sunrise over hills"><p>Golden sunrise · Nature</p></article><article class="item" data-category="city"><img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600" alt="City skyline"><p>City skyline · City</p></article><article class="item" data-category="design"><img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?w=600" alt="Minimal desk"><p>Quiet workspace · Design</p></article><article class="item" data-category="nature"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest path"><p>Forest path · Nature</p></article></section></main><script>
const buttons=document.querySelectorAll('[data-filter]'),items=document.querySelectorAll('.item');buttons.forEach(button=>button.addEventListener('click',()=>{buttons.forEach(b=>b.classList.toggle('active',b===button));items.forEach(item=>item.hidden=button.dataset.filter!=='all'&&item.dataset.category!==button.dataset.filter);}));</script></body></html>
