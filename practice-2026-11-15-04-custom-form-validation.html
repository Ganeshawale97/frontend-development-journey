<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Validation</title><style>body{font:16px system-ui;background:#ecfeff;color:#164e63;max-width:440px;margin:8vh auto;padding:20px}.form{background:white;padding:28px;border-radius:20px}label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #a5f3fc;border-radius:9px;font:inherit}.error{color:#b91c1c;min-height:20px;font-size:.9rem}button{width:100%;padding:12px;margin-top:18px;background:#0e7490;color:white;border:0;border-radius:9px}</style><form class="form" id="signup" novalidate><h1>Create account</h1><label for="name">Full name</label><input id="name"><div class="error" id="nameError"></div><label for="email">Email</label><input id="email" type="email"><div class="error" id="emailError"></div><label for="password">Password</label><input id="password" type="password"><div class="error" id="passwordError"></div><button>Create account</button><p id="status" aria-live="polite"></p></form><script>signup.addEventListener('submit',e=>{e.preventDefault();const n=name.value.trim(),mail=email.value.trim(),pw=password.value;const errors={name:n.length>=2?'':'Enter at least 2 characters.',email:/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)?'':'Enter a valid email.',password:pw.length>=8?'':'Use at least 8 characters.'};Object.entries(errors).forEach(([k,v])=>document.querySelector('#'+k+'Error').textContent=v);status.textContent=Object.values(errors).some(Boolean)?'Please correct the fields.':'Form validated successfully!';});</script>
