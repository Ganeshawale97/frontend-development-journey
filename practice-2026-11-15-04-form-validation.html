<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Validation</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ecfeff;font:16px system-ui;color:#164e63}.form{width:min(92vw,440px);background:white;padding:28px;border-radius:20px;box-shadow:0 16px 40px #164e6320}label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #a5f3fc;border-radius:9px;font:inherit}button{width:100%;padding:12px;margin-top:18px;border:0;border-radius:9px;background:#0e7490;color:white;font:inherit;cursor:pointer}.error{color:#b91c1c;min-height:20px;font-size:.9rem}.success{color:#047857}</style></head><body><form class="form" id="signup" novalidate><h1>Create account</h1><p>Practise custom client-side form validation.</p><label for="name">Full name</label><input id="name" autocomplete="name"><div class="error" id="nameError"></div><label for="email">Email</label><input id="email" type="email" autocomplete="email"><div class="error" id="emailError"></div><label for="password">Password</label><input id="password" type="password"><div class="error" id="passwordError"></div><button>Create account</button><p id="status" aria-live="polite"></p></form><script>
const form=document.querySelector('#signup');form.addEventListener('submit',e=>{e.preventDefault();const name=document.querySelector('#name').value.trim(),email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;const errors={name:name.length<2?'Enter at least 2 characters.':'',email:/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'':'Enter a valid email address.',password:password.length>=8?'':'Use at least 8 characters.'};Object.entries(errors).forEach(([key,msg])=>document.querySelector('#'+key+'Error').textContent=msg);const status=document.querySelector('#status');status.textContent=Object.values(errors).some(Boolean)?'Please correct the highlighted fields.':'Form validated successfully!';status.className=Object.values(errors).some(Boolean)?'error':'success';});</script></body></html>
