<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Notes</title><style>body{font:16px system-ui;background:#fefce8;color:#422006;padding:28px}.app{max-width:720px;margin:auto}.composer{display:flex;gap:8px}.composer input{flex:1;min-width:0;padding:12px;border:1px solid #fde68a;border-radius:9px}.composer button{background:#a16207;color:white;border:0;border-radius:9px;padding:0 18px}.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}.note{background:#fff7cc;padding:16px;border-radius:12px;overflow-wrap:anywhere}.note button{float:right;border:0;background:transparent;color:#92400e}</style><main class="app"><h1>Quick notes</h1><p>Saved in this browser with localStorage.</p><form id="add" class="composer"><input id="text" placeholder="Write a note..." required maxlength="180"><button>Add</button></form><section id="notes" class="notes"></section></main><script>const key='quick-notes-v1',el=document.querySelector('#notes');let notes;try{notes=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(notes))notes=[]}catch{notes=[]}function save(){localStorage.setItem(key,JSON.stringify(notes));render()}function render(){el.replaceChildren();notes.forEach((note,i)=>{const card=document.createElement('article'),txt=document.createElement('span'),del=document.createElement('button');card.className='note';txt.textContent=note;del.textContent='Delete';del.addEventListener('click',()=>{notes.splice(i,1);save()});card.append(del,txt);el.append(card)})}document.querySelector('#add').addEventListener('submit',e=>{e.preventDefault();if(text.value.trim()){notes.unshift(text.value.trim());text.value='';save()}});render();</script>
