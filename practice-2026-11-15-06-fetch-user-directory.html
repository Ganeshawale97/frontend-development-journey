<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetch Users</title><style>body{font:16px system-ui;background:#f0fdf4;color:#14532d;padding:28px}.wrap{max-width:850px;margin:auto}button{padding:10px 16px;border:0;border-radius:9px;background:#15803d;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}.user{padding:16px;background:white;border-radius:14px;box-shadow:0 8px 20px #14532d10}</style><main class="wrap"><h1>Fetch users</h1><p>Practise async/await, fetch(), JSON and error handling.</p><button id="load">Load sample users</button><p id="status" role="status"></p><section id="users" class="grid"></section></main><script>const load=document.querySelector('#load'),status=document.querySelector('#status'),users=document.querySelector('#users');load.addEventListener('click',async()=>{load.disabled=true;status.textContent='Loading…';users.replaceChildren();try{const response=await fetch('https://jsonplaceholder.typicode.com/users');if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();data.slice(0,6).forEach(user=>{const card=document.createElement('article'),h=document.createElement('h2'),email=document.createElement('p'),company=document.createElement('p');card.className='user';h.textContent=user.name;email.textContent=user.email;company.textContent=user.company.name;card.append(h,email,company);users.append(card)});status.textContent='Loaded '+Math.min(data.length,6)+' users.'}catch(error){status.textContent='Could not load users. Check your connection.';console.error(error)}finally{load.disabled=false}});</script>
