<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetch Users</title><style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#f0fdf4;font:16px system-ui;color:#14532d}.wrap{max-width:850px;margin:auto}button{padding:10px 16px;border:0;border-radius:9px;background:#15803d;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}.user{padding:16px;background:white;border-radius:14px;box-shadow:0 8px 20px #14532d10}.muted{color:#64748b}#status{min-height:24px}</style></head><body><main class="wrap"><h1>Fetch users</h1><p>Learn async/await, fetch(), JSON and error handling.</p><button id="load">Load sample users</button><p id="status" role="status" class="muted"></p><section id="users" class="grid"></section></main><script>
const load=document.querySelector('#load'),status=document.querySelector('#status'),users=document.querySelector('#users');load.addEventListener('click',async()=>{load.disabled=true;status.textContent='Loading...';users.replaceChildren();try{const response=await fetch('https://jsonplaceholder.typicode.com/users');if(!response.ok)throw new Error('Request failed: '+response.status);const data=await response.json();data.slice(0,6).forEach(user=>{const card=document.createElement('article'),name=document.createElement('h2'),email=document.createElement('p'),company=document.createElement('p');card.className='user';name.textContent=user.name;email.textContent=user.email;company.textContent=user.company.name;card.append(name,email,company);users.append(card);});status.textContent='Loaded '+Math.min(data.length,6)+' users.';}catch(error){status.textContent='Could not load users. Check your connection and try again.';console.error(error);}finally{load.disabled=false;}});</script></body></html>
