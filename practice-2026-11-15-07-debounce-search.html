<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debounced Search</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f5f3ff;font:16px system-ui;color:#2e1065}.wrap{max-width:650px;margin:auto}input{width:100%;padding:14px;border:1px solid #c4b5fd;border-radius:12px;font:inherit}.list{padding:0;list-style:none}.list li{background:white;padding:12px 15px;margin:8px 0;border-radius:10px}.muted{color:#6b7280}</style></head><body><main class="wrap"><h1>Debounced search</h1><p>Type to search a local list. Filtering runs after a short pause.</p><input id="query" placeholder="Search technologies..." aria-label="Search technologies"><p id="count" class="muted" aria-live="polite"></p><ul id="results" class="list"></ul></main><script>
const data=['HTML','CSS','JavaScript','TypeScript','React','Vue','Angular','Svelte','Node.js','Express','Accessibility','Web Performance'];const query=document.querySelector('#query'),results=document.querySelector('#results'),count=document.querySelector('#count');let timer;function render(){const term=query.value.trim().toLowerCase(),matches=data.filter(item=>item.toLowerCase().includes(term));results.replaceChildren();matches.forEach(item=>{const li=document.createElement('li');li.textContent=item;results.append(li);});count.textContent=matches.length+' result(s)';}query.addEventListener('input',()=>{clearTimeout(timer);count.textContent='Searching...';timer=setTimeout(render,250);});render();</script></body></html>
