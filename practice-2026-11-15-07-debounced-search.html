<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debounced Search</title><style>body{font:16px system-ui;background:#f5f3ff;color:#2e1065;max-width:650px;margin:8vh auto;padding:24px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #c4b5fd;border-radius:12px;font:inherit}.list{padding:0;list-style:none}.list li{background:white;padding:12px;margin:8px 0;border-radius:10px}</style><main><h1>Debounced search</h1><p>Filtering runs after a short pause while typing.</p><input id="query" placeholder="Search technologies..." aria-label="Search technologies"><p id="count" aria-live="polite"></p><ul id="results" class="list"></ul></main><script>const data=['HTML','CSS','JavaScript','TypeScript','React','Vue','Angular','Svelte','Node.js','Express','Accessibility','Web Performance'],query=document.querySelector('#query'),results=document.querySelector('#results'),count=document.querySelector('#count');let timer;function render(){const term=query.value.trim().toLowerCase(),matches=data.filter(x=>x.toLowerCase().includes(term));results.replaceChildren();matches.forEach(x=>{const li=document.createElement('li');li.textContent=x;results.append(li)});count.textContent=matches.length+' result(s)'}query.addEventListener('input',()=>{clearTimeout(timer);count.textContent='Searching…';timer=setTimeout(render,250)});render();</script>
