<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drag and Drop Board</title><style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#f1f5f9;font:16px system-ui;color:#0f172a}.board{max-width:950px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.column{min-height:260px;background:#e2e8f0;padding:14px;border-radius:14px}.column h2{font-size:1rem}.task{background:white;padding:12px;margin:9px 0;border-radius:9px;cursor:grab;box-shadow:0 3px 8px #0f172a10}.over{outline:2px dashed #2563eb}@media(max-width:650px){.board{grid-template-columns:1fr}}</style></head><body><main><h1>Task board</h1><p>Drag a task card between columns.</p><section class="board"><div class="column" data-status="todo"><h2>To do</h2><article class="task" draggable="true">Plan the page layout</article><article class="task" draggable="true">Create a navigation bar</article></div><div class="column" data-status="doing"><h2>In progress</h2><article class="task" draggable="true">Style the cards</article></div><div class="column" data-status="done"><h2>Done</h2><article class="task" draggable="true">Set up the project</article></div></section></main><script>
let dragged=null;document.querySelectorAll('.task').forEach(task=>task.addEventListener('dragstart',()=>{dragged=task;}));document.querySelectorAll('.column').forEach(column=>{column.addEventListener('dragover',e=>{e.preventDefault();column.classList.add('over');});column.addEventListener('dragleave',()=>column.classList.remove('over'));column.addEventListener('drop',e=>{e.preventDefault();column.classList.remove('over');if(dragged)column.append(dragged);dragged=null;});});</script></body></html>
