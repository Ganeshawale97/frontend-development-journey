<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drag Drop Board</title><style>body{font:16px system-ui;background:#f1f5f9;color:#0f172a;padding:28px}.board{max-width:950px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.column{min-height:260px;background:#e2e8f0;padding:14px;border-radius:14px}.task{background:white;padding:12px;margin:9px 0;border-radius:9px;cursor:grab}.over{outline:2px dashed #2563eb}@media(max-width:650px){.board{grid-template-columns:1fr}}</style><h1>Task board</h1><p>Drag a task card between columns.</p><section class="board"><div class="column"><h2>To do</h2><article class="task" draggable="true">Plan page layout</article><article class="task" draggable="true">Create navigation</article></div><div class="column"><h2>In progress</h2><article class="task" draggable="true">Style the cards</article></div><div class="column"><h2>Done</h2><article class="task" draggable="true">Set up project</article></div></section><script>let dragged=null;document.querySelectorAll('.task').forEach(t=>t.addEventListener('dragstart',()=>dragged=t));document.querySelectorAll('.column').forEach(c=>{c.addEventListener('dragover',e=>{e.preventDefault();c.classList.add('over')});c.addEventListener('dragleave',()=>c.classList.remove('over'));c.addEventListener('drop',e=>{e.preventDefault();c.classList.remove('over');if(dragged)c.append(dragged);dragged=null})});</script>
