<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessible Tabs</title><style>body{font:16px system-ui;background:#fff7ed;color:#431407;padding:30px}.box{max-width:680px;margin:5vh auto;background:white;padding:24px;border-radius:18px}.tabs{display:flex;gap:8px}.tabs button{padding:10px 15px;border:0;border-radius:8px;background:#ffedd5}.tabs button[aria-selected=true]{background:#c2410c;color:white}.panel{padding:18px 4px;line-height:1.7}.panel[hidden]{display:none}:focus-visible{outline:3px solid #ea580c;outline-offset:3px}</style><main class="box"><h1>Accessible tabs</h1><div class="tabs" role="tablist" aria-label="Frontend topics"><button role="tab" id="th" aria-controls="ph" aria-selected="true">HTML</button><button role="tab" id="tc" aria-controls="pc" aria-selected="false" tabindex="-1">CSS</button><button role="tab" id="tj" aria-controls="pj" aria-selected="false" tabindex="-1">JavaScript</button></div><section id="ph" class="panel" role="tabpanel" aria-labelledby="th">HTML provides structure. Semantic elements describe the role of content.</section><section id="pc" class="panel" role="tabpanel" aria-labelledby="tc" hidden>CSS controls layout, color, spacing, typography and responsive behavior.</section><section id="pj" class="panel" role="tabpanel" aria-labelledby="tj" hidden>JavaScript adds behavior through events, state and browser APIs.</section></main><script>const tabs=[...document.querySelectorAll('[role=tab]')];function activate(tab){tabs.forEach(t=>{const on=t===tab;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on});tab.focus()}tabs.forEach((t,i)=>{t.addEventListener('click',()=>activate(t));t.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let n=i;if(e.key==='ArrowRight')n=(i+1)%tabs.length;if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;if(e.key==='Home')n=0;if(e.key==='End')n=tabs.length-1;activate(tabs[n])}})});</script>
