<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessible Tabs</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#fff7ed;font:16px system-ui;color:#431407}.box{max-width:680px;margin:5vh auto;background:white;border-radius:18px;padding:24px;box-shadow:0 15px 35px #7c2d1218}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:10px 15px;border:0;border-radius:8px;background:#ffedd5;cursor:pointer}.tabs button[aria-selected=true]{background:#c2410c;color:white}.panel{padding:18px 4px;line-height:1.7}.panel[hidden]{display:none}:focus-visible{outline:3px solid #ea580c;outline-offset:3px}</style></head><body><main class="box"><h1>Accessible tabs</h1><div class="tabs" role="tablist" aria-label="Frontend topics"><button role="tab" id="tab-html" aria-controls="panel-html" aria-selected="true">HTML</button><button role="tab" id="tab-css" aria-controls="panel-css" aria-selected="false" tabindex="-1">CSS</button><button role="tab" id="tab-js" aria-controls="panel-js" aria-selected="false" tabindex="-1">JavaScript</button></div><section id="panel-html" class="panel" role="tabpanel" aria-labelledby="tab-html">HTML gives a page its structure. Use semantic elements to describe content clearly.</section><section id="panel-css" class="panel" role="tabpanel" aria-labelledby="tab-css" hidden>CSS controls presentation: layout, color, spacing, typography, and responsive behavior.</section><section id="panel-js" class="panel" role="tabpanel" aria-labelledby="tab-js" hidden>JavaScript adds behavior and interactivity through events, state, and browser APIs.</section></main><script>
const tabs=[...document.querySelectorAll('[role=tab]')];function activate(tab){tabs.forEach(t=>{const selected=t===tab;t.setAttribute('aria-selected',String(selected));t.tabIndex=selected?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!selected;});tab.focus();}tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>activate(tab));tab.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let next=index;if(e.key==='ArrowRight')next=(index+1)%tabs.length;if(e.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;if(e.key==='Home')next=0;if(e.key==='End')next=tabs.length-1;activate(tabs[next]);}});});</script></body></html>
