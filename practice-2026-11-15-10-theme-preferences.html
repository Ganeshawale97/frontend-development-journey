<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme Preferences</title><style>
:root{color-scheme:light;--bg:#f8fafc;--surface:white;--text:#0f172a;--accent:#4f46e5}body.dark{color-scheme:dark;--bg:#0f172a;--surface:#1e293b;--text:#e2e8f0;--accent:#818cf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px system-ui;transition:.2s}.card{width:min(90vw,440px);padding:28px;background:var(--surface);border-radius:20px;box-shadow:0 15px 35px #0002}button{padding:11px 16px;border:0;border-radius:9px;background:var(--accent);color:white;cursor:pointer;font:inherit}</style></head><body><main class="card"><h1>Theme preferences</h1><p>Choose a theme. Your preference is saved in localStorage.</p><button id="toggle">Switch theme</button><p id="mode" aria-live="polite"></p></main><script>
const button=document.querySelector('#toggle'),mode=document.querySelector('#mode');let saved=localStorage.getItem('preferred-theme');if(!['dark','light'].includes(saved))saved=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';function apply(){document.body.classList.toggle('dark',saved==='dark');mode.textContent='Current theme: '+saved;}button.addEventListener('click',()=>{saved=saved==='dark'?'light':'dark';localStorage.setItem('preferred-theme',saved);apply();});apply();</script></body></html>
