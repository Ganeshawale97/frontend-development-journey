<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Countdown</title><style>body{font:16px system-ui;background:linear-gradient(135deg,#0f172a,#312e81);color:white;min-height:95vh;display:grid;place-items:center;text-align:center}.card{width:min(92vw,600px)}.units{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0}.unit{background:#ffffff17;padding:18px 8px;border-radius:14px}.value{font-size:clamp(2rem,7vw,3.6rem);font-weight:800;display:block}input{padding:9px;border-radius:8px;border:0}@media(max-width:430px){.units{grid-template-columns:repeat(2,1fr)}}</style><main class="card"><h1>Countdown clock</h1><p>Pick a future date and time.</p><label>Target <input id="date" type="datetime-local"></label><section class="units" aria-live="polite"><div class="unit"><span class="value" id="days">0</span>Days</div><div class="unit"><span class="value" id="hours">00</span>Hours</div><div class="unit"><span class="value" id="minutes">00</span>Minutes</div><div class="unit"><span class="value" id="seconds">00</span>Seconds</div></section><p id="status">Choose a target date.</p></main><script>const date=document.querySelector('#date'),status=document.querySelector('#status');let timer;function tick(){const target=new Date(date.value).getTime(),diff=target-Date.now();if(!date.value||!Number.isFinite(target)){status.textContent='Choose a target date.';return}if(diff<=0){['days','hours','minutes','seconds'].forEach(id=>document.getElementById(id).textContent='0');status.textContent='The selected time has arrived!';clearInterval(timer);return}const v={days:Math.floor(diff/86400000),hours:Math.floor(diff/3600000)%24,minutes:Math.floor(diff/60000)%60,seconds:Math.floor(diff/1000)%60};Object.entries(v).forEach(([id,n])=>document.getElementById(id).textContent=String(n).padStart(2,'0'));status.textContent='Counting down…'}date.addEventListener('change',()=>{clearInterval(timer);tick();timer=setInterval(tick,1000)});</script>
