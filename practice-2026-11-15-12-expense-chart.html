<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Breakdown</title><style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#f8fafc;color:#0f172a;font:16px system-ui}.wrap{max-width:720px;margin:auto}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 12px 30px #0f172a0e}.bar{display:flex;height:28px;overflow:hidden;border-radius:99px;background:#e2e8f0;margin:20px 0}.segment{height:100%}.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px}.legend span{display:flex;justify-content:space-between;padding:10px;background:#f1f5f9;border-radius:9px}label{display:block;margin:12px 0 5px}input{padding:8px;width:100%;border:1px solid #cbd5e1;border-radius:8px}</style></head><body><main class="wrap"><h1>Monthly expense breakdown</h1><p>Update values to redraw the CSS bar chart.</p><section class="card"><div id="bar" class="bar" role="img" aria-label="Expense category proportions"></div><div class="legend" id="legend"></div><div id="inputs"></div></section></main><script>
const categories=[['Rent',12000],['Food',5000],['Travel',2500],['Other',1500]],bar=document.querySelector('#bar'),legend=document.querySelector('#legend'),inputs=document.querySelector('#inputs');categories.forEach(([name,value],i)=>{const label=document.createElement('label'),input=document.createElement('input');label.textContent=name+' amount (₹)';input.type='number';input.min='0';input.value=value;input.dataset.index=i;input.addEventListener('input',()=>{categories[i][1]=Math.max(0,Number(input.value)||0);render();});inputs.append(label,input);});function render(){const total=categories.reduce((sum,item)=>sum+item[1],0)||1;bar.replaceChildren();legend.replaceChildren();categories.forEach(([name,value])=>{const part=document.createElement('div');part.className='segment';part.style.width=(value/total*100)+'%';part.style.background=['#2563eb','#16a34a','#f59e0b','#a855f7'][categories.findIndex(x=>x[0]===name)];bar.append(part);const line=document.createElement('span'),title=document.createElement('b'),amount=document.createElement('span');title.textContent=name;amount.textContent='₹'+value.toLocaleString('en-IN');line.append(title,amount);legend.append(line);});}render();</script></body></html>
