<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modal Dialog</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;font:16px system-ui;background:#eff6ff;color:#172554}.card{max-width:650px;margin:10vh auto;background:white;padding:28px;border-radius:18px}button{padding:11px 16px;border:0;background:#1d4ed8;color:white;border-radius:9px;cursor:pointer}dialog{border:0;border-radius:18px;padding:26px;width:min(90vw,420px);box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0f172a99}dialog button{margin-top:12px}</style></head><body><main class="card"><h1>Native modal dialog</h1><p>Use the HTML dialog element and its built-in accessibility behavior.</p><button id="open">Open dialog</button></main><dialog id="dialog" aria-labelledby="title"><h2 id="title">Welcome!</h2><p>This dialog uses showModal() and close(). Press Escape to dismiss it.</p><button id="close">Close dialog</button></dialog><script>
const dialog=document.querySelector('#dialog');document.querySelector('#open').addEventListener('click',()=>dialog.showModal());document.querySelector('#close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});</script></body></html>
