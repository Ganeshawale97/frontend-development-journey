<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipboard Copy</title><style>body{font:16px system-ui;background:#fdf2f8;color:#831843;max-width:520px;margin:10vh auto;padding:20px}.card{padding:28px;background:white;border-radius:18px}textarea{width:100%;box-sizing:border-box;min-height:110px;padding:12px;border:1px solid #f9a8d4;border-radius:10px;font:inherit}button{margin-top:12px;padding:11px 18px;background:#be185d;color:white;border:0;border-radius:9px}</style><main class="card"><h1>Copy to clipboard</h1><textarea id="text">Learning frontend development one project at a time.</textarea><button id="copy">Copy text</button><p id="status" role="status"></p></main><script>const area=document.querySelector('#text'),status=document.querySelector('#status');document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(area.value);status.textContent='Copied to clipboard!'}catch{area.select();const ok=document.execCommand('copy');status.textContent=ok?'Copied!':'Clipboard blocked. Select and copy manually.'}});</script>
