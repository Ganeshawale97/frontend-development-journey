<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipboard Copy</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdf2f8;font:16px system-ui;color:#831843}.card{width:min(92vw,520px);padding:28px;background:white;border-radius:18px;box-shadow:0 16px 40px #83184318}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #f9a8d4;border-radius:10px;font:inherit}button{margin-top:12px;padding:11px 18px;border:0;border-radius:9px;background:#be185d;color:white;font:inherit;cursor:pointer}p{min-height:24px}</style></head><body><main class="card"><h1>Copy to clipboard</h1><p>Practise the Clipboard API with a fallback message.</p><textarea id="text">Learning frontend development one project at a time.</textarea><button id="copy">Copy text</button><p id="status" role="status"></p></main><script>
const textArea=document.querySelector('#text'),status=document.querySelector('#status');document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(textArea.value);status.textContent='Copied to clipboard!';}catch{ textArea.select();const ok=document.execCommand('copy');status.textContent=ok?'Copied!':'Clipboard access was blocked. Select and copy manually.';} });</script></body></html>
