<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyboard Shortcuts</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#ecfccb;color:#365314;font:16px system-ui}.wrap{max-width:700px;margin:auto}.box{padding:22px;margin:14px 0;background:white;border-radius:14px}kbd{display:inline-block;padding:3px 8px;border:1px solid #a3a3a3;border-bottom-width:3px;border-radius:5px;background:#f8fafc;color:#111827}#message{font-size:1.2rem;font-weight:700}</style></head><body><main class="wrap"><h1>Keyboard shortcut practice</h1><p>Try the shortcuts while this page is focused.</p><section class="box"><p><kbd>Ctrl</kbd> + <kbd>K</kbd> or <kbd>⌘</kbd> + <kbd>K</kbd> — focus the input</p><p><kbd>Escape</kbd> — clear the input</p><input id="search" placeholder="Shortcut focuses this field"></section><section class="box"><p id="message" aria-live="polite">Waiting for a shortcut…</p><p class="muted">Shortcuts ignore keystrokes inside other editable controls.</p></section></main><script>
const search=document.querySelector('#search'),message=document.querySelector('#message');document.addEventListener('keydown',e=>{const editing=e.target.matches('input,textarea,select,[contenteditable=true]');if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus();message.textContent='Search shortcut pressed';}else if(e.key==='Escape'&&!editing){search.value='';message.textContent='Input cleared';}});search.addEventListener('keydown',e=>{if(e.key==='Escape'){search.value='';message.textContent='Input cleared';}});</script></body></html>
