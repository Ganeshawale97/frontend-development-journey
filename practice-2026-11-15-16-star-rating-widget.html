<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Rating</title><style>body{font:16px system-ui;background:#fffbeb;color:#78350f;min-height:90vh;display:grid;place-items:center}.card{padding:30px;background:white;border-radius:18px;text-align:center}.stars{display:flex;gap:6px}.stars button{border:0;background:none;font-size:2.6rem;color:#d6d3d1;cursor:pointer}.stars button.selected{color:#f59e0b}</style><main class="card"><h1>Rate this experience</h1><div class="stars" role="group" aria-label="Choose a rating"><button aria-label="1 star" data-rating="1">★</button><button aria-label="2 stars" data-rating="2">★</button><button aria-label="3 stars" data-rating="3">★</button><button aria-label="4 stars" data-rating="4">★</button><button aria-label="5 stars" data-rating="5">★</button></div><p id="output" aria-live="polite">No rating selected</p></main><script>const stars=[...document.querySelectorAll('[data-rating]')],output=document.querySelector('#output');let rating=0;function paint(value){stars.forEach(b=>{b.classList.toggle('selected',Number(b.dataset.rating)<=value);b.setAttribute('aria-pressed',String(Number(b.dataset.rating)===rating))})}stars.forEach(b=>{b.addEventListener('click',()=>{rating=Number(b.dataset.rating);paint(rating);output.textContent='You selected '+rating+' out of 5 stars.'});b.addEventListener('mouseenter',()=>paint(Number(b.dataset.rating)));b.addEventListener('mouseleave',()=>paint(rating))});paint(0);</script>
