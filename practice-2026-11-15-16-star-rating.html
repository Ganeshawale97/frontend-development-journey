<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Rating</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffbeb;font:16px system-ui;color:#78350f}.card{padding:30px;background:white;border-radius:18px;box-shadow:0 14px 35px #78350f18;text-align:center}.stars{display:flex;gap:6px;justify-content:center}.stars button{border:0;background:none;font-size:2.6rem;color:#d6d3d1;cursor:pointer;padding:2px}.stars button.selected{color:#f59e0b}p{min-height:24px}</style></head><body><main class="card"><h1>Rate this experience</h1><div class="stars" role="group" aria-label="Choose a rating"><button aria-label="1 star" data-rating="1">★</button><button aria-label="2 stars" data-rating="2">★</button><button aria-label="3 stars" data-rating="3">★</button><button aria-label="4 stars" data-rating="4">★</button><button aria-label="5 stars" data-rating="5">★</button></div><p id="output" aria-live="polite">No rating selected</p></main><script>
const stars=[...document.querySelectorAll('[data-rating]')],output=document.querySelector('#output');let rating=0;function paint(value){stars.forEach(button=>{const active=Number(button.dataset.rating)<=value;button.classList.toggle('selected',active);button.setAttribute('aria-pressed',String(Number(button.dataset.rating)===rating));});}stars.forEach(button=>{button.addEventListener('click',()=>{rating=Number(button.dataset.rating);paint(rating);output.textContent='You selected '+rating+' out of 5 stars.';});button.addEventListener('mouseenter',()=>paint(Number(button.dataset.rating)));button.addEventListener('mouseleave',()=>paint(rating));});paint(0);</script></body></html>
