<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Visibility</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e0f2fe;color:#0c4a6e;font:16px system-ui}.card{width:min(92vw,440px);padding:28px;border-radius:18px;background:white;box-shadow:0 15px 40px #0c4a6e18}.field{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px;border:1px solid #7dd3fc;border-radius:9px;font:inherit}button{padding:10px 13px;border:0;border-radius:9px;background:#0369a1;color:white;cursor:pointer}</style></head><body><main class="card"><h1>Password visibility</h1><p>Toggle an input between password and text types.</p><label for="password">Password</label><div class="field"><input id="password" type="password" value="frontend123"><button id="toggle" type="button" aria-pressed="false">Show</button></div></main><script>
const input=document.querySelector('#password'),button=document.querySelector('#toggle');button.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'Hide':'Show';button.setAttribute('aria-pressed',String(show));});</script></body></html>
