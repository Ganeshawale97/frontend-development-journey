<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scroll to Top</title><style>html{scroll-behavior:smooth}body{margin:0;font:16px/1.7 system-ui;color:#1e293b}header{padding:55px 7vw;background:#dbeafe}main{max-width:760px;margin:auto;padding:24px}.top{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border:0;border-radius:50%;background:#1d4ed8;color:white;font-size:1.3rem;opacity:0;pointer-events:none;transition:.2s}.top.visible{opacity:1;pointer-events:auto}</style><header><h1>Scroll behavior demo</h1><p>Scroll down to reveal the back-to-top control.</p></header><main id="content"></main><button class="top" id="top" aria-label="Scroll to top">↑</button><script>const content=document.querySelector('#content');for(let i=1;i<=12;i++){const section=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p');h.textContent='Section '+i;p.textContent='Sample text makes the page scrollable. The scroll event controls the visibility of the back-to-top button.';section.append(h,p);content.append(section)}const button=document.querySelector('#top');window.addEventListener('scroll',()=>button.classList.toggle('visible',window.scrollY>300),{passive:true});button.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));</script>
