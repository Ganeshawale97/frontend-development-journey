<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrast Checker</title><style>body{font:16px system-ui;background:#f8fafc;color:#0f172a;max-width:560px;margin:10vh auto;padding:20px}.card{padding:24px;background:white;border-radius:18px;box-shadow:0 15px 40px #0001}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{display:block;width:100%;margin-top:6px}.sample{padding:25px;margin:18px 0;border-radius:12px;font-weight:700;text-align:center}.pass{color:#15803d}.fail{color:#b91c1c}</style><main class="card"><h1>Color contrast checker</h1><p>Check a text/background pair against WCAG AA.</p><div class="inputs"><label>Text color<input id="fg" type="color" value="#1e293b"></label><label>Background<input id="bg" type="color" value="#ffffff"></label></div><div id="sample" class="sample">Readable interface text preview</div><p id="ratio" aria-live="polite"></p><p id="result"></p></main><script>const fg=document.querySelector('#fg'),bg=document.querySelector('#bg'),sample=document.querySelector('#sample');function lum(hex){const c=hex.slice(1).match(/.{2}/g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]}function update(){sample.style.color=fg.value;sample.style.background=bg.value;const a=lum(fg.value),b=lum(bg.value),r=(Math.max(a,b)+.05)/(Math.min(a,b)+.05),ok=r>=4.5;document.querySelector('#ratio').textContent='Contrast ratio: '+r.toFixed(2)+':1';const out=document.querySelector('#result');out.textContent=ok?'Passes WCAG AA for normal text.':'Needs 4.5:1 for WCAG AA normal text.';out.className=ok?'pass':'fail'}fg.addEventListener('input',update);bg.addEventListener('input',update);update();</script>
