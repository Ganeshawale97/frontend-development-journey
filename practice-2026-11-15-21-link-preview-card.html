<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Preview</title><style>body{font:16px system-ui;background:#ecfdf5;color:#064e3b;max-width:460px;margin:10vh auto;padding:20px}.card{background:white;padding:28px;border-radius:20px;box-shadow:0 16px 40px #064e3b18}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #a7f3d0;border-radius:9px;font:inherit}button{margin-top:12px;padding:11px 16px;background:#047857;color:white;border:0;border-radius:9px}.preview{margin-top:20px;padding:14px;background:#f0fdf4;border-radius:12px;overflow-wrap:anywhere}</style><main class="card"><h1>Link preview card</h1><p>Enter a URL to build a safe clickable preview.</p><form id="form"><input id="url" type="url" placeholder="https://example.com" required><button>Preview link</button></form><section id="preview" class="preview" aria-live="polite">Your preview will appear here.</section></main><script>const form=document.querySelector('#form'),field=document.querySelector('#url'),preview=document.querySelector('#preview');form.addEventListener('submit',e=>{e.preventDefault();try{const url=new URL(field.value);if(!['http:','https:'].includes(url.protocol))throw Error();preview.replaceChildren();const title=document.createElement('strong'),host=document.createElement('p'),link=document.createElement('a');title.textContent='Link ready';host.textContent='Domain: '+url.hostname;link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent=url.href;preview.append(title,host,link)}catch{preview.textContent='Enter a valid http or https URL.'}});</script>
