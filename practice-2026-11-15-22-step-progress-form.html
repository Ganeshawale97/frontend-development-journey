<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-step Form</title><style>body{font:16px system-ui;background:#eef2ff;color:#1e1b4b;max-width:520px;margin:8vh auto;padding:20px}.card{background:white;padding:28px;border-radius:18px;box-shadow:0 16px 40px #312e8118}.track{height:8px;background:#e0e7ff;border-radius:10px;overflow:hidden}.fill{height:100%;width:50%;background:#4f46e5}label{display:block;margin:10px 0 5px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #c7d2fe;border-radius:8px;font:inherit}.actions{display:flex;justify-content:space-between;margin-top:18px}button{padding:10px 16px;border:0;border-radius:8px;background:#4338ca;color:white}button:disabled{opacity:.4}</style><main class="card"><h1>Profile setup</h1><p id="label">Step 1 of 2</p><div class="track"><div class="fill" id="fill"></div></div><form id="form"><section id="one"><label for="name">Your name</label><input id="name" required minlength="2" placeholder="Alex Morgan"><label for="role">Your role</label><input id="role" required placeholder="Frontend learner"></section><section id="two" hidden><label for="goal">Learning goal</label><input id="goal" required placeholder="Build accessible web apps"><p>Review your details before finishing.</p></section><div class="actions"><button type="button" id="back" disabled>Back</button><button type="button" id="next">Continue</button><button type="submit" id="finish" hidden>Finish</button></div></form><p id="status" aria-live="polite"></p></main><script>let step=1;const form=document.querySelector('#form'),back=document.querySelector('#back'),next=document.querySelector('#next'),finish=document.querySelector('#finish');function show(){one.hidden=step!==1;two.hidden=step!==2;back.disabled=step===1;next.hidden=step===2;finish.hidden=step!==2;fill.style.width=step===1?'50%':'100%';label.textContent='Step '+step+' of 2'}next.addEventListener('click',()=>{if([...one.querySelectorAll('input')].every(x=>x.reportValidity())){step=2;show()}});back.addEventListener('click',()=>{step=1;show()});form.addEventListener('submit',e=>{e.preventDefault();if(form.reportValidity())status.textContent='Setup complete. Welcome, '+name.value+'!'});show();</script>
