<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Snippet Switcher</title><style>body{font:16px system-ui;background:#111827;color:#e5e7eb;max-width:680px;margin:10vh auto;padding:20px}.card{padding:24px;background:#1f2937;border-radius:18px}.tabs{display:flex;gap:8px}.tabs button,.copy{padding:9px 14px;border:0;border-radius:8px;background:#374151;color:white}.tabs .active{background:#4f46e5}pre{padding:18px;background:#030712;border-radius:10px;overflow:auto;min-height:90px}</style><main class="card"><h1>Code snippet switcher</h1><p>Switch snippets and copy the selected code.</p><div class="tabs"><button class="active" data-key="html">HTML</button><button data-key="css">CSS</button><button data-key="js">JavaScript</button></div><pre><code id="code"></code></pre><button class="copy" id="copy">Copy code</button><p id="status" aria-live="polite"></p></main><script>const snippets={html:'<button class="hello">Say hello</button>',css:'.hello { padding: 12px 18px; border-radius: 8px; }',js:'document.querySelector(".hello").addEventListener("click", () => alert("Hello!"));'},buttons=[...document.querySelectorAll('[data-key]')],code=document.querySelector('#code');let selected='html';function render(){code.textContent=snippets[selected];buttons.forEach(b=>b.classList.toggle('active',b.dataset.key===selected))}buttons.forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.key;render()}));document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(snippets[selected]);status.textContent='Copied '+selected.toUpperCase()+' snippet.'}catch{status.textContent='Clipboard unavailable. Select the code and copy manually.'}});render();</script>
