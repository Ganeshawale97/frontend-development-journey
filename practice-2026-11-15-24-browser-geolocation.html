<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geolocation Demo</title><style>body{font:16px system-ui;background:#f0fdfa;color:#134e4a;max-width:500px;margin:10vh auto;padding:20px}.card{padding:28px;background:white;border-radius:18px;box-shadow:0 15px 40px #134e4a18}button{padding:11px 16px;background:#0f766e;color:white;border:0;border-radius:9px}pre{white-space:pre-wrap;background:#f0fdfa;padding:14px;border-radius:10px}</style><main class="card"><h1>Browser geolocation</h1><p>Location is requested only after you press the button. HTTPS or localhost required.</p><button id="locate">Get my coordinates</button><p id="status" role="status">Location has not been requested.</p><pre id="output"></pre></main><script>const status=document.querySelector('#status'),output=document.querySelector('#output');document.querySelector('#locate').addEventListener('click',()=>{output.textContent='';if(!navigator.geolocation){status.textContent='Geolocation is not supported.';return}status.textContent='Waiting for permission…';navigator.geolocation.getCurrentPosition(p=>{status.textContent='Location received.';output.textContent='Latitude: '+p.coords.latitude.toFixed(5)+'\nLongitude: '+p.coords.longitude.toFixed(5)+'\nAccuracy: '+Math.round(p.coords.accuracy)+' metres'},e=>{status.textContent=e.code===1?'Permission denied.':e.code===2?'Position unavailable.':'Request timed out.'},{timeout:10000,maximumAge:60000})});</script>
