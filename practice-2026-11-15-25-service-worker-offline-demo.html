<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline-ready Page</title><style>body{font:16px system-ui;background:#f1f5f9;color:#0f172a;max-width:520px;margin:10vh auto;padding:20px}.card{background:white;padding:28px;border-radius:18px;box-shadow:0 15px 40px #0f172a12}button{padding:11px 16px;border:0;border-radius:9px;background:#0f172a;color:white}</style><main class="card"><h1>Offline-ready page</h1><p>Feature detection and service worker registration require HTTPS or localhost.</p><button id="register">Check service worker support</button><p id="status" aria-live="polite">No registration attempted.</p><pre id="details"></pre></main><script>document.querySelector('#register').addEventListener('click',async()=>{const status=document.querySelector('#status'),details=document.querySelector('#details');if(!('serviceWorker'in navigator)){status.textContent='Service workers are not supported.';return}if(location.protocol!=='https:'&&location.hostname!=='localhost'){status.textContent='Open this page over HTTPS or localhost to register a service worker.';return}try{status.textContent='Registering ./sw.js…';const registration=await navigator.serviceWorker.register('./sw.js');status.textContent='Service worker registration completed.';details.textContent='Scope: '+registration.scope+'\nAdd a sw.js file with install/fetch handlers to cache assets offline.'}catch(error){status.textContent='Registration failed. Add sw.js beside this page.';details.textContent=error.message}});</script>
