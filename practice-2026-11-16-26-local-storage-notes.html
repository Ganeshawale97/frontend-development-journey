<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Notes</title><style>body{font:16px system-ui;background:#f3f5fa;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.app{background:white;padding:26px;border-radius:16px;width:min(520px,100%)}form{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px}button{padding:10px;border:0;border-radius:8px;background:#334fe0;color:white;cursor:pointer}li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}</style></head><body><main class="app"><h1>Quick Notes</h1><p>Notes are saved in this browser.</p><form id="form"><input id="note" maxlength="120" placeholder="Write a note" required><button>Add</button></form><ul id="notes"></ul></main><script>const key='practice-notes';let notes=JSON.parse(localStorage.getItem(key)||'[]');const list=document.querySelector('#notes');function render(){list.replaceChildren();notes.forEach((note,i)=>{const li=document.createElement('li'),span=document.createElement('span'),button=document.createElement('button');span.textContent=note;button.textContent='Delete';button.onclick=()=>{notes.splice(i,1);save()};li.append(span,button);list.append(li)})}function save(){localStorage.setItem(key,JSON.stringify(notes));render()}document.querySelector('#form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#note');notes.unshift(input.value.trim());input.value='';save()};render();</script></body></html>
