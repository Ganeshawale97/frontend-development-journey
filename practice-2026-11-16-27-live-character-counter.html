<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Counter</title><style>body{font:16px system-ui;background:#eef2ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.panel{background:white;padding:28px;border-radius:18px;width:min(520px,100%)}textarea{width:100%;min-height:160px;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;box-sizing:border-box}footer{display:flex;justify-content:space-between;margin-top:10px;color:#475569}.warn{color:#dc2626;font-weight:700}</style></head><body><main class="panel"><h1>Message composer</h1><p>Maximum 180 characters.</p><textarea id="message" maxlength="180" placeholder="Type your message…"></textarea><footer><span id="feedback">0 / 180 characters</span><span id="remaining">180 left</span></footer></main><script>const field=document.querySelector('#message'),feedback=document.querySelector('#feedback'),remaining=document.querySelector('#remaining');field.addEventListener('input',()=>{const count=field.value.length,left=180-count;feedback.textContent=count+' / 180 characters';remaining.textContent=left+' left';remaining.classList.toggle('warn',left<20)});</script></body></html>
