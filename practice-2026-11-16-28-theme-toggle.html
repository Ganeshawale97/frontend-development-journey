<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme Toggle</title><style>:root{color-scheme:light;--bg:#f8fafc;--fg:#182230;--card:white}body.dark{color-scheme:dark;--bg:#111827;--fg:#f8fafc;--card:#1f2937}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px system-ui}.card{background:var(--card);padding:32px;border-radius:18px;width:min(440px,90%)}button{padding:12px 18px;border:0;border-radius:9px;background:#4f46e5;color:white;cursor:pointer}</style></head><body><main class="card"><h1>Theme switcher</h1><p>Change appearance and keep your choice after refresh.</p><button id="toggle" aria-pressed="false">Enable dark mode</button></main><script>const button=document.querySelector('#toggle');function apply(dark){document.body.classList.toggle('dark',dark);button.textContent=dark?'Enable light mode':'Enable dark mode';button.setAttribute('aria-pressed',String(dark));localStorage.setItem('preferred-theme',dark?'dark':'light')}button.addEventListener('click',()=>apply(!document.body.classList.contains('dark')));apply(localStorage.getItem('preferred-theme')==='dark');</script></body></html>
