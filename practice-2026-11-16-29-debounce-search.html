<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debounced Search</title><style>body{font:16px system-ui;background:#f1f5f9;margin:0;padding:40px 18px}.wrap{max-width:620px;margin:auto;background:white;padding:26px;border-radius:16px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;box-sizing:border-box}li{padding:9px;border-bottom:1px solid #e2e8f0}.muted{color:#64748b}</style></head><body><main class="wrap"><h1>Search developers</h1><input id="search" type="search" placeholder="Search by name…"><p id="status" class="muted">Start typing to filter.</p><ul id="results"></ul></main><script>const people=['Aarav Sharma','Aditi Patil','Ishaan Mehta','Kavya Desai','Rohan Kulkarni','Sara Khan','Vedant Joshi'],input=document.querySelector('#search'),list=document.querySelector('#results'),status=document.querySelector('#status');let timer;function render(query){const matches=people.filter(name=>name.toLowerCase().includes(query.toLowerCase()));list.replaceChildren();matches.forEach(name=>{const li=document.createElement('li');li.textContent=name;list.append(li)});status.textContent=matches.length+' result(s)'}input.addEventListener('input',()=>{clearTimeout(timer);status.textContent='Searching…';timer=setTimeout(()=>render(input.value.trim()),300)});render('');</script></body></html>
