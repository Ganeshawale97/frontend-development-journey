<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Strength Meter</title><style>body{font:16px system-ui;background:#f8fafc;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:28px;border-radius:16px;width:min(480px,100%)}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;box-sizing:border-box}.track{height:9px;background:#e2e8f0;border-radius:99px;margin:15px 0;overflow:hidden}.fill{height:100%;width:0;background:#ef4444;transition:.2s}</style></head><body><main class="card"><h1>Password strength</h1><label for="password">Try a password</label><input id="password" type="password" autocomplete="new-password" placeholder="Enter password"><div class="track"><div class="fill" id="fill"></div></div><strong id="label">Strength: —</strong><p>Use length, mixed case, numbers, and symbols.</p></main><script>const input=document.querySelector('#password'),fill=document.querySelector('#fill'),label=document.querySelector('#label');input.addEventListener('input',()=>{const p=input.value;let score=0;if(p.length>=8)score++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))score++;if(/\d/.test(p))score++;if(/[^A-Za-z0-9]/.test(p))score++;const levels=['Very weak','Weak','Fair','Good','Strong'];fill.style.width=(score*25)+'%';fill.style.background=['#ef4444','#f97316','#eab308','#22c55e','#15803d'][score];label.textContent='Strength: '+(p?levels[score]:'—')});</script></body></html>
