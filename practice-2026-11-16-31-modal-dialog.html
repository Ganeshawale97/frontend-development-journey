<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modal Dialog</title><style>body{font:16px system-ui;background:#f1f5f9;min-height:100vh;display:grid;place-items:center;margin:0}.box{background:white;padding:32px;border-radius:16px}button{padding:11px 16px;border:0;border-radius:8px;background:#334fe0;color:white;cursor:pointer}dialog{border:0;border-radius:14px;padding:26px;max-width:360px;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#10182899}</style></head><body><main class="box"><h1>Dialog example</h1><button id="open">Open details</button></main><dialog id="dialog" aria-labelledby="heading"><h2 id="heading">Welcome!</h2><p>This is a native HTML dialog. Press Escape or close it with the button.</p><button id="close">Close dialog</button></dialog><script>const dialog=document.querySelector('#dialog');document.querySelector('#open').addEventListener('click',()=>dialog.showModal());document.querySelector('#close').addEventListener('click',()=>dialog.close());</script></body></html>
