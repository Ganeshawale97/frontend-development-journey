<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabs Component</title><style>body{font:16px system-ui;background:#f8fafc;padding:40px 18px}.tabs{max-width:600px;margin:auto;background:white;padding:24px;border-radius:16px}.tablist{display:flex;gap:8px;border-bottom:1px solid #ddd}.tab{background:transparent;color:#334155;border-radius:8px 8px 0 0}.tab[aria-selected=true]{background:#e0e7ff;color:#3730a3}button{padding:10px 14px;border:0;cursor:pointer}</style></head><body><main class="tabs"><h1>Learning paths</h1><div class="tablist" role="tablist" aria-label="Learning paths"><button class="tab" role="tab" aria-selected="true" aria-controls="panel-html" id="tab-html">HTML</button><button class="tab" role="tab" aria-selected="false" aria-controls="panel-css" id="tab-css" tabindex="-1">CSS</button><button class="tab" role="tab" aria-selected="false" aria-controls="panel-js" id="tab-js" tabindex="-1">JavaScript</button></div><section id="panel-html" role="tabpanel" aria-labelledby="tab-html"><h2>HTML</h2><p>Build meaningful page structure with semantic elements.</p></section><section id="panel-css" role="tabpanel" aria-labelledby="tab-css" hidden><h2>CSS</h2><p>Style pages with layouts, typography, and responsive rules.</p></section><section id="panel-js" role="tabpanel" aria-labelledby="tab-js" hidden><h2>JavaScript</h2><p>Add interaction and dynamic behaviour to your pages.</p></section></main><script>const tabs=[...document.querySelectorAll('[role=tab]')],panels=[...document.querySelectorAll('[role=tabpanel]')];function activate(tab){tabs.forEach(t=>{const active=t===tab;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1});panels.forEach(p=>p.hidden=p.id!==tab.getAttribute('aria-controls'));tab.focus()}tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>activate(tab));tab.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();activate(tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length])}})});</script></body></html>
