<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery Filter</title><style>body{font:16px system-ui;background:#f1f5f9;margin:0;padding:30px}.wrap{max-width:850px;margin:auto}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{padding:9px 14px;border:0;border-radius:20px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:20px}.tile{min-height:140px;border-radius:14px;display:grid;place-items:center;color:white;font-weight:700;font-size:20px}.nature{background:linear-gradient(135deg,#166534,#86efac)}.city{background:linear-gradient(135deg,#1e3a8a,#93c5fd)}.art{background:linear-gradient(135deg,#86198f,#f0abfc)}</style></head><body><main class="wrap"><h1>Explore gallery</h1><div class="filters" aria-label="Filter gallery"><button data-filter="all">All</button><button data-filter="nature">Nature</button><button data-filter="city">City</button><button data-filter="art">Art</button></div><div class="grid" id="gallery"><div class="tile nature" data-category="nature">Forest</div><div class="tile city" data-category="city">Skyline</div><div class="tile art" data-category="art">Abstract</div><div class="tile nature" data-category="nature">Mountains</div><div class="tile city" data-category="city">Street</div><div class="tile art" data-category="art">Shapes</div></div></main><script>const tiles=[...document.querySelectorAll('.tile')];document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{const filter=button.dataset.filter;tiles.forEach(tile=>tile.hidden=filter!=='all'&&tile.dataset.category!==filter)}));</script></body></html>
