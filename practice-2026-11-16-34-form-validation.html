<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Validation</title><style>body{font:16px system-ui;background:#eef2ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:28px;border-radius:16px;width:min(480px,100%)}label{display:block;margin-top:14px}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}button{margin-top:18px;padding:11px 16px;border:0;border-radius:8px;background:#4338ca;color:white}.error{color:#b91c1c}.success{color:#166534}</style></head><body><main class="card"><h1>Create account</h1><form id="form" novalidate><label for="name">Name</label><input id="name" required minlength="2"><label for="email">Email</label><input id="email" type="email" required><label for="password">Password</label><input id="password" type="password" minlength="8" required><button>Create account</button></form><p id="message" role="status"></p></main><script>const form=document.querySelector('#form'),message=document.querySelector('#message');form.addEventListener('submit',e=>{e.preventDefault();if(!form.checkValidity()){message.className='error';message.textContent='Please enter a valid name, email, and password of at least 8 characters.';form.reportValidity();return}message.className='success';message.textContent='Form validated successfully! This demo does not submit data.'});</script></body></html>
