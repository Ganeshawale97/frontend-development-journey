<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetch API Demo</title><style>body{font:16px system-ui;background:#f8fafc;padding:36px 18px}.card{max-width:620px;margin:auto;background:white;padding:26px;border-radius:16px}button{padding:11px 16px;background:#334fe0;color:white;border:0;border-radius:8px;cursor:pointer}li{padding:8px 0;border-bottom:1px solid #eee}.error{color:#b91c1c}</style></head><body><main class="card"><h1>Fetch API demo</h1><p>Load sample posts from a public demo endpoint.</p><button id="load">Load posts</button><p id="status" role="status"></p><ul id="posts"></ul></main><script>const button=document.querySelector('#load'),status=document.querySelector('#status'),list=document.querySelector('#posts');button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Loading posts…';status.className='';list.replaceChildren();try{const response=await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');if(!response.ok)throw new Error('Request failed: '+response.status);const posts=await response.json();posts.forEach(post=>{const li=document.createElement('li'),title=document.createElement('strong'),body=document.createElement('p');title.textContent=post.title;body.textContent=post.body;li.append(title,body);list.append(li)});status.textContent='Loaded '+posts.length+' posts.'}catch(error){status.textContent='Could not load posts. Check your connection and try again.';status.className='error'}finally{button.disabled=false}});</script></body></html>
