<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><style>body{font:16px system-ui;background:#f1f5f9;margin:0;padding:28px}.app{max-width:650px;margin:auto;background:white;padding:24px;border-radius:16px}form{display:flex;gap:8px;flex-wrap:wrap}input{padding:11px;min-width:0;flex:1}button{padding:10px 14px;border:0;border-radius:8px;background:#334fe0;color:white;cursor:pointer}.total{font-size:1.6rem;font-weight:700}li{padding:10px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:10px}</style></head><body><main class="app"><h1>Expense tracker</h1><p>Total spent</p><div class="total" id="total">₹0.00</div><form id="form"><input id="title" placeholder="Expense name" required><input id="amount" type="number" min=".01" step=".01" placeholder="Amount ₹" required><button>Add expense</button></form><ul id="list"></ul></main><script>let expenses=JSON.parse(localStorage.getItem('expenses-demo')||'[]');const list=document.querySelector('#list'),total=document.querySelector('#total');function render(){list.replaceChildren();let sum=0;expenses.forEach((e,i)=>{sum+=e.amount;const li=document.createElement('li'),span=document.createElement('span'),del=document.createElement('button');span.textContent=e.title+' — ₹'+e.amount.toFixed(2);del.textContent='Remove';del.onclick=()=>{expenses.splice(i,1);save()};li.append(span,del);list.append(li)});total.textContent='₹'+sum.toFixed(2)}function save(){localStorage.setItem('expenses-demo',JSON.stringify(expenses));render()}document.querySelector('#form').onsubmit=e=>{e.preventDefault();expenses.push({title:document.querySelector('#title').value.trim(),amount:Number(document.querySelector('#amount').value)});e.target.reset();save()};render();</script></body></html>
