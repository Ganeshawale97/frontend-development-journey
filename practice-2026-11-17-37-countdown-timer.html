<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Timer</title><style>body{font:16px system-ui;background:#111827;color:white;min-height:100vh;display:grid;place-items:center;margin:0}.box{text-align:center;padding:28px}input,button{padding:12px;border:0;border-radius:8px;margin:4px}button{background:#818cf8;color:#111827;cursor:pointer}.time{font-size:clamp(3rem,12vw,6rem);font-variant-numeric:tabular-nums}</style></head><body><main class="box"><h1>Focus countdown</h1><input id="minutes" type="number" min="1" max="180" value="5" aria-label="Minutes"><button id="start">Start</button><button id="reset">Reset</button><div class="time" id="display">05:00</div><p id="status" role="status">Ready when you are.</p></main><script>let remaining=300,interval=null;const display=document.querySelector('#display'),status=document.querySelector('#status');function draw(){display.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}document.querySelector('#start').onclick=()=>{if(interval)return;if(remaining<=0)remaining=Number(document.querySelector('#minutes').value)*60;status.textContent='Timer running';interval=setInterval(()=>{remaining--;draw();if(remaining<=0){clearInterval(interval);interval=null;status.textContent='Time is up!'}},1000)};document.querySelector('#reset').onclick=()=>{clearInterval(interval);interval=null;remaining=Math.max(1,Number(document.querySelector('#minutes').value))*60;draw();status.textContent='Timer reset'};document.querySelector('#minutes').onchange=()=>{if(!interval){remaining=Math.max(1,Number(document.querySelector('#minutes').value))*60;draw()}};draw();</script></body></html>
