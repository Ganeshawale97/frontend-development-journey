<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontend Quiz</title><style>body{font:16px system-ui;background:#eef2ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:28px;border-radius:16px;width:min(520px,100%)}button{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid #cbd5e1;border-radius:8px;background:white;cursor:pointer}.primary{background:#4338ca;color:white;text-align:center}</style></head><body><main class="card"><h1>Frontend quiz</h1><p id="progress"></p><h2 id="question"></h2><div id="answers"></div><p id="feedback" role="status"></p><button class="primary" id="next" hidden>Next question</button></main><script>const data=[{q:'Which tag creates a hyperlink?',a:['<a>','<p>','<link>'],correct:0},{q:'Which CSS property changes text colour?',a:['font-style','color','background'],correct:1},{q:'Which keyword declares a block-scoped variable?',a:['var','let','print'],correct:1}];let index=0,score=0,answered=false;const question=document.querySelector('#question'),answers=document.querySelector('#answers'),feedback=document.querySelector('#feedback'),next=document.querySelector('#next');function render(){answered=false;next.hidden=true;feedback.textContent='';document.querySelector('#progress').textContent='Question '+(index+1)+' of '+data.length;question.textContent=data[index].q;answers.replaceChildren();data[index].a.forEach((answer,i)=>{const b=document.createElement('button');b.textContent=answer;b.onclick=()=>{if(answered)return;answered=true;if(i===data[index].correct){score++;feedback.textContent='Correct!'}else feedback.textContent='Not quite. Correct answer: '+data[index].a[data[index].correct];next.hidden=false};answers.append(b)})}next.onclick=()=>{index++;if(index<data.length)render();else{question.textContent='Quiz complete!';answers.replaceChildren();feedback.textContent='Your score: '+score+' / '+data.length;next.hidden=true}};render();</script></body></html>
