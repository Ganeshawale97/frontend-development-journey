<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sortable Table</title><style>body{font:16px system-ui;background:#f8fafc;padding:30px 16px}.wrap{max-width:700px;margin:auto;background:white;padding:24px;border-radius:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}th button{border:0;background:transparent;font:inherit;font-weight:700;cursor:pointer}</style></head><body><main class="wrap"><h1>Student directory</h1><p>Select a column heading to sort.</p><table><thead><tr><th><button data-key="name">Name ↕</button></th><th><button data-key="course">Course ↕</button></th><th><button data-key="score">Score ↕</button></th></tr></thead><tbody id="body"></tbody></table></main><script>const students=[{name:'Aarav',course:'HTML',score:82},{name:'Meera',course:'JavaScript',score:94},{name:'Kabir',course:'CSS',score:76},{name:'Diya',course:'JavaScript',score:88}];let direction=1;const body=document.querySelector('#body');function render(key='name'){const sorted=[...students].sort((a,b)=>typeof a[key]==='number'?(a[key]-b[key])*direction:a[key].localeCompare(b[key])*direction);body.replaceChildren();sorted.forEach(s=>{const tr=document.createElement('tr');[s.name,s.course,s.score].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td)});body.append(tr)})}document.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>{direction*=-1;render(button.dataset.key)});render();</script></body></html>
