<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copy to Clipboard</title><style>body{font:16px system-ui;background:#ecfeff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:28px;border-radius:16px;width:min(500px,100%)}code{display:block;padding:18px;background:#f1f5f9;border-radius:9px;overflow-wrap:anywhere}button{margin-top:14px;padding:11px 16px;background:#0e7490;color:white;border:0;border-radius:8px;cursor:pointer}</style></head><body><main class="card"><h1>Copy invite code</h1><p>Share this sample code with your team:</p><code id="value">FRONTEND-2026-START</code><button id="copy">Copy code</button><p id="status" role="status"></p></main><script>const value=document.querySelector('#value').textContent,button=document.querySelector('#copy'),status=document.querySelector('#status');button.onclick=async()=>{try{await navigator.clipboard.writeText(value);status.textContent='Copied to clipboard!'}catch{status.textContent='Clipboard access is unavailable. Select and copy the code manually.'}};</script></body></html>
