<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Rating</title><style>body{font:16px system-ui;background:#f8fafc;min-height:100vh;display:grid;place-items:center;margin:0}.card{background:white;padding:30px;border-radius:16px;text-align:center}.stars{display:flex;gap:8px}.stars button{font-size:2.5rem;border:0;background:transparent;color:#cbd5e1;cursor:pointer}.stars button.active{color:#f59e0b}</style></head><body><main class="card"><h1>Rate this experience</h1><div class="stars" role="group" aria-label="Star rating"><button aria-label="1 star" data-rating="1">★</button><button aria-label="2 stars" data-rating="2">★</button><button aria-label="3 stars" data-rating="3">★</button><button aria-label="4 stars" data-rating="4">★</button><button aria-label="5 stars" data-rating="5">★</button></div><p id="result" aria-live="polite">No rating selected</p></main><script>let rating=0;const buttons=[...document.querySelectorAll('[data-rating]')],result=document.querySelector('#result');buttons.forEach(button=>button.onclick=()=>{rating=Number(button.dataset.rating);buttons.forEach(b=>{const active=Number(b.dataset.rating)<=rating;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(Number(b.dataset.rating)===rating))});result.textContent='You selected '+rating+' out of 5 stars'});</script></body></html>
