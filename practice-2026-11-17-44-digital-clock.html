<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Clock</title><style>body{font:16px system-ui;background:#0f172a;color:#e2e8f0;min-height:100vh;display:grid;place-items:center;margin:0}.clock{text-align:center;padding:30px}.time{font-size:clamp(3rem,13vw,7rem);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:#67e8f9}.date{font-size:1.2rem;color:#cbd5e1}</style></head><body><main class="clock"><h1>Local time</h1><div class="time" id="time" aria-live="off">--:--:--</div><p class="date" id="date"></p></main><script>const time=document.querySelector('#time'),date=document.querySelector('#date');function update(){const now=new Date();time.textContent=now.toLocaleTimeString();date.textContent=now.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}update();setInterval(update,1000);</script></body></html>
