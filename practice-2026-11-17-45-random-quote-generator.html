<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote Generator</title><style>body{font:17px system-ui;background:#f5f3ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{max-width:560px;background:white;padding:32px;border-radius:18px;box-shadow:0 12px 35px #312e8115}blockquote{font-size:1.4rem;line-height:1.5;margin:20px 0}button{padding:12px 18px;border:0;border-radius:9px;background:#6d28d9;color:white;cursor:pointer}</style></head><body><main class="card"><h1>Daily inspiration</h1><blockquote id="quote">Small steps make meaningful progress.</blockquote><button id="new">New quote</button></main><script>const quotes=['Small steps make meaningful progress.','Practice turns knowledge into skill.','Great things are done by a series of small things brought together.','Stay curious and keep building.','Consistency is more powerful than intensity.'];let previous=-1;document.querySelector('#new').onclick=()=>{let next;do{next=Math.floor(Math.random()*quotes.length)}while(next===previous&&quotes.length>1);previous=next;document.querySelector('#quote').textContent=quotes[next]};</script></body></html>
