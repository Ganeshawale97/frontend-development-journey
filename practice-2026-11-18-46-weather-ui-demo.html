<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Dashboard UI</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0f172a,#334155);font:16px system-ui;color:#fff;padding:20px}.card{width:min(440px,100%);padding:28px;border:1px solid #ffffff30;border-radius:24px;background:#ffffff14;backdrop-filter:blur(12px)}form{display:flex;gap:8px}input{min-width:0;flex:1;padding:12px;border-radius:9px;border:0}button{padding:12px;border:0;border-radius:9px;background:#fbbf24;color:#1e293b;font-weight:700;cursor:pointer}.temp{font-size:4rem;font-weight:700;margin:12px 0}.muted{color:#cbd5e1}</style></head><body><main class="card"><h1>Weather overview</h1><form id="form"><input id="city" placeholder="Enter a city" value="Pune" required><button>Show</button></form><p class="muted" id="location">Pune · Demo data</p><div class="temp" id="temp">28°</div><h2 id="condition">Partly cloudy ☁️</h2><p class="muted">This is a static UI exercise; no live weather API is connected.</p><p>Humidity: 62% &nbsp; Wind: 12 km/h</p></main><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();const city=document.querySelector('#city').value.trim();if(city)document.querySelector('#location').textContent=city+' · Demo data'};</script></body></html>
