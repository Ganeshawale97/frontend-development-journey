<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Carousel</title><style>body{font:16px system-ui;background:#f1f5f9;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.carousel{width:min(620px,100%);background:white;padding:20px;border-radius:18px;text-align:center}.slide{height:280px;border-radius:12px;display:grid;place-items:center;color:white;font-size:2rem;font-weight:700;background:linear-gradient(135deg,#0f766e,#99f6e4)}.controls{display:flex;justify-content:center;gap:12px;margin-top:16px}button{padding:10px 16px;border:0;border-radius:8px;background:#0f766e;color:white;cursor:pointer}</style></head><body><main class="carousel" aria-roledescription="carousel"><h1>CSS gradient gallery</h1><div class="slide" id="slide" role="img" aria-label="Ocean gradient">Ocean</div><p id="count" aria-live="polite">1 of 4</p><div class="controls"><button id="prev">Previous</button><button id="next">Next</button></div></main><script>const slides=[['Ocean','linear-gradient(135deg,#0f766e,#99f6e4)'],['Sunset','linear-gradient(135deg,#be123c,#fdba74)'],['Forest','linear-gradient(135deg,#14532d,#bef264)'],['Galaxy','linear-gradient(135deg,#312e81,#c4b5fd)']];let index=0;const slide=document.querySelector('#slide'),count=document.querySelector('#count');function render(){slide.textContent=slides[index][0];slide.style.background=slides[index][1];slide.setAttribute('aria-label',slides[index][0]);count.textContent=(index+1)+' of '+slides.length}document.querySelector('#prev').onclick=()=>{index=(index-1+slides.length)%slides.length;render()};document.querySelector('#next').onclick=()=>{index=(index+1)%slides.length;render()};render();</script></body></html>
