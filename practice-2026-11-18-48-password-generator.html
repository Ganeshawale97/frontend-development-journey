<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><style>body{font:16px system-ui;background:#eff6ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{width:min(480px,100%);background:white;padding:28px;border-radius:16px}input[type=text]{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}label{display:block;margin:12px 0}button{padding:12px 16px;border:0;border-radius:8px;background:#1d4ed8;color:white;cursor:pointer}</style></head><body><main class="card"><h1>Password generator</h1><label for="length">Length: <output id="lengthValue">16</output></label><input id="length" type="range" min="8" max="32" value="16"><label><input id="numbers" type="checkbox" checked> Include numbers</label><label><input id="symbols" type="checkbox" checked> Include symbols</label><input id="result" type="text" readonly aria-label="Generated password"><p><button id="generate">Generate password</button> <button id="copy">Copy</button></p><p id="status" role="status"></p></main><script>const length=document.querySelector('#length'),output=document.querySelector('#lengthValue'),result=document.querySelector('#result'),status=document.querySelector('#status');length.oninput=()=>output.value=length.value;function generate(){let chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';if(document.querySelector('#numbers').checked)chars+='0123456789';if(document.querySelector('#symbols').checked)chars+='!@#$%^&*()-_=+';const bytes=new Uint32Array(Number(length.value));crypto.getRandomValues(bytes);result.value=Array.from(bytes,n=>chars[n%chars.length]).join('');status.textContent='New password generated.'}document.querySelector('#generate').onclick=generate;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(result.value);status.textContent='Copied.'}catch{status.textContent='Clipboard unavailable; select the password to copy.'}};generate();</script></body></html>
