<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drag and Drop List</title><style>body{font:16px system-ui;background:#f8fafc;padding:30px 18px}.card{max-width:520px;margin:auto;background:white;padding:24px;border-radius:16px}li{list-style:none;padding:14px;margin:8px 0;background:#e0e7ff;border-radius:9px;cursor:grab}li.dragging{opacity:.4}ul{padding:0}.hint{color:#64748b}</style></head><body><main class="card"><h1>Reorder your tasks</h1><p class="hint">Drag an item to change its position.</p><ul id="list"><li draggable="true">Plan the project</li><li draggable="true">Create the wireframe</li><li draggable="true">Build the interface</li><li draggable="true">Test on mobile</li></ul></main><script>const list=document.querySelector('#list');let dragged=null;list.addEventListener('dragstart',e=>{if(e.target.tagName!=='LI')return;dragged=e.target;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move'});list.addEventListener('dragend',()=>{if(dragged)dragged.classList.remove('dragging');dragged=null});list.addEventListener('dragover',e=>{e.preventDefault();const target=e.target.closest('li');if(!target||!dragged||target===dragged)return;const rect=target.getBoundingClientRect();list.insertBefore(dragged,e.clientY<rect.top+rect.height/2?target:target.nextSibling)});</script></body></html>
