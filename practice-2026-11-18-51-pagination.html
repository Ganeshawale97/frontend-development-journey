<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagination Component</title><style>body{font:16px system-ui;background:#eef2ff;padding:32px 16px}.card{max-width:600px;margin:auto;background:white;padding:24px;border-radius:16px}li{padding:10px;border-bottom:1px solid #eee}.pages{display:flex;gap:8px;margin-top:16px}button{padding:9px 13px;border:0;border-radius:8px;background:#4338ca;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}</style></head><body><main class="card"><h1>Student list</h1><ul id="items"></ul><div class="pages"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></main><script>const students=Array.from({length:23},(_,i)=>'Student '+(i+1));const size=5;let current=0;const items=document.querySelector('#items'),page=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next');function render(){items.replaceChildren();students.slice(current*size,(current+1)*size).forEach(name=>{const li=document.createElement('li');li.textContent=name;items.append(li)});page.textContent='Page '+(current+1)+' of '+Math.ceil(students.length/size);prev.disabled=current===0;next.disabled=(current+1)*size>=students.length}prev.onclick=()=>{current--;render()};next.onclick=()=>{current++;render()};render();</script></body></html>
