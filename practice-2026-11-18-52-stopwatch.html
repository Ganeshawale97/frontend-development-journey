<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch</title><style>body{font:16px system-ui;background:#111827;color:#f8fafc;min-height:100vh;display:grid;place-items:center;margin:0}.card{text-align:center;padding:28px}.time{font-size:clamp(3rem,14vw,6rem);font-variant-numeric:tabular-nums}button{padding:11px 16px;margin:5px;border:0;border-radius:8px;background:#38bdf8;color:#082f49;cursor:pointer}li{padding:5px;text-align:left}</style></head><body><main class="card"><h1>Stopwatch</h1><div class="time" id="time">00:00.0</div><button id="start">Start</button><button id="lap">Lap</button><button id="reset">Reset</button><ol id="laps"></ol></main><script>let elapsed=0,startAt=0,raf=0,running=false;const time=document.querySelector('#time');function format(ms){const t=Math.floor(ms/100);return String(Math.floor(t/600)).padStart(2,'0')+':'+String(Math.floor(t/10)%60).padStart(2,'0')+'.'+(t%10)}function tick(){elapsed=performance.now()-startAt;time.textContent=format(elapsed);if(running)raf=requestAnimationFrame(tick)}document.querySelector('#start').onclick=()=>{if(running){running=false;cancelAnimationFrame(raf);document.querySelector('#start').textContent='Start'}else{running=true;startAt=performance.now()-elapsed;document.querySelector('#start').textContent='Pause';tick()}};document.querySelector('#lap').onclick=()=>{if(!running)return;const li=document.createElement('li');li.textContent='Lap: '+format(elapsed);document.querySelector('#laps').prepend(li)};document.querySelector('#reset').onclick=()=>{running=false;cancelAnimationFrame(raf);elapsed=0;time.textContent=format(0);document.querySelector('#start').textContent='Start';document.querySelector('#laps').replaceChildren()};</script></body></html>
