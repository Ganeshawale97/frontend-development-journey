<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Picker</title><style>body{font:16px system-ui;background:#f8fafc;min-height:100vh;display:grid;place-items:center;margin:0}.card{padding:30px;background:white;border-radius:16px;text-align:center;width:min(420px,90%)}input{width:90px;height:60px;border:0;cursor:pointer}.swatch{height:130px;border-radius:12px;margin:18px 0;background:#6366f1}button{padding:10px 15px;border:0;border-radius:8px;background:#334155;color:white}</style></head><body><main class="card"><h1>Color playground</h1><label for="picker">Choose a color</label><br><input id="picker" type="color" value="#6366f1"><div class="swatch" id="swatch"></div><p>HEX: <strong id="hex">#6366F1</strong></p><button id="copy">Copy HEX</button><p id="status" role="status"></p></main><script>const picker=document.querySelector('#picker'),hex=document.querySelector('#hex'),swatch=document.querySelector('#swatch');picker.oninput=()=>{hex.textContent=picker.value.toUpperCase();swatch.style.background=picker.value};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(hex.textContent);document.querySelector('#status').textContent='Copied '+hex.textContent}catch{document.querySelector('#status').textContent='Clipboard unavailable'}};</script></body></html>
