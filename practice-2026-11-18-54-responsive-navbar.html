<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive Navbar</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f8fafc;color:#172033}.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:#172554;color:white}.brand{font-weight:800;font-size:1.2rem}.links{display:flex;gap:20px}.links a{color:white;text-decoration:none}.toggle{display:none;padding:9px;border:0;border-radius:7px}@media(max-width:600px){.toggle{display:block}.links{display:none;position:absolute;top:60px;left:0;right:0;background:#172554;padding:20px;flex-direction:column}.links.open{display:flex}}main{padding:50px 8%}</style></head><body><header class="nav"><span class="brand">WEBLAB</span><button class="toggle" id="toggle" aria-expanded="false" aria-controls="links">Menu ☰</button><nav class="links" id="links"><a href="#home">Home</a><a href="#projects">Projects</a><a href="#about">About</a><a href="#contact">Contact</a></nav></header><main id="home"><h1>Responsive navigation</h1><p>Resize the browser to see the mobile menu behaviour.</p><section id="projects"><h2>Projects</h2></section><section id="about"><h2>About</h2></section><section id="contact"><h2>Contact</h2></section></main><script>const toggle=document.querySelector('#toggle'),links=document.querySelector('#links');toggle.onclick=()=>{const open=links.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Close ✕':'Menu ☰'};links.querySelectorAll('a').forEach(a=>a.onclick=()=>{links.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.textContent='Menu ☰'});</script></body></html>
