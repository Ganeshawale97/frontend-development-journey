<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inline Validation</title><style>body{font:16px system-ui;background:#eff6ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:28px;border-radius:16px;width:min(460px,100%)}label{display:block;margin:14px 0 5px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}small{display:block;min-height:22px;color:#b91c1c}button{padding:12px 18px;background:#1d4ed8;color:white;border:0;border-radius:8px}#status{color:#166534}</style></head><body><main class="card"><h1>Profile form</h1><form id="form" novalidate><label for="username">Username</label><input id="username" autocomplete="username" aria-describedby="userError"><small id="userError"></small><label for="email">Email address</label><input id="email" type="email" aria-describedby="emailError"><small id="emailError"></small><button>Validate profile</button></form><p id="status" role="status"></p></main><script>const form=document.querySelector('#form');form.onsubmit=e=>{e.preventDefault();const username=document.querySelector('#username').value.trim(),email=document.querySelector('#email').value.trim();const userError=document.querySelector('#userError'),emailError=document.querySelector('#emailError');userError.textContent=username.length<3?'Username must contain at least 3 characters.':'';emailError.textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'':'Enter a valid email address.';document.querySelector('#status').textContent=!userError.textContent&&!emailError.textContent?'Profile details look valid.':''};</script></body></html>
