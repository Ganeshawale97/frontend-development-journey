<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator</title><style>body{font:16px system-ui;background:#f0fdf4;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:28px;border-radius:16px;width:min(440px,100%)}label{display:block;margin:12px 0 5px}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:16px;padding:12px 18px;background:#15803d;color:white;border:0;border-radius:8px;cursor:pointer}.result{font-size:1.3rem;font-weight:700}</style></head><body><main class="card"><h1>BMI Calculator</h1><form id="form"><label for="weight">Weight (kg)</label><input id="weight" type="number" min="1" step=".1" required><label for="height">Height (cm)</label><input id="height" type="number" min="1" step=".1" required><button>Calculate BMI</button></form><p class="result" id="result" aria-live="polite"></p><p id="category"></p><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();const w=Number(document.querySelector('#weight').value),h=Number(document.querySelector('#height').value)/100,bmi=w/(h*h);document.querySelector('#result').textContent='BMI: '+bmi.toFixed(1);document.querySelector('#category').textContent=bmi<18.5?'Below typical range':bmi<25?'Typical range':bmi<30?'Above typical range':'High range'};</script></main></body></html>
