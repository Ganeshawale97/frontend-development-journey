<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tip Calculator</title><style>body{font:16px system-ui;background:#eff6ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:26px;border-radius:16px;width:min(430px,100%)}label{display:block;margin:12px 0 6px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}.out{background:#dbeafe;padding:14px;border-radius:10px;margin-top:16px}</style></head><body><main class="card"><h1>Tip calculator</h1><label for="bill">Bill amount (₹)</label><input id="bill" type="number" min="0" step=".01" value="1000"><label for="tip">Tip percentage</label><select id="tip"><option value="5">5%</option><option value="10">10%</option><option value="15" selected>15%</option><option value="20">20%</option><option value="25">25%</option></select><label for="people">People</label><input id="people" type="number" min="1" value="2"><div class="out"><p>Tip: <strong id="tipAmount">₹150.00</strong></p><p>Total: <strong id="total">₹1,150.00</strong></p><p>Per person: <strong id="each">₹575.00</strong></p></div><script>const inputs=['bill','tip','people'].map(id=>document.querySelector('#'+id));function update(){const bill=Math.max(0,Number(inputs[0].value)),percent=Number(inputs[1].value),people=Math.max(1,Number(inputs[2].value));const tip=bill*percent/100,total=bill+tip;document.querySelector('#tipAmount').textContent='₹'+tip.toFixed(2);document.querySelector('#total').textContent='₹'+total.toFixed(2);document.querySelector('#each').textContent='₹'+(total/people).toFixed(2)}inputs.forEach(input=>input.addEventListener('input',update));update();</script></main></body></html>
