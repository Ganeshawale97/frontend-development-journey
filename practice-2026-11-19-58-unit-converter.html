<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter</title><style>body{font:16px system-ui;background:#f5f3ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:28px;border-radius:16px;width:min(440px,100%)}input,select{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px}.result{font-size:1.6rem;font-weight:700}</style></head><body><main class="card"><h1>Length converter</h1><input id="value" type="number" value="1" aria-label="Value"><select id="unit"><option value="m">Meters to feet</option><option value="km">Kilometers to miles</option><option value="cm">Centimeters to inches</option></select><p class="result" id="result"></p><script>const value=document.querySelector('#value'),unit=document.querySelector('#unit'),result=document.querySelector('#result');function convert(){const n=Number(value.value),conversions={m:[3.28084,'ft'],km:[.621371,'mi'],cm:[.393701,'in']};result.textContent=(n*conversions[unit.value][0]).toLocaleString(undefined,{maximumFractionDigits:4})+' '+conversions[unit.value][1]}value.oninput=unit.onchange=convert;convert();</script></main></body></html>
