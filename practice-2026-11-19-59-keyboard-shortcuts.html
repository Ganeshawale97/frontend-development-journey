<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyboard Shortcuts</title><style>body{font:16px system-ui;background:#f8fafc;padding:30px}.card{max-width:600px;margin:auto;background:white;padding:26px;border-radius:16px}kbd{background:#e2e8f0;border:1px solid #cbd5e1;border-radius:5px;padding:3px 7px}.box{padding:20px;background:#eef2ff;border-radius:10px}</style></head><body><main class="card"><h1>Keyboard shortcuts</h1><p>Try <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>K</kbd> to focus search and <kbd>Escape</kbd> to clear.</p><input id="search" placeholder="Search this demo" aria-label="Search"><div class="box" id="status" role="status">Waiting for a shortcut…</div><script>const input=document.querySelector('#search'),status=document.querySelector('#status');document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();input.focus();status.textContent='Search shortcut used'}if(e.key==='Escape'){input.value='';input.blur();status.textContent='Search cleared with Escape'}});input.addEventListener('input',()=>status.textContent=input.value?'Searching for: '+input.value:'Waiting for a shortcut…');</script></main></body></html>
