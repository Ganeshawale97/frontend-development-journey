<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-step Form</title><style>body{font:16px system-ui;background:#eff6ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:28px;border-radius:16px;width:min(480px,100%)}.bar{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden}.fill{height:100%;width:33%;background:#2563eb;transition:width .2s}section[hidden]{display:none}label{display:block;margin:12px 0 6px}input{width:100%;padding:11px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px}button{padding:11px 15px;border:0;border-radius:8px;background:#2563eb;color:white;margin-top:14px;cursor:pointer}</style></head><body><main class="card"><h1>Registration</h1><p id="stepText">Step 1 of 3</p><div class="bar"><div class="fill" id="fill"></div></div><form id="form"><section id="step1"><label for="name">Full name</label><input id="name" required></section><section id="step2" hidden><label for="email">Email</label><input id="email" type="email" required></section><section id="step3" hidden><label for="city">City</label><input id="city" required></section><button type="button" id="next">Next</button><button type="submit" id="submit" hidden>Finish</button></form><p id="status" role="status"></p><script>let step=1;const next=document.querySelector('#next'),submit=document.querySelector('#submit');function show(){for(let i=1;i<=3;i++)document.querySelector('#step'+i).hidden=i!==step;document.querySelector('#stepText').textContent='Step '+step+' of 3';document.querySelector('#fill').style.width=(step/3*100)+'%';next.hidden=step===3;submit.hidden=step!==3}next.onclick=()=>{const field=document.querySelector('#step'+step+' input');if(!field.reportValidity())return;step++;show()};document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(document.querySelector('#city').reportValidity())document.querySelector('#status').textContent='Demo form completed!'};show();</script></main></body></html>
