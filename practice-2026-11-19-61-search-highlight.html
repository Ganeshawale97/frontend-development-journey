<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search Highlight</title><style>body{font:16px/1.7 system-ui;background:#f8fafc;padding:30px 16px}.card{max-width:700px;margin:auto;background:white;padding:26px;border-radius:16px}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px}article{margin-top:20px}mark{background:#fde68a;padding:0 2px}</style></head><body><main class="card"><h1>Search in article</h1><input id="query" type="search" placeholder="Find a word…"><article id="article"><p>JavaScript helps developers create interactive websites. It can update content, respond to user events, and communicate with web APIs.</p><p>Practice JavaScript regularly to understand variables, functions, arrays, objects, and asynchronous programming.</p></article><p id="count" aria-live="polite"></p></main><script>const article=document.querySelector('#article'),original=article.innerHTML,query=document.querySelector('#query'),count=document.querySelector('#count');query.oninput=()=>{article.innerHTML=original;const term=query.value.trim().toLowerCase();if(!term){count.textContent='';return}let matches=0;article.querySelectorAll('p').forEach(p=>{const text=p.textContent;let html='',start=0,at;while((at=text.toLowerCase().indexOf(term,start))!==-1){html+=text.slice(start,at)+'<mark>'+text.slice(at,at+term.length)+'</mark>';matches++;start=at+term.length}p.innerHTML=html+text.slice(start)});count.textContent=matches+' match(es)'};</script></main></body></html>
