<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toast Notifications</title><style>body{font:16px system-ui;background:#f1f5f9;min-height:100vh;display:grid;place-items:center;margin:0}.card{background:white;padding:30px;border-radius:16px;text-align:center}button{padding:12px 16px;border:0;border-radius:8px;background:#334155;color:white;cursor:pointer}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#166534;color:white;padding:14px 20px;border-radius:10px;box-shadow:0 8px 24px #0002;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}</style></head><body><main class="card"><h1>Toast messages</h1><button id="notify">Show success notification</button></main><div class="toast" id="toast" role="status" aria-live="polite"></div><script>const toast=document.querySelector('#toast');let timeout;document.querySelector('#notify').onclick=()=>{toast.textContent='Saved successfully!';toast.classList.add('show');clearTimeout(timeout);timeout=setTimeout(()=>toast.classList.remove('show'),2500)};</script></body></html>
