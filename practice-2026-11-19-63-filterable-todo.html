<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filterable Todo</title><style>body{font:16px system-ui;background:#eef2ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:white;padding:26px;border-radius:16px;width:min(500px,100%)}form{display:flex;gap:8px}input{min-width:0;flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:8px}button{padding:10px 13px;border:0;border-radius:8px;background:#4338ca;color:white;cursor:pointer}.filters{display:flex;gap:8px;margin:14px 0}li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}li.done span{text-decoration:line-through;color:#64748b}</style></head><body><main class="card"><h1>Task list</h1><form id="form"><input id="task" placeholder="New task…" required><button>Add</button></form><div class="filters"><button data-filter="all">All</button><button data-filter="active">Active</button><button data-filter="done">Completed</button></div><ul id="list"></ul><p id="count"></p></main><script>let tasks=[],filter='all';const list=document.querySelector('#list');function render(){list.replaceChildren();tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done)).forEach(t=>{const li=document.createElement('li');li.classList.toggle('done',t.done);const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.onchange=()=>{t.done=check.checked;render()};const span=document.createElement('span');span.textContent=t.text;li.append(check,span);list.append(li)});document.querySelector('#count').textContent=tasks.filter(t=>!t.done).length+' active task(s)'}document.querySelector('#form').onsubmit=e=>{e.preventDefault();tasks.push({text:document.querySelector('#task').value.trim(),done:false});e.target.reset();render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});render();</script></body></html>
