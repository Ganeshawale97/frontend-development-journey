<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid Playground</title><style>body{font:16px system-ui;background:#f8fafc;padding:25px}.card{max-width:850px;margin:auto;background:white;padding:22px;border-radius:16px}label{display:block;margin:12px 0}input{width:100%}.grid{display:grid;gap:12px;margin-top:20px;grid-template-columns:repeat(3,1fr)}.tile{min-height:100px;display:grid;place-items:center;background:#c7d2fe;border-radius:10px;font-weight:700}@media(max-width:550px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="card"><h1>Grid layout playground</h1><label>Columns: <output id="columns">3</output><input id="range" type="range" min="1" max="5" value="3"></label><div class="grid" id="grid"></div></main><script>const range=document.querySelector('#range'),grid=document.querySelector('#grid'),columns=document.querySelector('#columns');for(let i=1;i<=12;i++){const tile=document.createElement('div');tile.className='tile';tile.textContent='Item '+i;grid.append(tile)}range.oninput=()=>{columns.value=range.value;grid.style.gridTemplateColumns='repeat('+range.value+',minmax(0,1fr))'};range.dispatchEvent(new Event('input'));</script></body></html>
