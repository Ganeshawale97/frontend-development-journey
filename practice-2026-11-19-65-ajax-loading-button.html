<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Button</title><style>body{font:16px system-ui;background:#f1f5f9;min-height:100vh;display:grid;place-items:center;margin:0}.card{background:white;padding:28px;border-radius:16px;text-align:center}button{padding:12px 18px;background:#2563eb;color:white;border:0;border-radius:9px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}</style></head><body><main class="card"><h1>Async interaction</h1><button id="button">Simulate request</button><p id="status" role="status">Ready</p></main><script>const button=document.querySelector('#button'),status=document.querySelector('#status');button.onclick=async()=>{button.disabled=true;button.textContent='Loading…';status.textContent='Request in progress';try{await new Promise(resolve=>setTimeout(resolve,1200));status.textContent='Request completed successfully!'}finally{button.disabled=false;button.textContent='Simulate request'}};</script></body></html>
