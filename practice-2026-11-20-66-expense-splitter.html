<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Splitter</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2ff;font:16px system-ui;color:#172554}.card{width:min(92vw,420px);padding:28px;border-radius:20px;background:white;box-shadow:0 16px 45px #1e3a8a18}h1{margin:0 0 8px}p{color:#64748b;margin-top:0}label{display:block;margin:18px 0 6px;font-weight:600}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#4f46e5;color:white;font-weight:700;font:inherit;cursor:pointer}.result{margin-top:18px;padding:16px;background:#eef2ff;border-radius:12px;text-align:center}.amount{font-size:2rem;font-weight:800;color:#4338ca}</style></head><body><main class="card"><h1>Expense Splitter</h1><p>Split a bill fairly with your group.</p><label for="total">Total bill (₹)</label><input id="total" type="number" min="0" step=".01" placeholder="e.g. 1250"><label for="people">Number of people</label><input id="people" type="number" min="1" step="1" value="2"><button id="split">Calculate split</button><div class="result" aria-live="polite">Each person pays <div class="amount" id="answer">₹0.00</div></div></main><script>const total=document.querySelector('#total'),people=document.querySelector('#people'),answer=document.querySelector('#answer');document.querySelector('#split').addEventListener('click',()=>{const a=Number(total.value),b=Number(people.value);if(total.value===''||a<0||!Number.isInteger(b)||b<1){answer.textContent='Check your inputs';return}answer.textContent=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(a/b)});</script></body></html>
