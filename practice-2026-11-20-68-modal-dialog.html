<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modal Dialog</title><style>
*{box-sizing:border-box}body{font:16px system-ui;background:#f1f5f9;color:#0f172a;margin:0;min-height:100vh;display:grid;place-items:center}.box{text-align:center;padding:32px}button{border:0;border-radius:10px;padding:12px 18px;background:#4f46e5;color:white;font:inherit;cursor:pointer}.modal{width:min(90vw,440px);border:0;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0003}.modal::backdrop{background:#0f172a99}.modal h2{margin-top:0}.close{background:#e2e8f0;color:#0f172a;margin-left:8px}</style></head><body><main class="box"><h1>Native modal dialog</h1><p>Open the dialog to see an accessible modal pattern.</p><button id="open">Open dialog</button></main><dialog class="modal" id="dialog" aria-labelledby="heading"><h2 id="heading">Welcome!</h2><p>This dialog uses the native HTML dialog element, which supports focus management and Escape-to-close behavior.</p><button id="confirm">Got it</button><button class="close" id="close">Close</button></dialog><script>const dialog=document.querySelector('#dialog');document.querySelector('#open').onclick=()=>dialog.showModal();document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#confirm').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});</script></body></html>
