<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debounced Search</title><style>
*{box-sizing:border-box}body{margin:0;padding:50px 16px;background:#f8fafc;font:16px system-ui;color:#1e293b}.app{max-width:560px;margin:auto;background:white;padding:26px;border-radius:18px;box-shadow:0 12px 35px #0f172a12}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;margin:12px 0}ul{padding:0;list-style:none}li{padding:12px;border-bottom:1px solid #e2e8f0}small{color:#64748b}</style></head><body><main class="app"><h1>Debounced Search</h1><p>Search the frontend topics below.</p><input id="query" type="search" placeholder="Try “CSS” or “API”" aria-label="Search topics"><small id="status" aria-live="polite">Showing all topics</small><ul id="results"></ul></main><script>const topics=['HTML semantics','CSS Grid','Flexbox layouts','JavaScript arrays','DOM events','Fetch API','Responsive design','Web accessibility'];const query=document.querySelector('#query'),results=document.querySelector('#results'),status=document.querySelector('#status');function render(){const q=query.value.trim().toLowerCase(),matches=topics.filter(x=>x.toLowerCase().includes(q));results.replaceChildren(...matches.map(x=>{const li=document.createElement('li');li.textContent=x;return li}));status.textContent=matches.length+' result(s)'}let timer;query.addEventListener('input',()=>{clearTimeout(timer);status.textContent='Searching…';timer=setTimeout(render,250)});render();</script></body></html>
