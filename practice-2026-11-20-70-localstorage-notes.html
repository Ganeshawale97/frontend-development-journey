<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Storage Notes</title><style>
*{box-sizing:border-box}body{margin:0;padding:40px 16px;background:#fefce8;font:16px system-ui;color:#422006}.app{max-width:650px;margin:auto}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #d6d3d1;border-radius:12px;font:inherit}button{padding:10px 14px;border:0;border-radius:9px;background:#a16207;color:white;font:inherit;cursor:pointer;margin:10px 6px 10px 0}.note{background:#fff;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 4px 12px #78350f12;white-space:pre-wrap}.note button{background:#b91c1c;float:right;margin:0}</style></head><body><main class="app"><h1>My Notes</h1><p>Notes are saved in this browser using localStorage.</p><textarea id="draft" placeholder="Write a note…"></textarea><button id="save">Save note</button><div id="notes" aria-live="polite"></div></main><script>const key='frontend-practice-notes',draft=document.querySelector('#draft'),notes=document.querySelector('#notes');let data=JSON.parse(localStorage.getItem(key)||'[]');function persist(){localStorage.setItem(key,JSON.stringify(data));render()}function render(){notes.replaceChildren();data.forEach((note,i)=>{const article=document.createElement('article');article.className='note';const del=document.createElement('button');del.textContent='Delete';del.setAttribute('aria-label','Delete note '+(i+1));del.onclick=()=>{data.splice(i,1);persist()};article.append(del,document.createTextNode(note));notes.append(article)})}document.querySelector('#save').onclick=()=>{const value=draft.value.trim();if(!value)return;data.unshift(value);draft.value='';persist()};render();</script></body></html>
