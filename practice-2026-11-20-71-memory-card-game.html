<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Card Game</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px 14px;background:#ecfeff;font:16px system-ui;color:#164e63;text-align:center}.game{max-width:460px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.card{aspect-ratio:1;border:0;border-radius:14px;background:#0e7490;color:white;font-size:2rem;cursor:pointer}.card.revealed,.card.matched{background:white;color:#164e63;box-shadow:inset 0 0 0 2px #67e8f9}.card.matched{opacity:.6}button#restart{padding:11px 18px;border:0;border-radius:9px;background:#155e75;color:white;font:inherit;cursor:pointer}</style></head><body><main class="game"><h1>Memory Match</h1><p>Moves: <strong id="moves">0</strong> · Matches: <strong id="matches">0</strong>/8</p><div class="grid" id="grid" aria-label="Memory cards"></div><p id="message" aria-live="polite">Find all eight matching pairs.</p><button id="restart">Restart game</button></main><script>const icons=['🍋','🚀','🐼','🎧','🌈','⚽','🍕','⭐'];let deck,first=null,locked=false,moves=0,matched=0;const grid=document.querySelector('#grid');function start(){deck=[...icons,...icons].sort(()=>Math.random()-.5);first=null;locked=false;moves=0;matched=0;document.querySelector('#moves').textContent=0;document.querySelector('#matches').textContent=0;document.querySelector('#message').textContent='Find all eight matching pairs.';grid.replaceChildren();deck.forEach((icon,i)=>{const b=document.createElement('button');b.className='card';b.textContent='?';b.setAttribute('aria-label','Hidden card '+(i+1));b.onclick=()=>flip(b,icon);grid.append(b)})}function flip(button,icon){if(locked||button.classList.contains('revealed')||button.classList.contains('matched'))return;button.textContent=icon;button.classList.add('revealed');button.setAttribute('aria-label',icon);if(!first){first={button,icon};return}moves++;document.querySelector('#moves').textContent=moves;if(first.icon===icon){first.button.classList.add('matched');button.classList.add('matched');matched++;document.querySelector('#matches').textContent=matched;first=null;if(matched===8)document.querySelector('#message').textContent='You won in '+moves+' moves!'}else{locked=true;const previous=first.button;first=null;setTimeout(()=>{[previous,button].forEach(b=>{b.textContent='?';b.classList.remove('revealed');b.setAttribute('aria-label','Hidden card')});locked=false},750)}}document.querySelector('#restart').onclick=start;start();</script></body></html>
