<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme Switcher</title><style>
:root{color-scheme:light;--bg:#f8fafc;--fg:#0f172a;--panel:white;--accent:#4f46e5}body.dark{color-scheme:dark;--bg:#0f172a;--fg:#e2e8f0;--panel:#1e293b;--accent:#a5b4fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px system-ui;transition:background .2s,color .2s}.card{width:min(90vw,480px);padding:30px;border-radius:18px;background:var(--panel);box-shadow:0 12px 35px #0002}button{padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:white;font:inherit;cursor:pointer}</style></head><body><main class="card"><h1>Theme Switcher</h1><p>Switch between light and dark themes. Your choice is saved in this browser.</p><button id="toggle" aria-pressed="false">Enable dark mode</button></main><script>const button=document.querySelector('#toggle');function apply(dark){document.body.classList.toggle('dark',dark);button.textContent=dark?'Enable light mode':'Enable dark mode';button.setAttribute('aria-pressed',String(dark));localStorage.setItem('practice-theme',dark?'dark':'light')}apply(localStorage.getItem('practice-theme')==='dark');button.onclick=()=>apply(!document.body.classList.contains('dark'));</script></body></html>
