<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Strength Meter</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f3ff;font:16px system-ui;color:#312e81}.card{width:min(92vw,440px);padding:28px;background:white;border-radius:18px;box-shadow:0 14px 40px #312e8118}input{width:100%;padding:13px;border:1px solid #c4b5fd;border-radius:10px;font:inherit;margin:10px 0}.track{height:9px;background:#e9d5ff;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:#a78bfa;transition:width .2s}.hint{color:#6b7280;font-size:.9rem}</style></head><body><main class="card"><h1>Password strength</h1><label for="password">Enter a password</label><input id="password" type="password" autocomplete="new-password" placeholder="Type to test"><div class="track" role="progressbar" aria-label="Password strength" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><div class="fill" id="fill"></div></div><h2 id="label" aria-live="polite">Strength: —</h2><p class="hint" id="hint">Use 8+ characters, mixed case, numbers, and symbols.</p></main><script>const input=document.querySelector('#password'),fill=document.querySelector('#fill'),label=document.querySelector('#label'),hint=document.querySelector('#hint'),bar=document.querySelector('[role=progressbar]');input.addEventListener('input',()=>{const p=input.value;let score=0;if(p.length>=8)score++;if(p.length>=12)score++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))score++;if(/\d/.test(p)&&/[^A-Za-z0-9]/.test(p))score++;const names=['Very weak','Weak','Fair','Good','Strong'];fill.style.width=(score*25)+'%';label.textContent='Strength: '+(p?names[score]:'—');bar.setAttribute('aria-valuenow',score);hint.textContent=p?(p.length<8?'Add more characters.':score<3?'Try adding uppercase, numbers, or symbols.':'Good combination. Avoid reusing passwords.'):'Use 8+ characters, mixed case, numbers, and symbols.'});</script></body></html>
