<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Character Counter</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eff6ff;color:#1e3a8a;font:16px system-ui}.card{width:min(92vw,520px);padding:28px;background:white;border-radius:18px;box-shadow:0 14px 40px #1e3a8a18}textarea{width:100%;min-height:150px;padding:14px;border:1px solid #bfdbfe;border-radius:12px;font:inherit;resize:vertical}.meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:#64748b}.warning{color:#dc2626;font-weight:700}</style></head><body><main class="card"><h1>Live Character Counter</h1><p>Write a short message and track its length.</p><label for="message">Your message</label><textarea id="message" maxlength="200" placeholder="Start typing…"></textarea><div class="meta"><span id="status" aria-live="polite">0 characters</span><span id="remaining">200 remaining</span></div></main><script>const field=document.querySelector('#message'),status=document.querySelector('#status'),remaining=document.querySelector('#remaining');function update(){const n=field.value.length,left=200-n;status.textContent=n+' character'+(n===1?'':'s');remaining.textContent=left+' remaining';remaining.classList.toggle('warning',left<20)}field.addEventListener('input',update);update();</script></body></html>
