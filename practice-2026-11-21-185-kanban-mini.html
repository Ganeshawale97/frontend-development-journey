<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Kanban Board</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;background:#f1f5f9;color:#0f172a;font:16px system-ui;display:grid;place-items:center}.app{width:min(94vw,650px);background:white;padding:28px;border-radius:18px;box-shadow:0 12px 40px #0f172a12}h1{margin-top:0}button{background:#4f46e5;color:#fff;border:0;padding:10px 14px;border-radius:9px;font:inherit;cursor:pointer;margin:4px}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin:8px 0}output,.result{display:block;padding:14px;background:#eef2ff;border-radius:10px;margin-top:12px}small{color:#64748b}</style></head><body><main class="app"><h1>Mini Kanban Board</h1><p>Move tasks across workflow columns.</p><div id="demo"></div><small>Frontend practice · 185</small></main><script>const demo=document.querySelector('#demo');demo.innerHTML="<label>Item</label><input id=\"input\" placeholder=\"Type something\"><button id=\"action\">Add / Save</button><output id=\"output\" aria-live=\"polite\">Waiting for input</output>";document.querySelector('#action').onclick=()=>document.querySelector('#output').textContent='Saved: '+document.querySelector('#input').value;</script></body></html>
