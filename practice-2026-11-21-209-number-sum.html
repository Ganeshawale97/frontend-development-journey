<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Sum Calculator</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef2ff;color:#172554;font:16px system-ui}.app{width:min(94vw,560px);padding:30px;background:#fff;border-radius:20px;box-shadow:0 16px 48px #1e3a8a18}h1{margin:0 0 8px}p{color:#64748b;line-height:1.5}label{display:block;font-weight:650;margin:20px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font:inherit;font-weight:650;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}output{display:block;min-height:52px;margin-top:18px;padding:14px;border-radius:10px;background:#eef2ff;white-space:pre-wrap;overflow-wrap:anywhere;color:#1e1b4b}.meta{margin-top:18px;font-size:12px;color:#94a3b8}</style></head><body><main class="app"><h1>Number Sum Calculator</h1><p>Add a list of numbers separated by commas.</p><label for="value">Input</label><input id="value" placeholder="Example: 12, 5, 8"><button id="run" type="button">Run Number Sum Calculator</button><output id="result" aria-live="polite">Your result will appear here.</output><div class="meta">Frontend Development Journey · Practice 209</div></main><script>
const v=document.querySelector('#value'),out=document.querySelector('#result');
document.querySelector('#run').addEventListener('click',()=>{out.style.background='#eef2ff';out.style.color='#1e1b4b';const a=v.value.split(',').map(Number);out.textContent=a.length&&a.every(Number.isFinite)?'Sum: '+a.reduce((x,y)=>x+y,0):'Enter valid comma-separated numbers';});
</script></body></html>
