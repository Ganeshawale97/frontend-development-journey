<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Frequency</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f0fdfa;color:#134e4a;font:16px system-ui}.app{width:min(94vw,560px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #134e4a18}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#0f766e;color:white;font:inherit;cursor:pointer}output{display:block;min-height:50px;margin-top:18px;padding:14px;border-radius:10px;background:#ccfbf1;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="app"><h1>Character Frequency</h1><p>Count character occurrences</p><label for="value">Input</label><input id="value" placeholder="Enter a value"><button id="run">Run</button><output id="result" aria-live="polite">Result appears here.</output></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{const m={};for(const c of v.value){if(c.trim())m[c]=(m[c]||0)+1}out.textContent=Object.entries(m).map(([k,n])=>k+': '+n).join(' · ')||'No characters';};</script></body></html>
