<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB to HEX</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff7ed;color:#7c2d12;font:16px system-ui}.app{width:min(94vw,560px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #7c2d1218}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #fed7aa;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#c2410c;color:white;font:inherit;cursor:pointer}output{display:block;min-height:50px;margin-top:18px;padding:14px;border-radius:10px;background:#ffedd5;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="app"><h1>RGB to HEX</h1><p>Convert RGB values to hex</p><label for="value">Input (if required)</label><input id="value" placeholder="Enter a value or leave blank"><button id="run">Generate / Convert</button><output id="result" aria-live="polite">Result appears here.</output></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{const a=v.value.split(',').map(x=>Number(x.trim()));out.style.background='#eef2ff';out.style.color='#134e4a';out.textContent=a.length===3&&a.every(x=>Number.isInteger(x)&&x>=0&&x<=255)?'#'+a.map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase():'Enter three values from 0 to 255';};</script></body></html>
