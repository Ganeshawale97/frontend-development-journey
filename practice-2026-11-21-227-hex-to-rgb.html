<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEX to RGB</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff7ed;color:#7c2d12;font:16px system-ui}.app{width:min(94vw,560px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #7c2d1218}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #fed7aa;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#c2410c;color:white;font:inherit;cursor:pointer}output{display:block;min-height:50px;margin-top:18px;padding:14px;border-radius:10px;background:#ffedd5;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="app"><h1>HEX to RGB</h1><p>Convert hex color to RGB</p><label for="value">Input (if required)</label><input id="value" placeholder="Enter a value or leave blank"><button id="run">Generate / Convert</button><output id="result" aria-live="polite">Result appears here.</output></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{const m=v.value.trim().match(/^#?([0-9a-f]{6})$/i);out.textContent=m?'RGB: '+[0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)).join(', '):'Enter a six-digit hex color';};</script></body></html>
