<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fdf2f8;color:#831843;font:16px system-ui}.app{width:min(94vw,560px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #83184318}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #fbcfe8;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#be185d;color:white;font:inherit;cursor:pointer}output{display:block;min-height:50px;margin-top:18px;padding:14px;border-radius:10px;background:#fce7f3;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="app"><h1>BMI Calculator</h1><p>Estimate BMI from weight and height</p><label for="value">Input</label><input id="value" placeholder="Enter values"><button id="run">Calculate</button><output id="result" aria-live="polite">Result appears here.</output></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{const a=v.value.split(',').map(Number);if(a.length!==2||a.some(x=>!Number.isFinite(x)||x<=0)){out.textContent='Enter weight kg, height cm'}else{const b=a[0]/((a[1]/100)**2);out.textContent='BMI: '+b.toFixed(1)+' — '+(b<18.5?'Below standard range':b<25?'Within standard range':b<30?'Above standard range':'High range')+' (general screening only)'}};</script></body></html>
