<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leap Year Checker</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fdf2f8;color:#831843;font:16px system-ui}.app{width:min(94vw,560px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #83184318}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #fbcfe8;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#be185d;color:white;font:inherit;cursor:pointer}output{display:block;min-height:50px;margin-top:18px;padding:14px;border-radius:10px;background:#fce7f3;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="app"><h1>Leap Year Checker</h1><p>Check whether a year is a leap year</p><label for="value">Input</label><input id="value" placeholder="Enter values"><button id="run">Calculate</button><output id="result" aria-live="polite">Result appears here.</output></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{const y=Number(v.value);out.textContent=Number.isInteger(y)&&y>0?(y%400===0||y%4===0&&y%100!==0?'Leap year ✓':'Not a leap year'):'Enter a positive year';};</script></body></html>
