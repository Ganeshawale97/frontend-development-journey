<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCM Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f3ff;color:#4c1d95;font:16px system-ui}.app{width:min(94vw,560px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #4c1d9518}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #ddd6fe;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#6d28d9;color:white;font:inherit;cursor:pointer}output{display:block;min-height:50px;margin-top:18px;padding:14px;border-radius:10px;background:#ede9fe;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="app"><h1>LCM Calculator</h1><p>Find least common multiple of two integers</p><label for="value">Input</label><input id="value" placeholder="Enter a value"><button id="run">Run tool</button><output id="result" aria-live="polite">Result appears here.</output></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{let a=v.value.split(',').map(Number);if(a.length!==2||a.some(x=>!Number.isInteger(x))){out.textContent='Enter two integers'}else{let x=Math.abs(a[0]),y=Math.abs(a[1]),p=x,q=y;while(q)[p,q]=[q,p%q];out.textContent='LCM: '+(x&&y?Math.abs(x*y)/p:0)}};</script></body></html>
