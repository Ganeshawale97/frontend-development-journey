<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Median Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f3ff;color:#4c1d95;font:16px system-ui}.app{width:min(94vw,560px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #4c1d9518}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #ddd6fe;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#6d28d9;color:white;font:inherit;cursor:pointer}output{display:block;min-height:50px;margin-top:18px;padding:14px;border-radius:10px;background:#ede9fe;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="app"><h1>Median Calculator</h1><p>Find median of comma-separated numbers</p><label for="value">Input</label><input id="value" placeholder="Enter a value"><button id="run">Run tool</button><output id="result" aria-live="polite">Result appears here.</output></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{const a=v.value.split(',').map(Number).sort((x,y)=>x-y);if(!a.length||!a.every(Number.isFinite)){out.textContent='Enter valid numbers'}else{const m=Math.floor(a.length/2);out.textContent='Median: '+(a.length%2?a[m]:(a[m-1]+a[m])/2)}};</script></body></html>
