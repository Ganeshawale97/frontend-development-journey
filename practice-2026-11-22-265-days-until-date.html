<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Days Until Date</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#ecfeff;color:#164e63;font:16px system-ui}.app{width:min(94vw,580px);padding:30px;background:#fff;border-radius:20px;box-shadow:0 16px 48px #164e6318}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #a5f3fc;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#0e7490;color:white;font:inherit;cursor:pointer}output{display:block;min-height:52px;margin-top:18px;padding:14px;border-radius:10px;background:#cffafe;white-space:pre-wrap;overflow-wrap:anywhere}.meta{margin-top:16px;color:#94a3b8;font-size:12px}</style></head><body><main class="app"><h1>Days Until Date</h1><p>Calculate days from today to a target date</p><label for="value">Input</label><input id="value" placeholder="Enter target date YYYY-MM-DD"><button id="run">Run tool</button><output id="result" aria-live="polite">Result appears here.</output><div class="meta">Frontend Development Journey · Practice 265</div></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{const d=new Date(v.value+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);out.textContent=Number.isNaN(d.getTime())?'Enter a valid date':Math.ceil((d-t)/86400000)+' day(s) from today';};</script></body></html>
