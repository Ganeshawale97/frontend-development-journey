<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List Randomizer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f0fdf4;color:#14532d;font:16px system-ui}.app{width:min(94vw,580px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #14532d18}h1{margin:0 0 8px}p{color:#64748b}textarea{width:100%;min-height:110px;padding:13px;border:1px solid #bbf7d0;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#15803d;color:white;font:inherit;cursor:pointer}output{display:block;min-height:52px;margin-top:18px;padding:14px;border-radius:10px;background:#dcfce7;white-space:pre-wrap;overflow-wrap:anywhere}#tasks{padding-left:20px}#tasks li{margin:8px 0}#tasks button{margin-left:12px;padding:5px 9px;font-size:13px}.meta{margin-top:16px;color:#94a3b8;font-size:12px}</style></head><body><main class="app"><h1>List Randomizer</h1><p>Shuffle a list of lines</p><label for="value">Input</label><textarea id="value" placeholder="Enter one item per line"></textarea><button id="run">Run tool</button><output id="result" aria-live="polite">Result appears here.</output><div class="meta">Frontend Development Journey · Practice 274</div></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{const a=v.value.split('\n').filter(x=>x.trim());for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}out.textContent=a.join('\n')||'Add some items first';};</script></body></html>
