<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPv4 Address Validator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff7ed;color:#7c2d12;font:16px system-ui}.app{width:min(94vw,580px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #7c2d1218}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #fed7aa;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#c2410c;color:white;font:inherit;cursor:pointer}output{display:block;min-height:52px;margin-top:18px;padding:14px;border-radius:10px;background:#ffedd5;white-space:pre-wrap;overflow-wrap:anywhere}.meta{margin-top:16px;color:#94a3b8;font-size:12px}</style></head><body><main class="app"><h1>IPv4 Address Validator</h1><p>Validate an IPv4 address</p><label for="value">Value to check</label><input id="value" placeholder="192.168.1.1"><button id="run">Validate</button><output id="result" aria-live="polite">Validation result appears here.</output><div class="meta">Frontend Development Journey · Practice 288</div></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{const a=v.value.trim().split('.').map(Number);out.textContent=a.length===4&&a.every((n,i)=>/^\d{1,3}$/.test(v.value.trim().split('.')[i])&&n>=0&&n<=255)?'Valid IPv4 address ✓':'Invalid IPv4 address';};</script></body></html>
