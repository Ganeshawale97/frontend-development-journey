<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slug Validator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff7ed;color:#7c2d12;font:16px system-ui}.app{width:min(94vw,580px);padding:30px;background:white;border-radius:20px;box-shadow:0 16px 48px #7c2d1218}h1{margin:0 0 8px}p{color:#64748b}input{width:100%;padding:13px;border:1px solid #fed7aa;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#c2410c;color:white;font:inherit;cursor:pointer}output{display:block;min-height:52px;margin-top:18px;padding:14px;border-radius:10px;background:#ffedd5;white-space:pre-wrap;overflow-wrap:anywhere}.meta{margin-top:16px;color:#94a3b8;font-size:12px}</style></head><body><main class="app"><h1>Slug Validator</h1><p>Check a lowercase URL slug</p><label for="value">Value to check</label><input id="value" placeholder="my-first-project"><button id="run">Validate</button><output id="result" aria-live="polite">Validation result appears here.</output><div class="meta">Frontend Development Journey · Practice 290</div></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{out.textContent=/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(v.value)?'Valid slug ✓':'Use lowercase letters, numbers and single hyphens';};</script></body></html>
