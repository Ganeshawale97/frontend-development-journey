<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown Table Generator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font:16px system-ui}.app{width:min(94vw,600px);padding:30px;background:white;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 16px 48px #0f172a12}h1{margin:0 0 8px}p{color:#64748b;line-height:1.5}textarea{width:100%;min-height:110px;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#334155;color:white;font:inherit;cursor:pointer}output{display:block;min-height:54px;margin-top:18px;padding:14px;border-radius:10px;background:#f1f5f9;white-space:pre-wrap;overflow-wrap:anywhere}.meta{margin-top:16px;color:#94a3b8;font-size:12px}</style></head><body><main class="app"><h1>Markdown Table Generator</h1><p>Create a Markdown table from CSV-style rows</p><label for="value">Input</label><textarea id="value" placeholder="Enter rows; separate columns with commas"></textarea><button id="run">Generate</button><output id="result" aria-live="polite">Your result will appear here.</output><div class="meta">Frontend Development Journey · Practice 297</div></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{out.style.background='#f1f5f9';out.style.color='#0f172a';const rows=v.value.split('\n').map(r=>r.split(',').map(x=>x.trim()));if(!rows.length||!rows[0].length)out.textContent='Enter table rows';else{const widths=rows[0].map((_,i)=>Math.max(3,...rows.map(r=>(r[i]||'').length)));const line=r=>'| '+widths.map((w,i)=>(r[i]||'').padEnd(w)).join(' | ')+' |';out.textContent=[line(rows[0]),'| '+widths.map(w=>'-'.repeat(w)).join(' | ')+' |',...rows.slice(1).map(line)].join('\n');}};</script></body></html>
