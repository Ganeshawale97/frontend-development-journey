<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Gradient Generator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font:16px system-ui}.app{width:min(94vw,600px);padding:30px;background:white;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 16px 48px #0f172a12}h1{margin:0 0 8px}p{color:#64748b;line-height:1.5}textarea{width:100%;min-height:110px;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#334155;color:white;font:inherit;cursor:pointer}output{display:block;min-height:54px;margin-top:18px;padding:14px;border-radius:10px;background:#f1f5f9;white-space:pre-wrap;overflow-wrap:anywhere}.meta{margin-top:16px;color:#94a3b8;font-size:12px}</style></head><body><main class="app"><h1>CSS Gradient Generator</h1><p>Generate a linear gradient CSS declaration</p><label for="value">Input</label><textarea id="value" placeholder="Enter two colors e.g. #ff0000, #0000ff"></textarea><button id="run">Generate</button><output id="result" aria-live="polite">Your result will appear here.</output><div class="meta">Frontend Development Journey · Practice 298</div></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{out.style.background='#f1f5f9';out.style.color='#0f172a';const a=v.value.split(',').map(x=>x.trim());if(a.length!==2||a.some(x=>!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(x)))out.textContent='Enter two hex colors';else{const css='background: linear-gradient(135deg, '+a.join(', ')+');';out.textContent=css;out.style.background='linear-gradient(135deg,'+a.join(',')+')';out.style.color='#111827';}};</script></body></html>
