<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Box Shadow Builder</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font:16px system-ui}.app{width:min(94vw,600px);padding:30px;background:white;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 16px 48px #0f172a12}h1{margin:0 0 8px}p{color:#64748b;line-height:1.5}textarea{width:100%;min-height:110px;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#334155;color:white;font:inherit;cursor:pointer}output{display:block;min-height:54px;margin-top:18px;padding:14px;border-radius:10px;background:#f1f5f9;white-space:pre-wrap;overflow-wrap:anywhere}.meta{margin-top:16px;color:#94a3b8;font-size:12px}</style></head><body><main class="app"><h1>CSS Box Shadow Builder</h1><p>Generate a CSS box-shadow value</p><label for="value">Input</label><textarea id="value" placeholder="Enter x, y, blur, spread, color e.g. 0,4,12,0,#0003"></textarea><button id="run">Generate</button><output id="result" aria-live="polite">Your result will appear here.</output><div class="meta">Frontend Development Journey · Practice 299</div></main><script>const v=document.querySelector('#value'),out=document.querySelector('#result');document.querySelector('#run').onclick=()=>{out.style.background='#f1f5f9';out.style.color='#0f172a';const a=v.value.split(',').map(x=>x.trim());const nums=a.slice(0,4).map(Number);if(a.length!==5||nums.some(x=>!Number.isFinite(x))||!/^#([0-9a-f]{3,8})$/i.test(a[4]))out.textContent='Enter x,y,blur,spread and a hex color';else out.textContent='box-shadow: '+nums.slice(0,2).map(x=>x+'px').join(' ')+' '+nums[2]+'px '+nums[3]+'px '+a[4]+';';};</script></body></html>
