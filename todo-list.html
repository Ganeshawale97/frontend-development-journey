<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        .controls { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; }
        button { padding: 10px 14px; cursor: pointer; }
        li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; }
        .done { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <h1>My To-Do List</h1>
    <p>Add tasks, mark them complete, or remove them.</p>
    <form id="taskForm" class="controls">
        <input id="taskInput" type="text" placeholder="Enter a task" required>
        <button type="submit">Add</button>
    </form>
    <ul id="taskList"></ul>
    <script>
        const form = document.getElementById("taskForm");
        const input = document.getElementById("taskInput");
        const list = document.getElementById("taskList");

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            const taskText = input.value.trim();
            if (!taskText) return;

            const item = document.createElement("li");
            const label = document.createElement("span");
            label.textContent = taskText;
            label.tabIndex = 0;
            label.setAttribute("role", "button");
            label.setAttribute("aria-label", "Mark task complete");
            function toggleDone() { label.classList.toggle("done"); }
            label.addEventListener("click", toggleDone);
            label.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    toggleDone();
                }
            });

            const removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.textContent = "Delete";
            removeButton.addEventListener("click", function () { item.remove(); });

            item.append(label, removeButton);
            list.appendChild(item);
            input.value = "";
            input.focus();
        });
    </script>
</body>
</html>
